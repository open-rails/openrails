services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    environment:
      POSTGRES_DB: openrails_db
      # The PRIVILEGED role. It exists for DDL only: the bootstrap init SQL and
      # `openrails migrate up`. Nothing else in this stack connects as it — see
      # the openrails service below.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "${DB_ADMIN_PASSWORD:-admin_password}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      # PG18+ requires the mount at /var/lib/postgresql (not .../data) so it can
      # manage the version-specific data subdirectory (e.g. 18/main) itself.
      - postgres_data:/var/lib/postgresql
      # Bootstrap SQL runs automatically during first initialization
      - ./migrations/bootstrap/0001_postgres_init.sql:/docker-entrypoint-initdb.d/0001_postgres_init.sql:ro
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - log_min_messages=warning
      - -c
      - client_min_messages=warning
      - -c
      - log_error_verbosity=terse
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=error
      - -c
      - log_min_duration_statement=-1
    networks:
      - local-openrails
    healthcheck:
      # Verify bootstrap completed by checking the OpenRails schema exists (#471: default schema is `openrails`).
      test: ["CMD-SHELL", "pg_isready -U admin -d openrails_db -h localhost && psql -U admin -d openrails_db -tAc \"SELECT 1 FROM pg_namespace WHERE nspname='openrails'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 5
  
  garnet:
    image: redis:7-alpine
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${GARNET_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - local-openrails

  openrails-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ENV has no default in the binary and config.Load refuses an empty one,
      # so the migrate service must declare it too — without this the stack
      # never gets past migrations.
      ENV: "${ENV:-development}"
      TEST_MODE: "${TEST_MODE:-sandbox}"
      # Database connection over the compose network.
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "openrails_db"
      # Migrations are the ONE job that legitimately needs the privileged role
      # (DDL, GRANTs, role creation). Everything else runs as openrails_app.
      DB_USERNAME: "admin"
      DB_PASSWORD: "${DB_ADMIN_PASSWORD:-admin_password}"
      DB_SSLMODE: "disable"
    command: ["migrate", "up"]
    restart: "no"
    networks:
      - local-openrails

  # Dev-only role plumbing. `0001_schema.up.sql` creates openrails_app
  # NOLOGIN NOBYPASSRLS and GRANTs it everything the server needs; a real
  # deployment attaches the LOGIN credential out of band (Vault, cloud IAM).
  # Local dev has no such channel, so this one-shot service attaches a
  # throwaway password after migrations run. It grants no privilege — the role
  # stays NOBYPASSRLS, so every merchant_isolation policy applies to the local
  # server exactly as it does in production.
  openrails-app-role:
    image: postgres:18-bookworm
    depends_on:
      openrails-migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: "${DB_ADMIN_PASSWORD:-admin_password}"
    entrypoint: ["psql"]
    command:
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-h"
      - "postgres"
      - "-U"
      - "admin"
      - "-d"
      - "openrails_db"
      - "-c"
      - "ALTER ROLE openrails_app WITH LOGIN PASSWORD '${DB_PASSWORD:-openrails_app_password}'"
    restart: "no"
    networks:
      - local-openrails

  # OpenRails service (HTTP server only)
  openrails:
    profiles: ["all", "openrails"]
    build:
      context: .
      dockerfile: Dockerfile
    # Avoid infinite restart loops if the app panics at startup
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      openrails-migrate:
        condition: service_completed_successfully
      openrails-app-role:
        condition: service_completed_successfully
      garnet:
        condition: service_healthy
    ports:
      # Single public API surface. Server-to-server callers authenticate with
      # generated API keys or first-party service JWTs on this same port
      # (issue #222) — there is no separate private/mTLS service port.
      - "127.0.0.1:${OPENRAILS_HOST_PORT:-3053}:3053"  # API (public + admin + service credential routes)
    environment:
      # Service runtime mode. ENV is REQUIRED by config.Load (SEC-18) — it has
      # no default in the binary, because the permissive posture (plaintext
      # merchant secrets) is the development one. The DB role is NOT one of
      # those relaxations: EnforceRLSPosture refuses to boot on a
      # superuser/BYPASSRLS role in EVERY environment, development included.
      ENV: "${ENV:-development}"
      TEST_MODE: "${TEST_MODE:-sandbox}"
      PORT: "3053"
      API_URL: "${API_URL:-http://localhost:3053}"
      AUTH_ISSUER: "${AUTH_ISSUER:-http://localhost:3053}"
      # AuthKit signing keys for OpenRails' own issuer (read once at
      # config.Load, never by the authkit library itself — #712/#231; names
      # AUTHKIT_-prefixed since ak#266/or#917, matching the authkit binary):
      #   1. AUTHKIT_ACTIVE_KEY_ID / AUTHKIT_ACTIVE_PRIVATE_KEY_PEM /
      #      AUTHKIT_PUBLIC_KEYS envs, or
      #   2. AUTHKIT_KEYS_PATH/keys.json injected by Vault/External Secrets, or
      #   3. development-only generated keys persisted at /.runtime/authkit.
      AUTHKIT_KEYS_PATH: "${AUTHKIT_KEYS_PATH:-/vault/auth}"
      AUTHKIT_ACTIVE_KEY_ID: "${AUTHKIT_ACTIVE_KEY_ID:-}"
      AUTHKIT_ACTIVE_PRIVATE_KEY_PEM: "${AUTHKIT_ACTIVE_PRIVATE_KEY_PEM:-}"
      AUTHKIT_PUBLIC_KEYS: "${AUTHKIT_PUBLIC_KEYS:-}"
      # Closed-registration provisioning is explicit:
      #   openrails push-merchant-config -c /etc/openrails/config.yaml -f /etc/openrails/merchants.yaml
      #   openrails push-auth-bootstrap -c /etc/openrails/config.yaml -f /etc/openrails/bootstrap.yaml
      #   openrails push-merchant-catalog -c /etc/openrails/config.yaml -f /etc/openrails/catalog.yaml
      # Auth authority and provider credentials are merchant configuration, not
      # config/env runtime infrastructure.

      # Database connection. The SERVER connects as openrails_app — the same
      # unprivileged NOBYPASSRLS role production uses — so per-merchant RLS
      # policies constrain local dev exactly as they constrain production. A
      # query that forgets its merchant scope returns zero rows HERE, on the
      # developer's laptop, instead of silently in production (or#782). Only
      # openrails-migrate gets the privileged role.
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "openrails_db"
      DB_USERNAME: "${DB_USERNAME:-openrails_app}"
      DB_PASSWORD: "${DB_PASSWORD:-openrails_app_password}"
      DB_SSLMODE: "disable"
      # Redis connection
      REDIS_ADDR: "garnet:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
    command: ["run-server"]
    volumes:
      - openrails_spool:/var/lib/openrails/spool
      - openrails_runtime_keys:/.runtime/authkit
      - ${AUTHKIT_KEYS_HOST_DIR:-./.secrets/authkit}:/vault/auth:ro
    networks:
      - local-openrails

  # ---------------------------------------------------------------------------
  # E2E SANDBOX: Local AuthKit issuer for minting JWTs (optional)
  # ---------------------------------------------------------------------------
  # This is used for end-to-end sandbox testing where OpenRails needs a real issuer
  # that serves JWKS and can mint JWTs on demand.
  #
  # Start with:
  #   docker compose -f docker-compose.yaml --profile all --profile e2e-sandbox up -d
  #
  # Then mint tokens:
  #   curl -fsS http://localhost:8081/api/v1/dev/mint ...
  issuer:
    profiles: ["e2e-sandbox"]
    image: "${AUTHKIT_DEVSERVER_IMAGE:-authkit-devserver:local}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: "dev"
      DEVSERVER_LISTEN_ADDR: ":8080"
      DEVSERVER_ISSUER: "http://issuer:8080"
      DEVSERVER_ISSUED_AUDIENCES: "openrails-app"
      DEVSERVER_EXPECTED_AUDIENCES: "openrails-app"
      # The AuthKit devserver runs its OWN migrations, so it needs the
      # privileged role. It is a dev-sandbox issuer, not OpenRails.
      DB_URL: "postgres://admin:${DB_ADMIN_PASSWORD:-admin_password}@postgres:5432/openrails_db?sslmode=disable"
      DEVSERVER_DEV_MODE: "true"
      DEVSERVER_DEV_MINT_SECRET: "${AUTHKIT_DEV_MINT_SECRET:-dev-mint-secret-localhost-only}"
      DEVSERVER_REGISTRATION_VERIFICATION: "none"
    ports:
      - "127.0.0.1:${AUTHKIT_ISSUER_HOST_PORT:-8081}:8080"
    volumes:
      - issuer_postgres_data:/var/lib/postgresql
      - issuer_runtime_keys:/.runtime/authkit
    networks:
      - local-openrails

volumes:
  postgres_data:
  redis_data:
  go_mod_cache:
    external: true
    name: go_mod_cache_persistent
  openrails_spool:
  openrails_runtime_keys:
  issuer_postgres_data:
  issuer_runtime_keys:

networks:
  local-openrails:
    name: local-openrails
