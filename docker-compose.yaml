services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    environment:
      POSTGRES_DB: openrails_db
      # One role: migrations create OpenRails' objects as it, the server runs as it.
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app_password}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      # PG18+ requires the mount at /var/lib/postgresql (not .../data) so it can
      # manage the version-specific data subdirectory (e.g. 18/main) itself.
      - postgres_data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - log_min_messages=warning
      - -c
      - client_min_messages=warning
      - -c
      - log_error_verbosity=terse
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=error
      - -c
      - log_min_duration_statement=-1
    networks:
      - local-openrails
    healthcheck:
      # Migrations run after readiness and create the configured billing schema.
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}", "-d", "openrails_db", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 5
  
  # Valkey: the BSD-licensed, drop-in Redis fork
  valkey:
    image: valkey/valkey@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc # 8-alpine (8.1.12)
    cpus: 0.5
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - local-openrails

  # The event store usage needs; the server's default clickhouse.url.
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7 # 26.8.36.3
    cpus: 2.0
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      # The default user, without a password, reachable through the
      # loopback-only port.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - local-openrails

  # Vault holds merchant configuration (vault.kv_mount): a dev server, in
  # memory, unsealed, on loopback, the image and token CI's critical suite runs.
  vault:
    image: hashicorp/vault@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2 # 2.1.1
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: openrails-dev-root # development only (Taskfile.yaml's DEV_VAULT_TOKEN)
      VAULT_ADDR: http://127.0.0.1:8200 # the healthcheck's CLI
    ports:
      - "127.0.0.1:${VAULT_HOST_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - local-openrails

  # Mounts what OpenRails reads: KV v2 at kv (VAULT_KV_MOUNT=kv) and Transit
  # at transit, the default vault.transit_mount. In memory, Vault forgets them
  # on restart: `task dev` runs this again; existing mounts are kept.
  vault-init:
    image: hashicorp/vault@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2 # 2.1.1
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: openrails-dev-root
    entrypoint: ["sh", "-ec"]
    command:
      - |
        vault secrets list -format=json > /tmp/mounts
        grep -q '"kv/"' /tmp/mounts || vault secrets enable -path=kv kv-v2
        grep -q '"transit/"' /tmp/mounts || vault secrets enable transit
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - local-openrails

  # OpenRails service (HTTP server only)
  openrails:
    profiles: ["openrails"]
    build:
      context: .
      dockerfile: Dockerfile
    # Avoid infinite restart loops if the app panics at startup
    restart: on-failure:3
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      # Single public API surface. Server-to-server callers authenticate with
      # generated API keys or first-party service JWTs on this same port
      # (issue #222) — there is no separate private/mTLS service port.
      - "127.0.0.1:${PORT:-3053}:3053"  # API (public + admin + service credential routes)
    environment:
      # Service wiring only; the loader supplies every other default
      # (docs/standalone.md, configuration reference).
      # Every interface in the container; the port above is published on
      # loopback only. Off loopback the server refuses a database holding
      # `task dev`'s operator.
      HOST: 0.0.0.0
      PUBLIC_URL: "http://localhost:${PORT:-3053}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/openrails_db?sslmode=disable"
      REDIS_URL: "redis://valkey:6379"
      CLICKHOUSE_URL: "clickhouse://clickhouse:9000/openrails"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: openrails-dev-root
      VAULT_KV_MOUNT: kv
    command: ["run-server"]
    volumes:
      # AuthKit writes development keys (keys.json, totp.key) to the volume,
      # so restarts keep sessions and authenticator enrollments.
      - openrails_auth_keys:/vault/auth
    networks:
      - local-openrails

volumes:
  postgres_data:
  valkey_data:
  clickhouse_data:
  openrails_auth_keys:

networks:
  local-openrails:
    name: local-openrails
