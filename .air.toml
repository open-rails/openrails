# Air configuration for hot-reload development
# https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# The binary is server/cmd/openrails, in the server module, and `bin` is the
# air key that names the built artifact — `entrypoint` is not an air key, so
# air silently fell back to its ./tmp/main default and could never have
# launched a ./tmp/main.exe build. Both halves were broken (#886).
cmd = "cd server && go build -buildvcs=false -o ../tmp/openrails ./cmd/openrails"
bin = "./tmp/openrails"
args_bin = ["run-server"]

# Migrations are embedded .sql files.
include_ext = ["go", "sql"]
exclude_dir = [
  ".cache",
  ".claude",
  ".git",
  ".gocache",
  ".gomodcache",
  ".opencode",
  ".runtime",
  ".secrets",
  ".task",
  "agents",
  "bin",
  "docs",
  "examples",
  "frontend",
  "migrations",
  "scripts",
  "static",
  "tests",
  "tmp",
  "vendor",
  "web/billing-ui/node_modules",
  "web/billing-ui/dist",
  "web/console/node_modules",
  "web/console/dist",
  "web/pay/node_modules",
  "web/pay/dist",
]

# Avoid inotify watcher limits in large repos/containers.
poll = true
poll_interval = 1000

log = "air.log"

# It's not necessary to trigger build each time file changes if it's too frequent.
delay = 1000 # ms

# Stop running old binary when build errors occur.
stop_on_error = true

# Send Interrupt signal before killing process (windows does not support this feature)
send_interrupt = false

# Delay after sending Interrupt signal
kill_delay = 500 # ms

[log]
  # Show log time
  time = true
  # Only show main log (silences watcher, build, runner)
  main_only = false

[color]
  # task dev pipes Air through tee into tmp/dev.log: color without a terminal.
  mode = "always"
  # Customize each part's color. If no color found, use the raw app log.
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Keep tmp/dev.log, the last run's output, after Air exits.
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
  keep_scroll = true
