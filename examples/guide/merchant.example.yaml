# A merchant with one PSP on each rail, as Config.Merchants reads it (in a
# standalone manifest, under merchants.<slug>). Real secrets go in Vault, or
# in a manifest mounted from a secret, never in a committed file.
slug: shop
display_name: Shop
# guide:psps
psps:
  nmi-main: # your name for the account; any key
    rail: nmi
    environment: sandbox # live (the default) | test | sandbox
    gateway_id: "1234567" # the NMI dashboard's Gateway ID
    tokenization_key: your-public-collect-js-key
    secrets:
      security_key: your-private-security-key
      webhook_signing_secret: your-webhook-signing-key
  stripe:
    rail: stripe
    environment: test # live | test; the keys' prefixes must agree
    account_id: acct_1Example0Account0
    publishable_key: pk_test_your-key # Elements, Apple Pay and Google Pay
    secrets:
      secret_key: sk_test_your-key # or a restricted rk_test_ key
      webhook_signing_secret: whsec_your-secret
  ccbill:
    rail: ccbill
    environment: sandbox # live | sandbox
    client_accnum: "900000" # quoted: YAML reads 0000 as 0
    client_subacc: "0000"
    secrets:
      salt: your-flexform-salt
      datalink_username: your-datalink-user # optional pair: cancels and reads
      datalink_password: your-datalink-password
  solana:
    rail: solana
    environment: devnet # mainnet | devnet | testnet
    treasury: 9hSR6S7WPtxmTojgo6GG3k4yDPecgJY292j7xrsUGWBu # where every payment lands
# guide:end
# guide:trust-tiers
billing_policies:
  - name: starter
    spend_windows: [{key: month, window_seconds: 2592000, limit: "100000000", currency: USD}] # $100 a month
  - name: tier-1
    spend_windows: [{key: month, window_seconds: 2592000, limit: "500000000", currency: USD}]
  - name: tier-2
    spend_windows: [{key: month, window_seconds: 2592000, limit: "5000000000", currency: USD}]
billing_policy_bindings:
  - {policy: starter} # every customer below tier-1
  - {policy: tier-1, tier: tier-1}
  - {policy: tier-2, tier: tier-2}
trust_tiers: # lowest first; amounts in native units (USD micros)
  - name: tier-1
    requirements: [{currency: USD, net_paid_amount: "5000000"}] # $5 paid
  - name: tier-2
    requirements: [{currency: USD, net_paid_amount: "50000000", days_since_first_payment: 7}] # $50 and a week
# guide:end
# guide:messages
messages:
  default_language: en
  events:
    premium_renewed:
      enabled: true # on, with its built-in message
    one_off_purchase_completed:
      templates:
        en:
          subject: "Your {{.Merchant.Name}} receipt"
          text: "You paid {{.Event.Amount}} for {{.Event.ProductName}}."
          html: "<p>You paid <strong>{{.Event.Amount}}</strong> for {{.Event.ProductName}}.</p>"
  layouts:
    en:
      text: |
        {{template "body" .}}
        -- {{.Merchant.Name}}
# guide:end
