# The stack with NMI played by a fake inside the server, and the browser tests
# in web/e2e run inside the server's network namespace, so the browser sees
# the localhost URLs a person does. Nothing is published on the host.
#
#   cp openrails/merchant.example.yaml openrails/merchant.yaml  # its placeholder keys suit the fake gateway
#   (cd web && pnpm install)
#   OPENRAILS_CLIENT_SECRET=$(openssl rand -hex 32) \
#     docker compose -f compose.yaml -f compose.e2e.yaml run --rm e2e
#   docker compose -f compose.yaml -f compose.e2e.yaml down -v
services:
  openrails: # the server/ci/standalone fixture: run-server with an in-process NMI fake
    build: { args: { MAIN: ./ci/standalone } }
    image: openrails-example-e2e-server
    command: [--config, /etc/openrails/config.yaml, --merchant-manifest, /etc/openrails/merchant.yaml, --max-lifetime, 1h]
    ports: !reset []
    environment:
      RATE_LIMITS_DISABLED: "true" # every purchase comes from one browser

  mailpit:
    ports: !reset []

  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    network_mode: service:openrails
    working_dir: /example/web
    volumes:
      - ./:/example
    environment:
      E2E_BASE_URL: http://localhost:8080
      E2E_USERS: reader1,reader2,reader3,reader4
      E2E_PASSWORD: correct horse battery staple
    command: [sh, -c, "node ../e2e-seed.mjs && npx playwright test --output /tmp/test-results"] # results stay in the container
    depends_on:
      app: { condition: service_healthy }
      catalog: { condition: service_completed_successfully }
