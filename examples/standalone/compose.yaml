# The standalone stack: PostgreSQL 18, Redis, the OpenRails server from its
# release image, the catalog applied once, Mailpit for mail, and this app.
# The server and the app share one network namespace, as in a Kubernetes
# pod, so each reaches the other at the localhost URLs in
# openrails/config.yaml, which are the browser's too.
#
#   cp openrails/merchant.example.yaml openrails/merchant.yaml  # your NMI sandbox account
#   OPENRAILS_CLIENT_SECRET=$(openssl rand -hex 32) docker compose up -d --build
#
# The store is http://localhost:8080, the server http://localhost:3053, and
# Mailpit's inbox http://localhost:8025.
name: openrails-standalone-example

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: openrails
      POSTGRES_PASSWORD: openrails
      POSTGRES_DB: openrails # the server's; postgres-init.sql adds the app's, courses
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/courses.sql:ro
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openrails"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - 127.0.0.1:8025:8025 # the inbox: verification codes and receipts

  openrails:
    image: docker.io/openrails/openrails:v0.235.0
    command: [run-server, --config, /etc/openrails/config.yaml, --merchant-manifest, /etc/openrails/merchant.yaml]
    volumes:
      - ./openrails:/etc/openrails:ro
      - openrails-keys:/vault/auth # the server's signing key (auth.keys.path)
    ports:
      - 127.0.0.1:3053:3053 # the server
      - 127.0.0.1:8080:8080 # the app, in this network namespace
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  catalog: # applies catalog.yaml once; an unchanged document is a no-op
    image: docker.io/openrails/openrails:v0.235.0
    command: [apply-catalog, --config, /etc/openrails/config.yaml, --merchant-manifest, /etc/openrails/merchant.yaml, --merchant, onlydemo, --file, /catalog/catalog.yaml]
    volumes:
      - ./openrails:/etc/openrails:ro
      - ./catalog.yaml:/catalog/catalog.yaml:ro
    depends_on:
      openrails: { condition: service_healthy }

  app:
    build:
      context: ../..
      dockerfile: examples/standalone/Dockerfile
    network_mode: service:openrails
    environment:
      DATABASE_URL: postgres://openrails:openrails@postgres:5432/courses?sslmode=disable
      OPENRAILS_CLIENT_SECRET: ${OPENRAILS_CLIENT_SECRET:?set OPENRAILS_CLIENT_SECRET to 32 or more random bytes}
      EMAIL_SMTP_HOST: mailpit
    depends_on:
      openrails: { condition: service_healthy }

volumes:
  postgres:
  openrails-keys:
