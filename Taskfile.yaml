version: "3"

vars:
  BINARY_NAME: openrails
  BIN_DIR: bin
  SQLC_VERSION: v1.31.1
  SQLC: go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
  GIT_COMMIT:
    sh: git rev-parse HEAD
  GIT_TAG:
    sh: git describe --tags --always --dirty
  LDFLAGS: '-X main.Version={{.GIT_TAG}} -X main.Commit={{.GIT_COMMIT}}'

tasks:
  default:
    cmds:
      - task -l

  build:
    desc: Build the binary locally
    cmds:
      - echo "Building {{.BINARY_NAME}}..."
      - mkdir -p {{.BIN_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.BINARY_NAME}} ./cmd/openrails

  admin-build:
    desc: Build the admin console SPA into cmd/openrails/consoleassets/dist (gitignored, #754). Embed it with `task build-console-binary`.
    cmds:
      - ./scripts/build-admin-console.sh cmd/openrails/consoleassets/dist

  build-console-binary:
    desc: Build the standalone binary WITH the admin console embedded (admin-build + `go build -tags console_assets`)
    deps: [admin-build]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags console_assets -ldflags "{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.BINARY_NAME}} ./cmd/openrails

  run:
    desc: Build and run the application server
    deps: [build]
    cmds:
      - echo "Running {{.BINARY_NAME}}..."
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} server

  dev:
    desc: Run the application in development mode with hot reload
    cmds:
      - echo "Running in development mode with Air..."
      - air -c .air.toml

  docker-up:
    desc: Start local docker compose stack (openrails + deps)
    cmds:
      - docker compose -f docker-compose.yaml --profile all up -d

  docker-up-e2e-sandbox:
    desc: Start local stack + AuthKit issuer (for sandbox/E2E JWT minting)
    cmds:
      - docker compose -f docker-compose.yaml --profile all --profile e2e-sandbox up -d

  docker-down:
    desc: Stop local docker compose stack
    cmds:
      # --profile all: without it, profiled services (openrails) are left running.
      - docker compose -f docker-compose.yaml --profile all --profile e2e-sandbox down

  docker-logs:
    desc: Tail openrails logs from docker compose stack
    cmds:
      - docker compose -f docker-compose.yaml logs -f openrails

  tunnel-webhooks:
    desc: Run cloudflared tunnel for deterministic webhook hostname (requires CLOUDFLARED_TUNNEL_TOKEN)
    cmds:
      - bash scripts/webhook_tunnel.sh

  verify-webhook-tunnel:
    desc: Verify Cloudflared routing reaches local openrails (/health/live + /health/ready)
    cmds:
      - bash scripts/verify_webhook_tunnel.sh

  mint-jwt:
    desc: Mint a JWT from local AuthKit devserver (requires docker-up-e2e-sandbox + AUTHKIT_DEV_MINT_SECRET)
    cmds:
      - bash scripts/mint_jwt.sh

  e2e-dump-local:
    desc: Dump local rows for current E2E_RUN_ID/E2E_USER_ID
    cmds:
      - bash scripts/e2e_dump_local.sh

  nmi-query:
    desc: Call NMI Query API (requires NMI_QUERY_SECURITY_KEY)
    cmds:
      - bash scripts/nmi_query.sh {{if .TXN_ID}}--transaction-id "{{.TXN_ID}}"{{end}} {{if .SUB_ID}}--subscription-id "{{.SUB_ID}}"{{end}}

  e2e-nmi-live:
    desc: Run the live NMI sandbox payment lifecycle E2E (Go integration test against the real sandbox; needs NMI_SANDBOX_SECURITY_KEY in .env)
    dotenv: ['.env']
    cmds:
      - bash scripts/test_integration.sh ./tests -run TestNMILiveLifecycleE2E

  sqlc:
    desc: Regenerate internal/db/gen from internal/db/queries and vet every query (PREPARE against a fresh DB built from migrations/)
    env:
      # generate (database-backed analyzer) and vet (db-prepare) both need a
      # live DB whose schema == migrations/. Use the caller's SQLC_DATABASE_URL
      # if set; otherwise build the throwaway vet DB on the local compose
      # postgres and use that.
      SQLC_DATABASE_URL:
        sh: 'if [ -n "${SQLC_DATABASE_URL:-}" ]; then echo "$SQLC_DATABASE_URL"; else scripts/sqlc-vet-db.sh; fi'
    cmds:
      - '{{.SQLC}} generate'
      - '{{.SQLC}} vet'

  sqlc-check:
    desc: CI gate — sqlc generate + vet + query audit + SQL discipline lints
    env:
      # One throwaway vet DB serves generate, vet and the auditor (rebuilding it
      # per step would triple the cost of the job).
      SQLC_DATABASE_URL:
        sh: 'if [ -n "${SQLC_DATABASE_URL:-}" ]; then echo "$SQLC_DATABASE_URL"; else scripts/sqlc-vet-db.sh; fi'
    cmds:
      - '{{.SQLC}} generate'
      - '{{.SQLC}} vet'
      - git diff --exit-code -- internal/db/gen
      # Efficiency+safety gate: EXPLAIN every query, walk the plan, apply rules.
      # CGO_ENABLED=1 is mandatory, not incidental: sqlaudit is `//go:build cgo`
      # (pg_query_go links the real Postgres parser) so that CGO_ENABLED=0
      # builds of ./... stay green — without it the gate would silently match no
      # packages and pass.
      - CGO_ENABLED=1 go test ./internal/db/sqlaudit/ -run TestQueryAudit -count=1
      - bash scripts/sql-lint.sh
      - bash scripts/migration-lint.sh

  sql-lint:
    desc: Fail on raw SQL outside internal/db/gen (see internal/db/queries/LINT_ALLOWLIST.txt)
    cmds:
      - bash scripts/sql-lint.sh

  migration-lint:
    desc: Lock-safety lint (squawk) for migrations added after the .squawk.toml baseline
    cmds:
      - bash scripts/migration-lint.sh

  test:
    desc: Run tests
    cmds:
      - bash scripts/check_business_time.sh
      - echo "Running tests..."
      - go test -v -race ./...
      - echo "Running integration tests..."
      - task test-integration-core

  test-integration:
    desc: Run core Docker-backed integration tests serially
    deps: [test-integration-core]

  test-integration-core:
    desc: Run the local core integration tier against the shared compose stack
    cmds:
      - bash scripts/test_integration.sh ./tests ./embed ./internal/river ./pkg/service

  test-integration-all:
    desc: Run every integration package serially against the shared compose stack
    cmds:
      - bash scripts/test_integration.sh ./...

  test-query-contracts:
    desc: Run sqlc query-contract tests against a migrated Postgres
    cmds:
      - |
        if [ -n "${QUERY_TEST_DATABASE_URL:-}" ]; then
          export OPENRAILS_TEST_DB_URL="$QUERY_TEST_DATABASE_URL"
        fi
        go test -tags=integration -count=1 ./internal/db/querytest -run 'TestQueryContracts'

  test-query-perf:
    desc: Run large-seed query plan/perf checks against a migrated Postgres
    cmds:
      - |
        if [ -n "${QUERY_TEST_DATABASE_URL:-}" ]; then
          export OPENRAILS_TEST_DB_URL="$QUERY_TEST_DATABASE_URL"
        fi
        go test -tags=integration -count=1 ./internal/db/querytest -run 'TestQueryPerf'

  fmt:
    desc: Format code
    cmds:
      - echo "Formatting code..."
      - go fmt ./...
      - goimports -w .

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning..."
      - rm -f {{.BIN_DIR}}/{{.BINARY_NAME}}
      - rmdir {{.BIN_DIR}} 2>/dev/null || true
      - rm -f coverage.out coverage.html
      - go clean -cache
