version: "3"

vars:
  BINARY_NAME: openrails
  BIN_DIR: bin
  SQLC_VERSION: v1.31.1
  GOLANGCI_LINT_VERSION:
    sh: awk -F= '$1 == "GOLANGCI_LINT_VERSION" { print $2 }' tools/versions.conf
  # `go run …@version` compiles sqlc from source on a cold build cache — ~60s
  # in CI, every run. SQLC_BIN lets a caller supply an already-installed binary
  # of the SAME pinned version instead (scripts/ci-install-tool.sh sqlc, which
  # checksum-verifies the upstream release). Local dev needs no setup and keeps
  # the `go run` default.
  SQLC: '{{if .SQLC_BIN}}{{.SQLC_BIN}}{{else}}go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}{{end}}'

tasks:
  default:
    cmds:
      - task -l

  ci-local:
    desc: Run critical behavioral and static checks against owned disposable services
    cmds:
      - bash scripts/check.sh all

  build:
    desc: Build the binary locally (embeds web/console/dist when `task admin-build` has run; Go stamps the version from git)
    cmds:
      - echo "Building {{.BINARY_NAME}}..."
      - mkdir -p {{.BIN_DIR}}
      - cd server && go build -o ../{{.BIN_DIR}}/{{.BINARY_NAME}} ./cmd/openrails

  admin-build:
    desc: Build the admin console SPA into web/console/dist (gitignored, #754), which the binary go:embeds
    cmds:
      - bash scripts/build-admin-console.sh

  payment-page-build:
    desc: Build the payment page into web/pay/dist (gitignored), which the binary go:embeds
    cmds:
      - bash scripts/build-payment-page.sh

  run:
    desc: Build and run the application server
    deps: [build]
    cmds:
      - echo "Running {{.BINARY_NAME}}..."
      - ./{{.BIN_DIR}}/{{.BINARY_NAME}} run-server

  dev:
    desc: "Hot reload: the API under Air on :3053 and the merchant console under Vite at http://localhost:3054/admin/; Ctrl+C stops both"
    deps:
      # The browser's origin is Vite's, which proxies the API: it is the public URL sign-in checks.
      - task: dev:api
        vars: { PUBLIC_URL: "http://localhost:3054" }
      - dev:console
      - task: dev:operator
        vars: { PUBLIC_URL: "http://localhost:3054" }

  dev:api:
    desc: The API server under Air, rebuilt on every Go change
    env:
      # The one setting without a default; the rest are the Compose dependencies'.
      PUBLIC_URL: '{{.PUBLIC_URL | default "http://localhost:3053"}}'
    cmds:
      - air -c .air.toml

  dev:operator:
    desc: Seed this machine's dashboard operator (root:owner, random password kept in ~/.config/openrails-dev/operator.txt) once the local API is ready; refuses anything but localhost
    silent: true
    env:
      PUBLIC_URL: '{{.PUBLIC_URL | default "http://localhost:3053"}}'
    cmds:
      - cmd: |
          bash <<'BASH'
          set -euo pipefail
          loopback() { [[ "$1" =~ ^[a-z+]*://([^@/]*@)?(localhost|127\.0\.0\.1|\[::1\])(:[0-9]+)?(/|$) ]]; }
          loopback "$PUBLIC_URL" || { echo "dev:operator: PUBLIC_URL is not localhost; refusing to seed an operator" >&2; exit 1; }
          if [[ -n "${DATABASE_URL:-}" ]] && ! loopback "$DATABASE_URL"; then
            echo "dev:operator: DATABASE_URL is not localhost; refusing to seed an operator" >&2; exit 1
          fi
          dir="${XDG_CONFIG_HOME:-$HOME/.config}/openrails-dev"
          umask 077
          mkdir -p "$dir"
          if [[ ! -s "$dir/operator.txt" ]]; then
            printf 'email: operator@localhost.test\npassword: %s\n' "$(openssl rand -hex 16)" >"$dir/operator.txt"
          fi
          password="$(sed -n 's/^password: //p' "$dir/operator.txt")"
          cat >"$dir/bootstrap.yaml" <<EOF
          users:
            - email: operator@localhost.test
              username: operator
              email_verified: true
              password: { plaintext: "$password" }
              root_role: root:owner
          EOF
          for _ in $(seq 180); do curl -fsS -o /dev/null http://localhost:3053/health/ready 2>/dev/null && break; sleep 1; done
          ./tmp/openrails push-auth-bootstrap --file "$dir/bootstrap.yaml" >/dev/null
          printf '\n========================================\n OpenRails dashboard  %s/admin/\n email     operator@localhost.test\n password  %s\n========================================\n(task dev:login prints this again)\n\n' "$PUBLIC_URL" "$password"
          BASH
        ignore_error: true

  dev:login:
    desc: Print this machine's local dashboard sign-in
    silent: true
    env:
      PUBLIC_URL: '{{.PUBLIC_URL | default "http://localhost:3054"}}'
    cmds:
      - |
        f="${XDG_CONFIG_HOME:-$HOME/.config}/openrails-dev/operator.txt"
        [ -s "$f" ] || { echo "No local operator yet: run task dev." >&2; exit 1; }
        printf '\n========================================\n OpenRails dashboard  %s/admin/\n email     operator@localhost.test\n password  %s\n========================================\n\n' "$PUBLIC_URL" "$(sed -n 's/^password: //p' "$f")"

  dev:console:
    desc: The merchant console's Vite dev server on :3054, proxying the API on :3053 (builds billing-ui first; `task dev:billing-ui` rebuilds it live)
    dir: web/console
    cmds:
      - pnpm --dir ../billing-ui install --frozen-lockfile --prefer-offline
      - pnpm --dir ../billing-ui --config.verify-deps-before-run=false run build
      - pnpm install --frozen-lockfile --prefer-offline
      - pnpm --config.verify-deps-before-run=false dev

  dev:billing-ui:
    desc: Rebuild billing-ui on every change, so the running console picks up edits to its admin components
    dir: web/billing-ui
    deps: [dev:billing-ui:lib, dev:billing-ui:admin]

  dev:billing-ui:lib:
    internal: true
    dir: web/billing-ui
    cmds:
      - pnpm --config.verify-deps-before-run=false exec vite build --watch --no-emptyOutDir

  dev:billing-ui:admin:
    internal: true
    dir: web/billing-ui
    cmds:
      - pnpm --config.verify-deps-before-run=false exec vite build --config vite.admin.config.ts --watch

  sqlc:
    desc: Generate SQL bindings and prepare every query against a disposable migrated database
    env:
      SQLC_DATABASE_URL:
        sh: 'if [ -n "${SQLC_DATABASE_URL:-}" ]; then echo "$SQLC_DATABASE_URL"; else scripts/sqlc-vet-db.sh; fi'
    cmds:
      - 'test -n "$SQLC_DATABASE_URL"'
      - '{{.SQLC}} generate'
      - '{{.SQLC}} vet'

  sqlc-check:
    desc: Verify SQL bindings and query preparation
    cmds:
      - task: sqlc
      - git diff --exit-code -- internal/db/gen

  lint:
    desc: golangci-lint over the root, server and AuthKit adapter modules
    cmds:
      # Pinned: a floating version silently changes what the gate means.
      - |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          echo "golangci-lint not found. Install the pinned version:" >&2
          echo "  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}" >&2
          exit 1
        fi
        expected="{{.GOLANGCI_LINT_VERSION}}"
        case "$(golangci-lint version)" in
          *" version ${expected#v} "*) ;;
          *)
            echo "golangci-lint ${expected} is required. Install the pinned version:" >&2
            echo "  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${expected}" >&2
            exit 1
            ;;
        esac
      - golangci-lint run --timeout=15m ./...
      - cd server && golangci-lint run --timeout=15m --config ../.golangci.yaml ./...
      - cd adapters/authkit && golangci-lint run --timeout=15m --config ../../.golangci.yaml ./...

  test:
    desc: Run tests
    cmds:
      - bash scripts/check.sh all

  fmt:
    desc: Format code
    cmds:
      - echo "Formatting code..."
      - gofmt -w $(git ls-files '*.go')
      - goimports -w .

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning..."
      - rm -f {{.BIN_DIR}}/{{.BINARY_NAME}}
      - rmdir {{.BIN_DIR}} 2>/dev/null || true
      - rm -f coverage.out coverage.html
