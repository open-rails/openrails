version: 1
# Registration is purely "this tenant, these issuers, these JWKS URIs". A tenant
# has full authority over its own resources, so there is no per-issuer permission
# grant to declare; a validly-signed token from a registered issuer self-asserts
# its permissions and is scoped to its own tenant. `audiences` is optional and
# defaults to "openrails" when omitted.
tenants:
  - slug: local-stack
    name: Local Stack
    issuers:
      - issuer: "http://doujins:8080"
        jwks_uri: "http://doujins:8080/.well-known/jwks.json"
      - issuer: "http://hentai0:8081"
        jwks_uri: "http://hentai0:8081/.well-known/jwks.json"
