version: 1
tenants:
  - slug: local-stack
    name: Local Stack
    issuers:
      - issuer: "http://doujins:8080"
        jwks_uri: "http://doujins:8080/.well-known/jwks.json"
        audiences:
          - "openrails-app"
      - issuer: "http://hentai0:8081"
        jwks_uri: "http://hentai0:8081/.well-known/jwks.json"
        audiences:
          - "openrails-app"
    service_jwt_principals:
      - issuer: "http://doujins:8080"
        subject: "service:doujins-runtime"
        permissions:
          - "openrails:entitlements:read"
        resources:
          - kind: "openrails.tenant"
            id: "$tenant"
      - issuer: "http://hentai0:8081"
        subject: "service:hentai0-runtime"
        permissions:
          - "openrails:entitlements:read"
        resources:
          - kind: "openrails.tenant"
            id: "$tenant"
