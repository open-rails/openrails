users:
  - email: operator@example.com
    username: operator
    email_verified: true
    password:
      # Required: a unique passphrase of your own. Empty is refused, so the
      # example never seeds a known root password. A hash (hash, algo) or
      # reset_required: true also works.
      plaintext: ""
    root_role: root:owner

remote_applications:
  - issuer: https://openrails.example
    jwks_uri: https://openrails.example/.well-known/jwks.json
    enabled: true
