      # ── Arbitrary credit top-up (#639 + #640) ──────────────────────────────
      # Buy ANY amount of image credits — no fixed packs. Larger purchases earn a
      # better per-credit rate via GRADUATED volume tiers, which stay monotonic so
      # the quote works in BOTH directions (enter $ → credits, or enter credits →
      # $). #640's review: graduated avoids the volume-mode "buy 1 more, total
      # price drops" cliff and the inversion ambiguity of bonus_credits tiers.
      # Credits deposit into the SAME `ai-image-gen` balance as the memberships.
      # Loader parses + validates; checkout/quote wiring is a #639 task.
      - key: image-credit-topup
        display_name: AI Image Credits
        description: Buy any amount of image credits; bigger purchases get a better rate.
        tier_group: ai-credit-topups
        credit_purchase:
          credit_type: ai-image-gen        # same balance the membership grants top up
          unit: ai-image-credit
          currency: usd
          expires: 30d                     # top-up credits expire like membership grants
          providers: [stripe]
          input_min: 5_000_000             # min $5 per purchase
          input_max: 500_000_000           # max $500 per purchase
          round: down                      # floor credits — never grant more value than paid
          price:
            model: tiered
            mode: graduated
            # base 100 credits = $1 ($0.01/credit); marginal rate improves with size.
            # e.g. $50 → ~5,333 credits (≈6.7% more than 5,000 at base).
            tiers:
              - up_to: 2_000               # first 2,000 credits
                unit_amount: 10_000        #   $0.0100 / credit
              - up_to: 10_000              # 2,001 – 10,000
                unit_amount: 9_000         #   $0.0090 / credit  (10% off)
              - up_to: null                # 10,001+
                unit_amount: 8_000         #   $0.0080 / credit  (20% off)

