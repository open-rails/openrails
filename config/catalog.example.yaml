version: 1

# Apply with:
#   openrails push-merchant-catalog --config config.yaml --file config/catalog.example.yaml
#
# This file contains desired catalog state only. It does not contain merchant
# profile data, provider credentials, users, permission groups, or API keys.

catalogs:
  - merchant: local-stack

    products:
      - key: basic
        display_name: Basic
        description: Basic recurring membership.
        tier_group: memberships
        tier_rank: 1
        entitlements:
          - access.basic
        prices:
          - currency: usd
            unit_amount: 9_990_000
            interval: 30d
            providers: [stripe, mobius]
            provider_links:
              stripe:
                lookup_key: local-stack-basic-monthly
              mobius:
                plan_id: local_stack_basic_monthly

          - currency: usd
            unit_amount: 99_900_000
            interval: 365d
            providers: [stripe]
            provider_links:
              stripe:
                lookup_key: local-stack-basic-yearly

      - key: premium
        display_name: Premium
        description: Premium recurring membership.
        tier_group: memberships
        tier_rank: 2
        entitlements:
          - access.basic
          - access.premium
        prices:
          - currency: usd
            unit_amount: 19_990_000
            interval: 30d
            providers: [stripe, mobius]
            provider_links:
              stripe:
                lookup_key: local-stack-premium-monthly
              mobius:
                plan_id: local_stack_premium_monthly

          - currency: usd
            unit_amount: 199_900_000
            interval: 365d
            providers: [stripe, solana]
            provider_links:
              stripe:
                lookup_key: local-stack-premium-yearly
              # Solana plan accounts are provider-generated. Include
              # plan_pda only when linking an existing on-chain plan.
              # solana:
              #   plan_pda: 7XyExistingPlanAccount...

      - key: legacy-vip
        display_name: Legacy VIP
        description: Historical plan kept for migrated subscriptions.
        tier_group: legacy
        tier_rank: 99
        active: false
        entitlements:
          - access.premium
        prices:
          - currency: usd
            unit_amount: 14_990_000
            interval: 30d
            active: false
