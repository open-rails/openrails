  - merchant: digital-ocean
    # ───────────────────────────────────────────────────────────────────────
    # How DO bills:
    #   • Compute and most resources meter PER-SECOND, but the hourly rate is
    #     just monthly ÷ 672 (24h × 28d) and the charge is CAPPED at the monthly
    #     price (maximum_amount): run all month → you pay the advertised monthly
    #     price, never more. Minimum charge 60s/$0.01 (minimum_amount).
    #   • Powered-off droplets still bill; the host emits runtime until destroy.
    #   • ONE meter per resource kind; SKUs are priced by a `matrix` on size_slug
    #     — not one product per size.
    #   • Bandwidth: ingress free; each running droplet contributes its plan's
    #     included egress, accrued per-second, pooled per team; $0.01/GiB over.
    # ───────────────────────────────────────────────────────────────────────
    meters:
      - key: droplet-runtime          # host heartbeats uptime seconds per droplet
        event_type: droplet.usage
        value_property: $.seconds
        aggregation: sum
        group_by: { size_slug: $.size_slug, region: $.region, resource_id: $.droplet_id }
      - key: public-egress            # outbound bytes per droplet (ingress is free)
        event_type: network.egress
        value_property: $.bytes
        aggregation: sum
        group_by: { region: $.region, resource_id: $.droplet_id }
      - key: volume-storage           # GiB held × seconds in the interval
        event_type: volume.usage
        value_property: $.gib_seconds
        aggregation: sum
        group_by: { resource_id: $.volume_id }
      - key: spaces-storage
        event_type: spaces.storage
        value_property: $.gib_seconds
        aggregation: sum
      - key: spaces-egress
        event_type: spaces.egress
        value_property: $.bytes
        aggregation: sum
      - key: snapshot-storage
        event_type: snapshot.usage
        value_property: $.gib_seconds
        aggregation: sum
      - key: lb-runtime               # load-balancer node uptime seconds
        event_type: load_balancer.usage
        value_property: $.seconds
        aggregation: sum
        group_by: { lb_type: $.lb_type, resource_id: $.lb_id }
      - key: db-runtime               # managed-database node uptime seconds
        event_type: database.usage
        value_property: $.seconds
        aggregation: sum
        group_by: { size_slug: $.size_slug, resource_id: $.db_id }

    products:
      # Droplets — one meter, priced per SKU by matrix. Per-second (divide_by
      # 3600), $0.01/60s floor, each SKU capped at its monthly price. The cell's
      # included feeds the pooled egress allowance in the next card.
      - key: droplet
        display_name: Droplet
        tier_group: droplets
        billing_cadence: 30d
        rate_cards:
          - meter: droplet-runtime
            price:
              model: per_unit
              currency: usd
              divide_by: 3_600              # seconds → hours
              round: up
              minimum_amount: 10_000        # $0.01 / 60s minimum charge
              matrix:
                dimension: size_slug
                cells:
                  s-1vcpu-512mb-10gb: { unit_amount: 5_950,  maximum_amount: 4_000_000,  included: 500 }
                  s-1vcpu-1gb:        { unit_amount: 8_930,  maximum_amount: 6_000_000,  included: 1_000 }
                  s-1vcpu-2gb:        { unit_amount: 17_860, maximum_amount: 12_000_000, included: 2_000 }
                  s-2vcpu-4gb:        { unit_amount: 35_710, maximum_amount: 24_000_000, included: 4_000 }
          - meter: public-egress
            # Each running droplet contributes its SKU's monthly included egress,
            # accrued per-second, capped at 28 days, pooled across the team.
            allowance:
              accrue_from: droplet-runtime
              included_per_cycle: size_slug.included
              cap: 28d
              pool: customer
            price:
              model: per_unit
              currency: usd
              unit_amount: 10_000          # $0.01 / GiB over the pool
              divide_by: 1_073_741_824     # bytes → GiB
              round: up

      # Block storage — provisioned capacity, billed hourly while the volume
      # exists (attached or not). $0.10 / GiB-month.
      - key: volume
        display_name: Block Storage Volume
        tier_group: block-storage
        billing_cadence: 30d
        rate_cards:
          - meter: volume-storage
            price:
              model: per_unit
              currency: usd
              unit_amount: 100_000         # $0.10 / GiB-month
              divide_by: 2_592_000         # GiB-seconds → GiB-months (30d)
              round: down

      # Spaces — $5/mo base bundling 250 GiB storage + 1 TiB egress (pooled
      # across all buckets); overage $0.02/GiB-mo storage, $0.01/GiB egress.
      - key: spaces
        display_name: Spaces Object Storage
        tier_group: object-storage
        billing_cadence: 30d
        rate_cards:
          - price: { model: flat, currency: usd, amount: 5_000_000, per: 30d, auto_renew: true, providers: [stripe] }
          - meter: spaces-storage
            allowance: { included: 250, unit: gib_month, pool: customer }
            price: { model: per_unit, currency: usd, unit_amount: 20_000, divide_by: 2_592_000, round: down }   # $0.02/GiB-mo
          - meter: spaces-egress
            allowance: { included: 1_024, unit: gib, pool: customer }
            price: { model: per_unit, currency: usd, unit_amount: 10_000, divide_by: 1_073_741_824, round: up }  # $0.01/GiB

      # Snapshots — $0.06 / GiB-month for as long as the snapshot exists.
      - key: snapshot
        display_name: Snapshot Storage
        tier_group: snapshots
        billing_cadence: 30d
        rate_cards:
          - meter: snapshot-storage
            price:
              model: per_unit
              currency: usd
              unit_amount: 60_000          # $0.06 / GiB-month
              divide_by: 2_592_000
              round: down
              minimum_amount: 10_000       # $0.01 minimum

      # Load Balancers — billed hourly, advertised monthly; HTTP $12 / network
      # $15 per node. Per-second with the monthly price as the cap, per type.
      - key: load-balancer
        display_name: Regional Load Balancer
        tier_group: load-balancers
        billing_cadence: 30d
        rate_cards:
          - meter: lb-runtime
            price:
              model: per_unit
              currency: usd
              divide_by: 3_600
              round: up
              matrix:
                dimension: lb_type
                cells:
                  http:    { unit_amount: 17_860, maximum_amount: 12_000_000 }   # $12/mo
                  network: { unit_amount: 22_320, maximum_amount: 15_000_000 }   # $15/mo

      # Managed Databases — billed hourly, monthly-equivalent, by node size;
      # from $15/mo. Per-second with the monthly price as the cap.
      - key: managed-database
        display_name: Managed Database
        tier_group: databases
        billing_cadence: 30d
        rate_cards:
          - meter: db-runtime
            price:
              model: per_unit
              currency: usd
              divide_by: 3_600
              round: up
              matrix:
                dimension: size_slug
                cells:
                  db-s-1vcpu-1gb: { unit_amount: 22_320, maximum_amount: 15_000_000 }   # $15/mo
                  db-s-2vcpu-4gb: { unit_amount: 89_290, maximum_amount: 60_000_000 }   # $60/mo

