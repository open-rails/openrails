version: 1

# ─────────────────────────────────────────────────────────────────────────────
# A merchant's COMPLETE OpenRails configuration, as declarative YAML.
#
#   apply:  openrails push-merchant-config --config config.yaml --file config/merchants.example.yaml --insert
#   dump:   openrails dump-merchant-config  --config config.yaml --slug local-stack
#
# The Go struct family (internal/bootstrap.ManifestMerchant) is 1:1 with this
# shape, so push and dump are symmetric: a dump re-serializes a live merchant back
# into this exact form (secrets emitted as env REFERENCES, never values), so the
# file can be reviewed, versioned, and re-applied.
#
# What lives HERE — the whole merchant_configurations payload + provider accounts:
#   • identity (slug, display_name) + host-app issuer trust
#   • profile (branding / statement + email metadata)
#   • invoice / collection policy (when & how the accrued balance is billed)
#   • delegated-invoker abuse windows (wasted-spend ceilings)
#   • payment-provider accounts (live + test, with test_mode selecting the active set)
#
# What lives ELSEWHERE (this file deliberately does NOT carry):
#   • products / prices / meters       → config/catalog.example.yaml  (push-catalog)
#   • permission groups / auth         → config/bootstrap.example.yaml (push-auth-bootstrap)
#   • DB / server / the test_mode flag → top-level config.yaml
#   • per-CUSTOMER settings (spend limits, minimum_spend, auto-topup) → runtime API
# ─────────────────────────────────────────────────────────────────────────────

merchants:
  - slug: local-stack
    display_name: Local Stack

    # Host-app JWKS trust (#527): the issuer becomes OWNER of this merchant's
    # permission group, so its delegated tokens administer this merchant only.
    # Provide exactly one of jwks_uri (preferred, auto-rotating) or public_keys.
    issuer:
      uri: https://local-stack.example
      jwks_uri: https://local-stack.example/.well-known/jwks.json
      allowed_origins:
        - https://local-stack.example

    # Public / communication metadata shown on statements and emails.
    profile:
      display_name: Local Stack Billing
      logo_url: https://local-stack.example/assets/logo.png
      from_email: billing@local-stack.example
      support_url: https://local-stack.example/support

    # Billing / collection policy (#643/#646). Every field is optional — an omitted
    # field keeps the service default (shown in the comments); an omitted `invoice`
    # block leaves all of them as-is.
    invoice:
      billing_period_boundary: calendar_month   # calendar_month | anniversary | fixed_interval (default: fixed_interval, a rolling 30d)
      collection_threshold: 50_000_000          # invoice an arrears customer once $50 is owed (default: $50)
      monthly_floor: 1_000_000                  # don't bother collecting below $1 (default: $1)

    # Per-window spend ceilings on WASTED (failed / abused) delegated-invoker
    # generation (#646). Omit to keep the service defaults — which are exactly the
    # two windows shown here.
    delegated_invoker_wasted_spend_windows:
      - { key: burst,     window: 15m, limit: 5_000_000 }    # $5 per 15 minutes
      - { key: sustained, window: 5h,  limit: 20_000_000 }   # $20 per 5 hours

    # Payment-provider accounts.
    #   name        — human label for the account (the config-layer account name);
    #                 NOT the routing identity.
    #   account_id  — the routing identity (#641): NMI gateway-id, Stripe acct_…,
    #                 CCBill client_acc_num/sub_acc, Solana recipient wallet.
    #   environment — live | test. A deployment is all-live OR all-test; the
    #                 config.yaml `test_mode` flag selects which set is active at
    #                 boot (live under test_mode=false, test under test_mode=true).
    #                 Declaring BOTH here lets one file serve both deployments.
    #   mode        — primary | secondary | legacy | disabled. primary receives new
    #                 work + catalog push; secondary is a kept-in-sync fallback;
    #                 legacy is old rows / rebills / refunds / webhooks only.
    #   secrets     — each entry sets exactly one of {value, env, file, vault}.
    #                 dump emits `env:` references (never values).
    provider_accounts:
      # NMI gateway "mobius" — the LIVE account and its SANDBOX, side by side.
      - provider_type: nmi
        name: mobius
        environment: live
        account_id: "579145"
        mode: primary
        secrets:
          security_key:           { env: LOCAL_STACK_MOBIUS_NMI_SECURITY_KEY }
          tokenization_key:       { env: LOCAL_STACK_MOBIUS_NMI_TOKENIZATION_KEY }
          webhook_signing_secret: { env: LOCAL_STACK_MOBIUS_NMI_WEBHOOK_SECRET }
      - provider_type: nmi
        name: mobius
        environment: test
        account_id: "579145-sandbox"
        mode: primary                 # active only under test_mode=true (development); ignored in production
        secrets:
          security_key:           { env: LOCAL_STACK_MOBIUS_NMI_TEST_SECURITY_KEY }
          tokenization_key:       { env: LOCAL_STACK_MOBIUS_NMI_TEST_TOKENIZATION_KEY }
          webhook_signing_secret: { env: LOCAL_STACK_MOBIUS_NMI_TEST_WEBHOOK_SECRET }

      # A second NMI gateway for redundancy / per-product routing (secondary).
      - provider_type: nmi
        name: paykings
        environment: live
        account_id: "884512"
        mode: secondary
        secrets:
          security_key:           { env: LOCAL_STACK_PAYKINGS_NMI_SECURITY_KEY }
          tokenization_key:       { env: LOCAL_STACK_PAYKINGS_NMI_TOKENIZATION_KEY }
          webhook_signing_secret: { env: LOCAL_STACK_PAYKINGS_NMI_WEBHOOK_SECRET }

      # CCBill — one account (account_id = client_acc_num/sub_acc).
      - provider_type: ccbill
        name: ccbill
        environment: live
        account_id: "945280/0000"
        mode: primary
        secrets:
          account_config: { file: ./.secrets/openrails/local-stack-ccbill-account.json }

      # Stripe — the LIVE business and its TEST mode, side by side.
      - provider_type: stripe
        name: stripe
        environment: live
        account_id: acct_localstack_live
        mode: primary
        secrets:
          secret_key:             { env: LOCAL_STACK_STRIPE_SECRET_KEY }
          webhook_signing_secret: { env: LOCAL_STACK_STRIPE_WEBHOOK_SECRET }
      - provider_type: stripe
        name: stripe
        environment: test
        account_id: acct_localstack_test
        mode: primary                 # active only under test_mode=true
        secrets:
          secret_key:             { env: LOCAL_STACK_STRIPE_TEST_SECRET_KEY }
          webhook_signing_secret: { env: LOCAL_STACK_STRIPE_TEST_WEBHOOK_SECRET }

      # Solana — recipient wallet (operator-declared identity; #592).
      - provider_type: solana
        name: solana
        environment: live
        account_id: 11111111111111111111111111111111
        mode: secondary
        secrets:
          private_key: { file: ./.secrets/openrails/local-stack-solana-keypair.json }
