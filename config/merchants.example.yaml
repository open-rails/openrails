version: 1

# OpenRails merchant provisioning (#527). Seeds merchants into Postgres + the
# configured secret backend. Apply manually:
#   openrails push-merchant-config --config config.yaml --file config/merchants.example.yaml
#
# There is NO auth/users section: OpenRails owns authority, the host app owns
# identity. Each merchant declares its own host-app `issuer`, which is registered
# as the OWNER of the merchant's backing org — the host app's delegated tokens
# then fully administer THIS merchant only (and nothing else).
#
# Secrets: {env: ...} or {file: ...} normally; {vault: ...} when a Vault backend
# is wired. Values are stored encrypted at rest (per-merchant DEK), never hashed.

merchants:
  - slug: local-stack
    display_name: Local Stack

    # Host-app JWKS trust -> owner of this merchant. Prefer jwks_uri (AuthKit
    # auto-refetches on key rotation); public_keys is the static alternative
    # (mutually exclusive, manual rotation). allowed_origins is the exact browser
    # Origin allow-list used for standalone CORS preflight, not a webhook URL or
    # an authorization boundary.
    issuer:
      uri: https://local-stack.example
      jwks_uri: https://local-stack.example/.well-known/jwks.json
      audiences: [openrails]
      allowed_origins:
        - https://local-stack.example

    profile:
      display_name: Local Stack Billing
      logo_url: https://local-stack.example/assets/logo.png
      from_email: billing@local-stack.example
      support_url: https://local-stack.example/support

    provider_accounts:
      - provider_type: stripe
        environment: live
        account_id: acct_localstack123
        mode: primary
        secrets:
          secret_key:
            env: LOCAL_STACK_STRIPE_SECRET_KEY
          webhook_signing_secret:
            env: LOCAL_STACK_STRIPE_WEBHOOK_SECRET

      - provider_type: nmi
        environment: live
        account_id: nmi-local-stack-profile
        mode: primary
        secrets:
          production_key:
            env: LOCAL_STACK_MOBIUS_PRODUCTION_KEY
          tokenization_key:
            env: LOCAL_STACK_MOBIUS_TOKENIZATION_KEY
          webhook_signing_secret:
            env: LOCAL_STACK_MOBIUS_WEBHOOK_SECRET

      - provider_type: ccbill
        environment: live
        account_id: "900000-0000"
        mode: secondary
        secrets:
          account_config:
            file: ./.secrets/openrails/local-stack-ccbill-account.json

      - provider_type: solana
        environment: live
        account_id: 11111111111111111111111111111111
        mode: secondary
        secrets:
          private_key:
            file: ./.secrets/openrails/local-stack-solana-keypair.json
