version: 1

# Store real secrets in Hashicorp Vault and overlay them into this manifest.
#
# A PSP's rail decides its fields: everything but `secrets` sits flat on the
# PSP, and a field its rail does not take is refused. Its `environment` is one
# of its rail's, verified with the provider before the PSP is used; omitted, it
# is the rail's real-money one:
#   nmi     live | test | sandbox
#   stripe  live | test
#   ccbill  live | sandbox
#   solana  mainnet | devnet | testnet
# Each PSP picks its own environment and a merchant mixes them freely; an
# omitted environment is the rail's real-money one.
#
# Solana rebilling also needs the deployment's solana.crankers (config.yaml);
# docs/rails/solana.md.

merchants:
  local-stack:
    display_name: Local Stack Billing

    remote_application:
      issuer: https://local-stack.example
      jwks_uri: https://local-stack.example/.well-known/jwks.json

    # The merchant's settings sit flat on the merchant: the same fields GET
    # /v1/admin/configuration reads and PATCH changes
    # (docs/api/merchant-settings.md), with the same names and units.
    profile:
      logo_url: https://local-stack.example/assets/logo.png
      from_email: billing@local-stack.example
      support_url: https://local-stack.example/support

    # Active only when the host sets usage_billing_enabled: true.
    usage_billing:
      billing_day: 13
      currencies:
        - {currency: USD, credit_limit: 100000000, minimum_invoice_amount: 1000000}
    # or#878 arrears delinquency: days past due_at before new spend is refused
    # and the host is signalled to shut off. Default 14; the amount floor
    # (arrears_delinquency_floor) defaults to monthly_floor. See
    # docs/arrears-delinquency.md.
    arrears_grace_days: 7

    delegated_invoker_wasted_spend_limits:
      - { key: burst, window_seconds: 900, limit: 5000000 }
      - { key: sustained, window_seconds: 18000, limit: 20000000 }

    # or#288 processor routing: ordered rules, FIRST MATCH WINS. `prefer` is
    # both the ranked candidate list and the whitelist: a PSP the winning rule
    # does not name cannot be routed to, which is how you pin a product to one
    # rail. Candidates that cannot serve the price right now (unarmed,
    # archived, credentials missing, no price link, mode unsupported) are
    # skipped; the skipped set and its reasons land on the session's
    # routing_reason. Entries are PSP keys, or a rail kind where exactly one
    # PSP is armed on it.
    #
    # Omit it for the built-in order (stripe, nmi, ccbill, solana), the right
    # answer for a merchant with one PSP per rail. A declared list REPLACES
    # the policy whole; a rule with an empty `match` matches everything and
    # must be last. A request that NAMES a PSP always gets that PSP.
    psp_routing:
      # EU subscriptions go to CCBill first, NMI second.
      - match: { currency: EUR, mode: subscription }
        prefer: [ccbill, mobius]
      # This one product is card-only; solana must never be offered for it.
      - match: { product: enterprise }
        prefer: [stripe, mobius]
      # Catch-all.
      - prefer: [mobius, ccbill, solana]

    # Operator-declared PSP catalog: one word everywhere — this key, the DB table
    # (billing.psps) and the merchant-secret name prefix (`psps/…`). Each names its rail.
    psps:
      mobius:
        rail: nmi
        environment: test
        gateway_id: "1234567"
        tokenization_url: https://secure.networkmerchants.com/token/Collect.js
        tokenization_key: replace-with-test-mode-nmi-tokenization-key
        secrets:
          security_key: replace-with-test-mode-nmi-security-key
          webhook_signing_secret: replace-with-test-mode-nmi-webhook-secret

      mobius-sandbox:
        rail: nmi
        environment: sandbox
        gateway_id: "7654321"
        tokenization_url: https://secure.networkmerchants.com/token/Collect.js
        tokenization_key: replace-with-sandbox-nmi-tokenization-key
        secrets:
          security_key: replace-with-sandbox-nmi-security-key
          webhook_signing_secret: replace-with-sandbox-nmi-webhook-secret

      paykings:
        rail: nmi
        environment: test
        gateway_id: "5551234"
        archived: true
        tokenization_url: https://secure.networkmerchants.com/token/Collect.js
        tokenization_key: replace-with-paykings-nmi-tokenization-key
        secrets:
          security_key: replace-with-paykings-nmi-security-key
          webhook_signing_secret: replace-with-paykings-nmi-webhook-secret

      # or#879/or#880 CUSTODY: ordinary NMI PSPs whose cards are held by a
      # third-party custodian (Basis Theory) instead of in NMI's own vault.
      # Custody is a MODIFIER on the rail, never a rail of its own: NMI still
      # charges, the custodian just detokenizes the PAN into this gateway.
      #
      # The custodian is declared ONCE under `custodians:` below and referenced
      # by key here. Both of these PSPs charge cards out of the same vault —
      # one tenant id, one application key, no copies to drift.
      #
      # The browser tokenizes against the CUSTODIAN, so a custodial PSP
      # declares no NMI tokenization_key; the custodian's public_api_key
      # replaces it.
      mobius-bt:
        rail: nmi
        environment: test
        gateway_id: "7654322"
        custodian: bt
        secrets:
          security_key: replace-with-test-nmi-security-key
          webhook_signing_secret: replace-with-test-nmi-webhook-secret

      mobius-bt-backup:
        rail: nmi
        environment: test
        gateway_id: "7654323"
        custodian: bt
        secrets:
          security_key: replace-with-backup-nmi-security-key
          webhook_signing_secret: replace-with-backup-nmi-webhook-secret

      ccbill:
        rail: ccbill
        environment: sandbox
        # CCBill's account and subaccount numbers.
        client_accnum: "999999"
        client_subacc: "0000"
        # Webhook source IPs are CCBill's documented provider-wide ranges,
        # built in (#710) — there is no per-merchant allowlist.
        secrets:
          salt: replace-with-ccbill-flexform-salt
          datalink_username: replace-with-ccbill-datalink-username
          datalink_password: replace-with-ccbill-datalink-password

      stripe:
        rail: stripe
        environment: test
        account_id: acct_1AbCdEfGhIjKlMnOp
        secrets:
          secret_key: replace-with-test-stripe-secret-key
          webhook_signing_secret: replace-with-test-stripe-webhook-secret

      stripe-sandbox:
        rail: stripe
        environment: test
        account_id: acct_1ZyXwVuTsRqPoNmL
        secrets:
          secret_key: replace-with-test-stripe-secret-key
          webhook_signing_secret: replace-with-test-stripe-webhook-secret

      solana:
        rail: solana
        environment: devnet
        # The PSP's identity: the address every payment lands in.
        treasury: 9hSR6S7WPtxmTojgo6GG3k4yDPecgJY292j7xrsUGWBu
        # Optional: your RPC provider's URL (it carries the provider's key),
        # tried before the network's public endpoint.
        secrets:
          rpc_url: https://devnet.helius-rpc.com/?api-key=replace-with-helius-api-key

    # Operator-declared CUSTODIAN catalog (or#880): the same shape as `psps:`
    # one axis over. A PSP says who CHARGES the card; a custodian says who
    # HOLDS it. Most merchants declare none at all — a card stored inside
    # Stripe or in NMI's own vault needs no configuration, because the PSP IS
    # the custodian.
    #
    # Declared ONCE and referenced by key from every PSP whose gateway those
    # cards are charged through (`custodian: bt` above). The ONLY custodial
    # secret is the vendor's PRIVATE application key.
    custodians:
      bt:
        kind: basis_theory
        # Its money class, matching the PSPs it serves: live (default) or test.
        environment: test
        # The custodian-native tenant identity. Operator-declared: there is
        # no runtime whoami (#592).
        account_id: replace-with-bt-tenant-id
        # The PUBLIC application key the payment page tokenizes with. It
        # replaces the rail's own tokenization_key: with custody, the browser
        # sends the PAN to the CUSTODIAN, not to the gateway.
        public_api_key: replace-with-bt-public-application-key
        # Network-token provisioning at instrument creation (a paid add-on).
        # Never load-bearing: a provisioning failure warns and the instrument
        # stays a proxied PAN.
        network_tokens: false
        secrets:
          api_key: replace-with-bt-private-application-key

  static-jwks-stack:
    display_name: Static JWKS Stack

    remote_application:
      issuer: https://static-jwks.example
      jwks:
        keys:
          - kty: OKP
            kid: static-ed25519-1
            alg: EdDSA
            crv: Ed25519
            x: 11qYAYKxCrfVS_3rUnkx7ZyC4aHc4zlYwD9KLGdT6I4
