version: 1

# Store real secrets in Hashicorp Vault and overlay them into this manifest.
#
# Per-account `environment: test|live` is an ASSERTION cross-checked against the
# deployment's test_mode — NOT a behavior selector (test_mode alone drives
# sandbox posture; a contradiction refuses to boot). Omitted = derived from
# test_mode.
#
# Solana runtime knobs (#711) live in the solana account's `settings` block
# below. Solana provider account identity is derived from the signer public key.

merchants:
  local-stack:
    display_name: Local Stack

    # Canonical API host (#734/#850): the Host header public routes resolve
    # this merchant from. Bare lowercase hostname, globally unique. Optional —
    # omitted leaves any stored value untouched.
    # api_host: api.local-stack.example

    remote_application:
      issuer: https://local-stack.example
      jwks_uri: https://local-stack.example/.well-known/jwks.json

    profile:
      display_name: Local Stack Billing
      logo_url: https://local-stack.example/assets/logo.png
      from_email: billing@local-stack.example
      support_url: https://local-stack.example/support

    invoice:
      billing_period_boundary: calendar_month
      collection_threshold: 50_000_000
      monthly_floor: 1_000_000
      # or#878 arrears delinquency: days past due_at before new spend is refused
      # and the host is signalled to shut off. Default 14; the amount floor
      # defaults to monthly_floor. See docs/arrears-delinquency.md.
      delinquency_grace_days: 7

    delegated_invoker_wasted_spend_windows:
      - { key: burst, window: 15m, limit: 5_000_000 }
      - { key: sustained, window: 5h, limit: 20_000_000 }

    # Operator-declared PSP catalog: one word everywhere — this key, the DB table
    # (openrails.psps) and the merchant-secret name prefix (`psps/…`). One rail each.
    psps:
      mobius:
        nmi:
          environment: live
          account_id: "1234567"
          settings:
            tokenization_url: https://secure.networkmerchants.com/token/Collect.js
            tokenization_key: replace-with-live-nmi-tokenization-key
          secrets:
            security_key: replace-with-live-nmi-security-key
            webhook_signing_secret: replace-with-live-nmi-webhook-secret

      mobius-sandbox:
        nmi:
          environment: test
          account_id: "7654321"
          settings:
            tokenization_url: https://secure.networkmerchants.com/token/Collect.js
            tokenization_key: replace-with-test-nmi-tokenization-key
          secrets:
            security_key: replace-with-test-nmi-security-key
            webhook_signing_secret: replace-with-test-nmi-webhook-secret

      paykings:
        nmi:
          environment: live
          account_id: "5551234"
          archived: true
          settings:
            tokenization_url: https://secure.networkmerchants.com/token/Collect.js
            tokenization_key: replace-with-paykings-nmi-tokenization-key
          secrets:
            security_key: replace-with-paykings-nmi-security-key
            webhook_signing_secret: replace-with-paykings-nmi-webhook-secret

      # or#879 CUSTODY: an ordinary NMI PSP whose cards are held by a
      # third-party custodian (Basis Theory) instead of in NMI's own vault.
      # Custody is a MODIFIER on the rail, never a rail of its own: NMI still
      # charges, the custodian just detokenizes the PAN into this gateway.
      #
      # The browser tokenizes against the CUSTODIAN, so this PSP declares no
      # NMI tokenization_key — custodian_public_api_key replaces it. The ONLY
      # custodial secret is the custodian's PRIVATE application key.
      mobius-bt:
        nmi:
          environment: test
          account_id: "7654322"
          settings:
            custodian: basis_theory
            custodian_account_id: replace-with-bt-tenant-id
            custodian_public_api_key: replace-with-bt-public-application-key
            custodian_network_tokens: false
          secrets:
            security_key: replace-with-test-nmi-security-key
            webhook_signing_secret: replace-with-test-nmi-webhook-secret
            custodian_api_key: replace-with-bt-private-application-key

      ccbill:
        ccbill:
          environment: live
          # CCBill composite identity is dash-joined: clientAccnum-clientSubacc (#697).
          account_id: "999999-0000"
          # Webhook source IPs are CCBill's documented provider-wide ranges,
          # built in (#710) — there is no per-merchant allowlist.
          secrets:
            salt: replace-with-ccbill-flexform-salt
            datalink_username: replace-with-ccbill-datalink-username
            datalink_password: replace-with-ccbill-datalink-password

      stripe:
        stripe:
          environment: live
          account_id: acct_1AbCdEfGhIjKlMnOp
          secrets:
            secret_key: replace-with-live-stripe-secret-key
            webhook_signing_secret: replace-with-live-stripe-webhook-secret

      stripe-sandbox:
        stripe:
          environment: test
          account_id: acct_1ZyXwVuTsRqPoNmL
          secrets:
            secret_key: replace-with-test-stripe-secret-key
            webhook_signing_secret: replace-with-test-stripe-webhook-secret

      solana:
        solana:
          environment: live
          archived: false
          signer: { mode: local_keypair }
          settings:
            # Optional destination wallet; defaults to the signer public key when omitted.
            recipient_wallet: 9hSR6S7WPtxmTojgo6GG3k4yDPecgJY292j7xrsUGWBu
            # Solana runtime knobs (#711): declared per merchant here; when the
            # embedded boot plane also sets them, these settings win (#699).
            rpc_provider: helius # helius | public; empty defaults to helius
            rpc_api_key: replace-with-helius-api-key
            # `tokens` is OPTIONAL and additive (or#881). The curated registry
            # (SOL, USDC, PYUSD, USD1, USDG on mainnet; SOL, USDC, PYUSD on
            # devnet) is always available — declare a token ONLY to add one the
            # registry does not carry. Do not restate a canonical mint: a
            # re-typed mint address is a money-path paste error waiting to
            # happen, and it is the one value here you cannot get wrong by
            # omitting it. Declaring a registry symbol overrides that ONE entry
            # and leaves the rest of the registry intact.
            # `decimals` is not accepted (or#817): they are read from the SPL
            # mint on-chain, never from config.
            #
            # tokens:
            #   MYTK: { name: My Token, mint: replace-with-spl-mint-address }
          secrets:
            private_key: replace-with-base58-ed25519-keypair

      # Alternative Solana signer using Hashicorp Vault Transit.
      solana-vault:
        solana:
          environment: live
          archived: false
          signer: { mode: vault_transit, key: openrails-solana-local-stack }

  static-jwks-stack:
    display_name: Static JWKS Stack

    remote_application:
      issuer: https://static-jwks.example
      jwks:
        keys:
          - kty: OKP
            kid: static-ed25519-1
            alg: EdDSA
            crv: Ed25519
            x: 11qYAYKxCrfVS_3rUnkx7ZyC4aHc4zlYwD9KLGdT6I4
