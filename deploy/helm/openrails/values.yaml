# OpenRails standalone server. Postgres 18+ and Redis (or Garnet) are not part
# of this chart: name them in config and secrets. docs/standalone.md has the
# walkthrough.

# Every pod serves the API and runs the workers. More than one needs Redis
# (config.redis), which shares rate limits, admin lockouts, captcha challenges,
# card-testing declines and AuthKit's spent proofs (without it each pod keeps
# its own), and AuthKit's keys from secrets.authKeys.
replicaCount: 1

image:
  repository: docker.io/openrails/openrails # or ghcr.io/open-rails/openrails
  tag: "" # default: the chart's appVersion, vX.Y.Z; required from a checkout (appVersion latest)
  digest: "" # sha256:…; pins the image over the tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The command; the chart appends --config=/etc/openrails/config.yaml.
args: [run-server]

# config.yaml, rendered as is (config.example.yaml lists every key). Keep
# secrets out: they come from `secrets`, as environment variables or files
# named like them (database.url is DATABASE_URL). port and metrics_port are the
# chart's (ports.http, metrics.port).
config:
  # public_url: https://billing.example.com # required: the server's AuthKit issuer and resource
  # Optional, no default; more than one replica needs it.
  # redis:
  #   url: redis://redis:6379 # or rediss://user:password@host/db, from a REDIS_URL secret; ca_cert
  # The event store usage needs; without it usage is off.
  # clickhouse:
  #   url: clickhouse://clickhouse:9000/openrails # with a password, from a CLICKHOUSE_URL secret
  # Only the ingress controller's own addresses: without it the client IP is the
  # proxy's. It also decides the sender address a CCBill webhook is checked
  # against, so never list a pod or node CIDR other workloads share. A CCBill
  # webhook URL ends in a secret token: mask that path segment in the
  # ingress's and any CDN's access logs, which record the full path.
  # trusted_proxies: [10.244.250.0/28]
  # Vault holds merchant configuration and secrets when a KV mount is named.
  # vault:
  #   address: https://vault.example.com:8200
  #   auth_method: kubernetes # mounts the ServiceAccount token
  #   k8s_role: openrails
  #   auth_mount: openrails-prod/k8s # where that auth method is mounted; default kubernetes
  # Solana rebilling's crankers, in order: the first publishes new plans and
  # each pulls the plans it owns; none turns rebilling off. A local_keypair
  # belongs in a SOLANA_CRANKERS secret (a JSON list) instead.
  # solana:
  #   crankers:
  #     - {mode: vault_transit, key: openrails-solana-cranker}

# More files in /etc/openrails, each a YAML document or a string. The server
# reads these names when present:
#   merchants.yaml  merchant manifest, applied at every boot; with PSP secrets
#                   in it, mount it from a Secret (secrets.merchantManifest)
#                   instead, or keep them in Vault (config.vault.kv_mount)
#   bootstrap.yaml  AuthKit's first-run operators and trusted applications
#   catalog.yaml    the catalog document `openrails catalog apply` takes
files: {}

# Secrets come from existing Secrets; the chart creates none.
secrets:
  # Environment variables from Secret keys, such as CloudNativePG's app Secret:
  #   DATABASE_URL: {name: openrails-db-app, key: uri}
  env: {}
  # Secrets whose keys are environment variable names (DATABASE_URL, REDIS_URL,
  # REDIS_CA_CERT, CLICKHOUSE_URL, EMAIL_SMTP_PASSWORD, VAULT_TOKEN, …),
  # mounted as files at /vault/secrets.
  # Environment variables win over files.
  files: []
  # A Secret holding AuthKit's keys.json and totp.key, mounted at /vault/auth
  # and reloaded when it changes. Empty mounts a scratch directory, which only
  # a loopback issuer's generated development keys can use, with one replica.
  authKeys: ""
  # The merchant manifest with its PSP secrets: a Secret key mounted as
  # /etc/openrails/merchants.yaml, in place of files.merchants.yaml.
  #   {name: shop-merchants, key: merchants.yaml}
  merchantManifest: {}

env: []
envFrom: []

ports:
  http: 3053

# The metrics listener (config's metrics_port): the operator's Prometheus
# GET /metrics (dependency up/down, abuse-state fallbacks, per-job-kind
# health), on its own ClusterIP Service (<fullname>-metrics) so it is never
# public; the ingress never routes it. Not the merchant dashboard's business
# metrics, which are the /v1/metrics API on ports.http.
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Every path of each host goes to the server: the API, webhooks and the
  # admin console.
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The server waits for Postgres and migrates before it listens.
startupProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 5
  failureThreshold: 120
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
# Postgres and the local workers; Redis, Vault and PSPs never fail it.
readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  periodSeconds: 10
  timeoutSeconds: 3

# On SIGTERM the server turns unready, keeps serving for 5s, then stops within
# 20s: 25s, inside this period.
terminationGracePeriodSeconds: 30

strategy: {}

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Mounted anyway when config.vault.auth_method is kubernetes.
  automountToken: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Rendered with tpl, so a selector can use the chart's labels:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     labelSelector:
#       matchLabels:
#         app.kubernetes.io/instance: '{{ .Release.Name }}'
topologySpreadConstraints: []

extraVolumes: []
extraVolumeMounts: []

nameOverride: ""
fullnameOverride: ""
