<p style="margin:0 0 16px;">We charged <strong>{{.Event.Amount}}</strong> for your usage.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
{{with .Event.OrderNumber}}<tr><td style="padding:2px 16px 2px 0;color:#616e7c;">Order</td><td style="padding:2px 0;">{{.}}</td></tr>{{end}}
<tr><td style="padding:2px 16px 2px 0;color:#616e7c;">Amount paid</td><td style="padding:2px 0;"><strong>{{.Event.Amount}}</strong></td></tr>
<tr><td style="padding:2px 16px 2px 0;color:#616e7c;">Date</td><td style="padding:2px 0;">{{.Event.OccurredAt}}</td></tr>
</table>
{{with .Merchant.StatementDescriptor}}<p style="margin:0 0 16px;">The charge appears on your statement as <strong>{{.}}</strong>.</p>{{end}}
