# Release build, run by .github/workflows/release.yaml on a v* tag. The binary
# is the server module's (server/), released with the root (scripts/release).
# Dry run: goreleaser release --snapshot --clean --skip=publish,sign
version: 2

project_name: openrails

# Module tags share the root release commit; the release is the root's tag.
git:
  ignore_tags:
    - "server/*"
    - "adapters/authkit/*"

before:
  hooks:
    # Both applications and the npm package use the same freshly built SDK.
    - bash scripts/build-release-assets.sh {{ .Version }} build/billing-ui

builds:
  - id: openrails
    dir: server
    main: ./cmd/openrails
    binary: openrails
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    hooks:
      post:
        - cmd: python3 scripts/smoke-native-assets.py --binary "{{ .Path }}" --target "{{ .Target }}" --report test-results/native-assets/report.json
          dir: .
          output: true
    ldflags:
      - -s -w
      - -X github.com/open-rails/openrails/internal/buildinfo.version=v{{ .Version }}
      - -X github.com/open-rails/openrails/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/open-rails/openrails/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  prerelease: auto
  extra_files:
    - glob: build/billing-ui/openrails-billing-ui-{{ .Version }}.tgz
  footer: |
    **CLI:** the `openrails` archives below, or the Docker image
    **Docker:** `docker.io/openrails/openrails:{{ .Tag }}` · `ghcr.io/open-rails/openrails:{{ .Tag }}`
    **Go:** `go get github.com/open-rails/openrails@{{ .Tag }}` (embedded) · `go get github.com/open-rails/openrails/server@{{ .Tag }}` (standalone)
    **Verify:** `gh attestation verify <file> --repo open-rails/openrails`

# Entries are PR titles (squash merges); conventional prefixes pick the group.
changelog:
  use: github
  format: "{{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  groups:
    - title: Features
      regexp: '^(feat|feature)(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^(fix|security)(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^(chore|test|tests|docs|ci|build|style)(\(.+\))??!?:'
      - '^Merge (pull request|branch)'
