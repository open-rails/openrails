packages:
  - "."

# Transitive security bump; drop it once eslint and typescript-eslint ask for
# the fixed range themselves.
overrides:
  minimatch: ^11.0.1 # GHSA-g3hv-75wg-m249

ignoreScripts: true
ignorePnpmfile: true
strictDepBuilds: true
verifyDepsBeforeRun: error
enablePrePostScripts: false
dangerouslyAllowAllBuilds: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # AuthKit is published by our release CI; admin host integration tests use it.
  - "@openrails/auth-ui"
  - "@types/node@26.2.0"
  - "eslint@10.8.1"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
trustLockfile: false
blockExoticSubdeps: true
