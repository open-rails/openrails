version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/migrate/postgres"
      - "internal/db/schema"
    database:
      uri: "${SQLC_DATABASE_URL}"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          # #1116: sqlc reads rebill_cycle_facts' LATERAL columns as NOT NULL.
          - column: "openrails.rebill_cycle_facts.first_category"
            go_type: {type: "string", pointer: true}
          - column: "openrails.rebill_cycle_facts.first_at"
            go_type: {type: "time.Time", pointer: true}
          - column: "openrails.rebill_cycle_facts.won_attempt_id"
            go_type: {import: "github.com/google/uuid", type: "UUID", pointer: true}
          - column: "openrails.rebill_cycle_facts.won_kind"
            go_type: {type: "string", pointer: true}
          - column: "openrails.rebill_cycle_facts.won_source"
            go_type: {type: "string", pointer: true}
          - column: "openrails.rebill_cycle_facts.won_at"
            go_type: {type: "time.Time", pointer: true}
          - column: "openrails.rebill_cycle_facts.won_ordinal"
            go_type: {type: "int64", pointer: true}
          - column: "openrails.rebill_cycle_facts.first_failed"
            go_type: "bool"
          - column: "openrails.rebill_cycle_facts.closed_at"
            go_type: "time.Time"
