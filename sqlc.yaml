version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/migrate/postgres/0001_schema.up.sql"
      - "internal/migrate/postgres/0002_catalog_batch_hash.up.sql"
      - "internal/migrate/postgres/0003_product_price_keys.up.sql"
      - "internal/migrate/postgres/0004_catalog_credit_benefits.up.sql"
      - "internal/migrate/postgres/0005_purchased_credit_accounting.up.sql"
      - "internal/migrate/postgres/0006_catalog_snapshots.up.sql"
      - "internal/migrate/postgres/0007_checkout_session_directory.up.sql"
      - "internal/migrate/postgres/0008_billing_access_intervals.up.sql"
      - "internal/migrate/postgres/0009_invoice_collection_cadence.up.sql"
      - "internal/migrate/postgres/0010_entitlement_names.up.sql"
      - "internal/migrate/postgres/0011_currency_codes.up.sql"
      - "internal/migrate/postgres/0012_provider_applied_coverage.up.sql"
      - "internal/migrate/postgres/0013_federated_grants.up.sql"
      - "internal/migrate/postgres/0014_operation_authorization_extensions.up.sql"
      - "internal/migrate/postgres/0015_owed_repayment.up.sql"
      - "internal/migrate/postgres/0016_identity_facts.up.sql"
      - "internal/migrate/postgres/0017_entitlement_keyspace_index.up.sql"
      - "internal/migrate/postgres/0018_product_entitlements.up.sql"
      - "internal/migrate/postgres/0019_product_access.up.sql"
      - "internal/migrate/postgres/0020_product_access_cutover.up.sql"
      - "internal/migrate/postgres/0021_entitlement_cache.up.sql"
      - "internal/migrate/postgres/0024_cost_resolutions.up.sql"
      - "internal/migrate/postgres/0025_cost_refusals.up.sql"
      - "internal/migrate/postgres/0029_subscription_quantity.up.sql"
      - "internal/migrate/postgres/0031_write_posture.up.sql"
      - "internal/migrate/postgres/0032_mandates.up.sql"
      - "internal/migrate/postgres/0033_customer_contacts.up.sql"
      - "internal/migrate/postgres/0034_price_migrations.up.sql"
      - "internal/migrate/postgres/0035_psp_credential_fingerprint.up.sql"
      - "internal/migrate/postgres/0036_invoice_overdue_is_a_filter.up.sql"
      - "internal/migrate/postgres/0037_failed_usage.up.sql"
      - "internal/migrate/postgres/0038_orders.up.sql"
      - "internal/migrate/postgres/0039_seat_changes.up.sql"
      - "internal/migrate/postgres/0040_card_versions.up.sql"
      - "internal/migrate/postgres/0041_default_payment_method.up.sql"
      - "internal/migrate/postgres/0042_catalog_ownership.up.sql"
      - "internal/migrate/postgres/0043_notification_email_lease.up.sql"
      - "internal/migrate/postgres/0044_rate_windows.up.sql"
      - "internal/migrate/postgres/0045_fx_rates.up.sql"
      - "internal/migrate/postgres/0046_drop_spend_delegations.up.sql"
      - "internal/migrate/postgres/0047_fx_rates_in_memory.up.sql"
      - "internal/migrate/postgres/0048_drop_rate_windows.up.sql"
      - "internal/migrate/postgres/0049_merchant_config_out_of_postgres.up.sql"
      - "internal/migrate/postgres/0050_drop_card_attempt_failures.up.sql"
      - "internal/migrate/postgres/0051_order_payment_axis.up.sql"
      - "internal/migrate/postgres/0052_payment_method_requires_action.up.sql"
    database:
      uri: "${SQLC_DATABASE_URL}"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
