version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/migrate/postgres/0001_schema.up.sql"
      - "internal/migrate/postgres/0002_calendar_billing_intervals.up.sql"
      - "internal/migrate/postgres/0003_usage_limits.up.sql"
      - "internal/migrate/postgres/0004_drop_access_cutover_contract.up.sql"
      - "internal/migrate/postgres/0005_customer_messages.up.sql"
      - "internal/migrate/postgres/0006_change_log.up.sql"
      - "internal/migrate/postgres/0007_dashboard_retired_measures.up.sql"
      - "internal/migrate/postgres/0008_drop_entitlement_cache_contract.up.sql"
      - "internal/migrate/postgres/0009_order_keys_and_cancel_kinds.up.sql"
      - "internal/migrate/postgres/0010_credit_grants.up.sql"
      - "internal/migrate/postgres/0011_disputes.up.sql"
      - "internal/migrate/postgres/0012_operation_log.up.sql"
      - "internal/migrate/postgres/0013_limit_counts.up.sql"
      - "internal/migrate/postgres/0014_bounded_gate.up.sql"
      - "internal/migrate/postgres/0015_event_store.up.sql"
      - "internal/migrate/postgres/0016_mrr.up.sql"
      - "internal/migrate/postgres/0018_contact_erasure_admission.up.sql"
      - "internal/migrate/postgres/0023_decline_causes.up.sql"
      - "internal/migrate/postgres/0024_payment_method_versions_restrict.up.sql"
      - "internal/migrate/postgres/0025_usage_on_event_store.up.sql"
      - "internal/migrate/postgres/0026_books.up.sql"
      - "internal/migrate/postgres/0027_mrr_at_risk.up.sql"
      - "internal/migrate/postgres/0028_usage_posting_watermark.up.sql"
      - "internal/migrate/postgres/0029_revenue_schedules.up.sql"
      - "internal/migrate/postgres/0030_stripe_fees.up.sql"
      - "internal/migrate/postgres/0031_credit_books.up.sql"
      - "internal/migrate/postgres/0032_run_leases.up.sql"
      - "internal/migrate/postgres/0033_merchant_unit_spending.up.sql"
      - "internal/migrate/postgres/0034_reporting_mrr.up.sql"
      - "internal/migrate/postgres/0035_dashboard_retired_mrr_measures.up.sql"
      - "internal/migrate/postgres/0036_books_reversals.up.sql"
      - "internal/migrate/postgres/0037_unit_order_revenue.up.sql"
      - "internal/migrate/postgres/0038_write_posture_comments.up.sql"
      - "internal/migrate/postgres/0039_lease_in_flight_off_customers.up.sql"
      - "internal/migrate/postgres/0040_migration_cohort_order.up.sql"
      - "internal/migrate/postgres/0041_mrr_totals_settle.up.sql"
      - "internal/migrate/postgres/0044_drop_request_holds.up.sql"
      - "internal/migrate/postgres/0046_mrr_keyed_reads.up.sql"
      - "internal/migrate/postgres/0047_usage_receivable.up.sql"
      - "internal/migrate/postgres/0048_checkout_analytics.up.sql"
      - "internal/migrate/postgres/0049_merchant_controls.up.sql"
      - "internal/migrate/postgres/0050_nmi_history_due.up.sql"
      - "internal/migrate/postgres/0051_dispute_findings_name_psp.up.sql"
    database:
      uri: "${SQLC_DATABASE_URL}"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
