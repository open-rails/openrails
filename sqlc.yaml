version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/migrate/postgres/0001_schema.up.sql"
      - "internal/migrate/postgres/0002_ledger_balance.up.sql"
      - "internal/migrate/postgres/0003_transfer_types.up.sql"
      - "internal/migrate/postgres/0004_customer_paid_totals.up.sql"
      - "internal/migrate/postgres/0005_usage_quarter_hours.up.sql"
      - "internal/migrate/postgres/0006_usage_receipts.up.sql"
      - "internal/migrate/postgres/0007_retired_jobs.up.sql"
      - "internal/migrate/postgres/0008_rebill_watch_dropped.up.sql"
      - "internal/migrate/postgres/0009_usage_receipt_per_posting.up.sql"
      - "internal/migrate/postgres/0010_amount_low_balance.up.sql"
      - "internal/migrate/postgres/0011_customer_destructive_reservations.up.sql"
      - "internal/migrate/postgres/0012_merchant_invoices_open.up.sql"
      - "internal/migrate/postgres/0013_mrr_from_facts.up.sql"
      - "internal/migrate/postgres/0014_books_measures.up.sql"
      - "internal/migrate/postgres/0015_deposits_and_reserves.up.sql"
      - "internal/migrate/postgres/0016_import_history.up.sql"
      - "internal/migrate/postgres/0017_known_through.up.sql"
      - "internal/migrate/postgres/0018_imported_known_through.up.sql"
      - "internal/migrate/postgres/0019_operation_log_delete_guard.up.sql"
      - "internal/migrate/postgres/0020_operation_log_expired.up.sql"
    database:
      uri: "${SQLC_DATABASE_URL}"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
