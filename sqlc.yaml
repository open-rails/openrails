version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/migrate/postgres/0001_schema.up.sql"
      - "internal/migrate/postgres/0002_calendar_billing_intervals.up.sql"
      - "internal/migrate/postgres/0003_usage_limits.up.sql"
      - "internal/migrate/postgres/0004_drop_access_cutover_contract.up.sql"
      - "internal/migrate/postgres/0005_customer_messages.up.sql"
      - "internal/migrate/postgres/0006_change_log.up.sql"
      - "internal/migrate/postgres/0007_dashboard_retired_measures.up.sql"
      - "internal/migrate/postgres/0008_drop_entitlement_cache_contract.up.sql"
      - "internal/migrate/postgres/0009_order_keys_and_cancel_kinds.up.sql"
      - "internal/migrate/postgres/0010_credit_grants.up.sql"
      - "internal/migrate/postgres/0011_disputes.up.sql"
      - "internal/migrate/postgres/0012_operation_log.up.sql"
      - "internal/migrate/postgres/0013_limit_counts.up.sql"
      - "internal/migrate/postgres/0014_bounded_gate.up.sql"
      - "internal/migrate/postgres/0015_event_store.up.sql"
      - "internal/migrate/postgres/0016_mrr.up.sql"
      - "internal/migrate/postgres/0018_contact_erasure_admission.up.sql"
      - "internal/migrate/postgres/0023_decline_causes.up.sql"
      - "internal/migrate/postgres/0027_mrr_at_risk.up.sql"
    database:
      uri: "${SQLC_DATABASE_URL}"
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: "gen"
        out: "internal/db/gen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
