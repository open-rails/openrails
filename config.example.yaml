# OpenRails runtime infrastructure config.
#
# Merchant/provider/catalog/auth authority is seeded with the bootstrap/catalog
# commands and stored in OpenRails/AuthKit state. Keep config.yaml for process
# infrastructure: listeners, databases, Vault, rate limits, captcha, and similar
# deployment concerns.

env: development
provider_write_mode: full # full | limited | readonly; UNSET fail-closes to readonly (no provider writes) — set full/limited explicitly; required outside development
test_mode: true           # sandbox credentials; development only

host: 0.0.0.0
port: 3053
api_url: http://localhost:3053

logger:
  level: info       # debug | info | warn | error | fatal | panic

db:
  url: ""           # optional; overrides the fields below when set
  host: localhost
  port: "5434"
  database: openrails_db
  username: admin
  password: admin_password
  sslmode: disable
  schema: openrails # defaults to 'openrails' if not specified

redis:
  addr: localhost:6380
  password: ""
  db: 0

auth:
  issuer: http://localhost:3053 # issuer URL; JWKS is served under this authority
  # signing keys are loaded by AuthKit from env, /vault/auth/keys.json,
  # or development-only generated keys under .runtime/authkit

encryption:
  master_key: ""    # base64-encoded 32-byte AES-256 key; empty disables it

vault:
  enabled: false
  address: ""       # defaults to the Vault client default / VAULT_ADDR
  auth_method: ""   # token | approle | kubernetes
  token: ""
  role_id: ""
  secret_id: ""
  k8s_role: ""

clickhouse:
  http_addr: http://localhost:8124
  client_addr: localhost:9003
  db: analytics
  user: analytics_user
  password: analytics_password
  cluster: openrails

sendgrid:
  api_key: ""

rate_limits:
  subscribe:
    requests_per_minute: 20
  checkout:
    requests_per_minute: 10
  webhook:
    requests_per_minute: 1200
  payment:
    requests_per_minute: 40
  default:
    requests_per_minute: 300

captcha:
  provider: turnstile   # turnstile | recaptcha-v3 | hcaptcha
  site_key: ""
  secret_key: ""

