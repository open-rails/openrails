# OpenRails runtime infrastructure config.
#
# Merchant/provider/catalog/auth authority is seeded with the bootstrap/catalog
# commands and stored in OpenRails/AuthKit state. Keep config.yaml for process
# infrastructure: listeners, databases, Vault, rate limits, captcha, and similar
# deployment concerns.

env: development
mode: full          # full | limited | readonly; required outside development
test_env: true      # sandbox credentials; development only

host: 0.0.0.0
port: 2053
api_url: http://localhost:2053

logger:
  level: info       # debug | info | warn | error | fatal | panic

db:
  url: ""           # optional; overrides the fields below when set
  host: localhost
  port: "5432"
  database: openrails_db
  username: admin
  password: ""
  sslmode: disable
  schema: openrails
  require_rls: false

redis:
  addr: garnet:6379
  password: ""
  db: 0

auth:
  control_plane:
    issuer: http://localhost:2053
    token_prefix: openrails
    public_hosted: false
    bootstrap_admin_service_token_name: openrails-bootstrap-admin

encryption:
  master_key: ""    # base64-encoded 32-byte AES-256 key; empty disables it

vault:
  enabled: false
  address: ""       # defaults to the Vault client default / VAULT_ADDR
  auth_method: ""   # token | approle | kubernetes
  token: ""
  role_id: ""
  secret_id: ""
  k8s_role: ""
  kv_mount: secret
  transit_mount: transit
  use_transit_for_solana: false
  secret_cache_ttl_seconds: 900

clickhouse:
  http_addr: http://localhost:8123
  client_addr: localhost:9000
  db: analytics
  user: analytics_user
  password: analytics_password
  cluster: openrails

sendgrid:
  api_key: ""

rate_limits:
  subscribe:
    requests_per_minute: 20
  checkout:
    requests_per_minute: 10
  webhook:
    requests_per_minute: 1200
  payment:
    requests_per_minute: 40
  default:
    requests_per_minute: 300

captcha:
  provider: turnstile   # turnstile | recaptcha-v3 | hcaptcha
  site_key: ""
  secret_key: ""

usdc_funding:
  providers:
    robinhood:
      enabled: false
      supported_networks: [solana]
      launch_url_template: ""
      api_base_url: ""
      api_key_id: ""
      api_key_secret: ""
      api_key: ""
      webhook_secret: ""
    coinbase:
      enabled: false
      supported_networks: [solana]
      launch_url_template: ""
      api_base_url: https://api.cdp.coinbase.com
      api_key_id: ""
      api_key_secret: ""
      api_key: ""
      webhook_secret: ""
