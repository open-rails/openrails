# OpenRails runtime infrastructure config.
#
# Keep config.yaml for process infrastructure: listeners, databases, Vault,
# rate limits, captcha, and similar deployment concerns. Merchant configuration
# (PSPs, custodians, settings) lives in the merchant manifest or in Vault.

provider_write_mode: full # full | limited | readonly; REQUIRED: boot refuses it unset
test_mode: sandbox        # sandbox | live; allowed in every environment (#762) — rail-credential validation, not env, keeps it honest. REQUIRED: the credential posture is never inherited by omission

host: 0.0.0.0
port: 3053
# private_port: 9090 # the operator's /metrics, apart from the public port; unset serves none
# On SIGTERM: readiness fails at once, serving continues for drain_delay, then
# in-flight requests and workers finish within shutdown_timeout.
# drain_delay: 5s
# shutdown_timeout: 20s
public_billing_base_url: http://localhost:3053

# Minimum separation between two equal post-absence provider-billing reads.
# Empty defaults to 24h; values must be positive whole-second Go durations.
# provider_billing_quiescence_interval: 24h

logger:
  level: info       # debug | info | warn | error | fatal | panic

db:
  url: ""           # optional; overrides the fields below when set
  host: localhost
  port: "5434"
  database: openrails_db
  # One role: the server migrates as it at boot and owns what it creates.
  # Merchant isolation is per-query merchant predicates, not login flags.
  username: app
  password: app_password
  sslmode: disable

database:
  schema: billing # every OpenRails table lives here; defaults to 'billing' (env DATABASE_SCHEMA)
  # river_schema: billing_river # OpenRails' River jobs; defaults to the schema plus '_river'

# Rate limits, lockouts, captcha challenges and card-testing declines, shared
# by every instance.
# Without redis they live in this process's memory: run one instance only.
# While a declared Redis does not answer, each process keeps its own.
redis:
  addr: localhost:6380 # or url: rediss://user:password@cache.example:6380/0
  password: ""
  db: 0
  # username: openrails # ACL user
  # tls: true           # verify against the system roots, or ca_cert
  # ca_cert: |          # PEM CA bundle; implies TLS (env REDIS_CA_CERT)
  #   -----BEGIN CERTIFICATE-----

# The server's AuthKit: its own configuration, by AuthKit's keys
# (github.com/open-rails/authkit). It decides who every request is: the
# server's own accounts and API keys, and the access tokens trusted issuers
# mint for auth.resource.id. Env AUTH_<KEY> sets auth.<key> (AUTH_TOKEN_ISSUER,
# AUTH_SIGN_IN_DPOP).
auth:
  token:
    issuer: http://localhost:3053 # issuer URL; JWKS is served under this authority
  keys:
    allow_ephemeral_dev_keys: true # disposable local signing key; else keys.path or AUTHKIT_ACTIVE_PRIVATE_KEY_PEM
  registration:
    allow_missing_senders: true # no email delivery in this local example
  http:
    # Declare only when AuthKit receives direct client connections. Behind
    # proxies, the top-level trusted_proxies apply.
    direct_peer_ip: true
  # database:
  #   schema: profiles # the server's AuthKit tables
  # Accept the RFC 9068 access tokens trusted issuers mint for this
  # deployment: their users call the API directly. Each merchant's trusted
  # issuers are AuthKit remote applications in its group.
  # resource:
  #   id: https://openrails.example.com # the tokens' aud
  # sign_in:
  #   dpop: optional # optional | required: how this instance issues tokens to its own users

# The rename policy for merchant names (shown defaults); usernames follow
# auth.username.
naming:
  enabled: true
  rename_interval: 72h
  former_names:
    mode: finite # finite | forever | immediate; omit duration for the latter two
    duration: 2160h # 90 days

# Sign-in to OpenRails' own accounts (password, passwordless, registration).
# Off, the default: people sign in at a trusted issuer, and the console with it
# (admin_console.issuer). Turn it on when you have no identity provider.
# local_sign_in: true

# Declaring vault connects to it (VAULT_* env settings declare it too). Name a
# KV mount and Vault holds merchant configuration; name only a Transit mount
# and it only signs.
# vault:
#   kv_mount: ""      # KV v2 mount holding merchant configuration
#   scope_prefix: ""  # path under the mount; default openrails
#   transit_mount: "" # Transit mount for Solana signers; default transit
#   address: ""       # defaults to the Vault client default / VAULT_ADDR
#   auth_method: ""   # token | approle | kubernetes
#   token: ""
#   role_id: ""
#   secret_id: ""
#   k8s_role: ""
#   auth_mount: ""    # approle/kubernetes mount path without auth/; default the method's name

# The built-in email sender, for billing and control-plane mail: any SMTP
# server (SendGrid: host smtp.sendgrid.net, username apikey, password the API
# key). Port 465 is implicit TLS, else STARTTLS; an empty host sends no email.
# Billing mail is sent from the merchant's profile from_email when it has one;
# `from` is the deployment's own mailbox.
# email_smtp:
#   host: ""
#   port: 587
#   username: ""
#   password: ""
#   from: "Billing <noreply@example.com>"

rate_limits:
  subscribe:
    requests_per_minute: 20
  checkout:
    requests_per_minute: 10
  webhook:
    requests_per_minute: 1200
  payment:
    requests_per_minute: 40

# Exact origins checkout success/cancel and billing-portal return URLs may
# name. Empty allows only the origin of public_billing_base_url.
# return_origins:
#   - https://shop.example.com

# How long a rotated-out webhook signing secret keeps verifying (max 168h).
# webhook_secret_overlap: 24h

# CIDRs whose X-Forwarded-For is trusted (#746). Empty (default) trusts
# NOTHING — rate limiting, abuse tracking, webhook IPAddress recording, and the
# CCBill IP allowlist all use the raw socket peer. Set this to your load
# balancer's/reverse proxy's address range when deploying behind one.
# trusted_proxies:
#   - 10.0.0.0/8

# Cloudflare egress ranges, ONLY where Cloudflare fronts this origin: trusted for
# X-Forwarded-For like trusted_proxies, and the only peers AuthKit accepts
# CF-Connecting-IP from. Lock the origin down to Cloudflare ingress when set.
# cloudflare_proxies:
#   - 173.245.48.0/20

# EXTRA CCBill webhook source CIDRs, on top of CCBill's own documented ranges.
# CCBill signs nothing, so this list is authentication: entries are honored only
# under test_mode: sandbox and only while no live CCBill PSP exists anywhere in
# the catalog. `/0` is refused. Empty (default) accepts CCBill's ranges alone.
# ccbill_webhook_ip_allowlist:
#   - 127.0.0.1/32

# Loopback-only provider gateway for sandbox qualification: every store-armed
# NMI client (checkout sales, invoice collection, payment-method updates and
# their verify reads) talks to nmi_gateway_url; Stripe requests use
# stripe_api_url through the same guarded transport, Solana RPC reads
# and submissions use solana_rpc_url, and CCBill DataLink uses
# ccbill_datalink_url. Store
# credentials are sent there, so the host must be a loopback IP literal
# (127.0.0.0/8 or ::1; no hostnames, no userinfo) and the posture sandbox;
# anything else refuses to boot. Process config only, never a merchant setting.
# provider_sandbox:
#   nmi_gateway_url: http://127.0.0.1:9091
#   stripe_api_url: http://127.0.0.1:9092
#   solana_rpc_url: http://127.0.0.1:9093
#   ccbill_datalink_url: http://127.0.0.1:9094

captcha:
  provider: turnstile   # turnstile | recaptcha-v3 | hcaptcha
  site_key: ""
  secret_key: ""


# Route groups beyond the public, customer and webhook routes, each off until
# turned on here. Each route checks the server's own merchant permission
# (merchant:<resource>:<action>); programmatic (/v1/app, with SCIM
# provisioning) takes a merchant's application credential, never a person,
# holding merchant:entitlements:read, catalog:read, usage:manage,
# costs:manage or events:read for each route.
route_groups:
  admin: true            # customer support: customers, subscriptions, payments, refunds, invoices
  catalog: true          # products, prices, meters, price migrations
  merchant_config: true  # PSPs, settings, billing import and export
  metrics: true          # business metrics, read-only
  programmatic: true     # your backend's calls and SCIM user provisioning

# Merchant admin console (staff dashboard), served at path. Off by default:
# while enabled is false no console route exists. Needs console assets in the
# binary: `task build` embeds web/admin/dist after `task admin-build`; enabled
# without them refuses boot. It signs in through the control plane's AuthKit.
admin_console:
  enabled: false
  # path: /admin             # e.g. /billing/admin when /admin is taken
  # issuer:                  # staff sign in at a merchant's trusted issuer
  #   url: https://example.com/auth
  #   client_id: openrails-console   # public client, redirect URI <console path>/callback
  #   # name: Example        # sign-in button; default the trusted issuer's name
  #   # scope: openid profile email offline_access openrails:merchant  # when the issuer needs offline_access

# Server-side LLM for the dashboard natural-language widget generator (#741)
# and metrics Q&A (#756). FAIL-CLOSED: no api_key = the generate/ask endpoints
# answer 501 and the console hides the NL box; the dashboard works without it.
# llm:
#   provider: anthropic      # anthropic (default) | openai
#   model: ""                # default per provider (anthropic: claude-haiku-4-5-20251001,
#                            # openai: gpt-5.4-nano — cheapest capable; schema does the heavy lifting)
#   api_key: ""              # SECRET — set env LLM_API_KEY or a mounted secret file
#   base_url: ""             # optional endpoint override (env LLM_BASE_URL) — with provider=openai
#                            # this serves any OpenAI-compatible backend, base INCLUDES /v1
#                            # (e.g. https://api.groq.com/openai/v1, https://models.example/v1)
#   ask_enabled: false       # #756 consent: /metrics/ask sends aggregate query RESULTS to the
#                            # LLM provider (widget generation sends only the schema) — opt in
#                            # explicitly; env LLM_ASK_ENABLED
#   catalog_copilot_enabled: false   # #779 Phase 1 consent: /catalog/ask sends aggregate
#                            # catalog/subscriber-count data to the LLM provider; env
#                            # LLM_CATALOG_COPILOT_ENABLED
#   catalog_drafting_enabled: false  # #779 Phase 2: arms the draft_price_change/draft_catalog_diff
#                            # proposal tools; #781 notice-window enforcement remains server-side
#                            # and this gate requires separate deployment consent; env
#                            # LLM_CATALOG_DRAFTING_ENABLED
