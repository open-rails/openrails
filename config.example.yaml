# OpenRails runtime infrastructure config.
#
# Provider credential custody and catalog write policy are independent.
# Keep config.yaml for process
# infrastructure: listeners, databases, Vault, rate limits, captcha, and similar
# deployment concerns.

provider_write_mode: full # full | limited | readonly; REQUIRED: boot refuses it unset
test_mode: sandbox        # sandbox | live; allowed in every environment (#762) — rail-credential validation, not env, keeps it honest. REQUIRED: the credential posture is never inherited by omission

secret_backend: snapshot # immutable host values; alternatively vault or encrypted db
credential_read_only: false # may restrict a managed backend; cannot grant storage privileges
catalog_edits: false # mount the merchant API's catalog-write routes; independent of credential custody
# Trusted local operator catalog application remains available when false.
# DB credentials require encryption.master_key in every credential posture.
# alert_secret_backend: db # optional managed outbound webhooks beside a snapshot
# credential_snapshot_id: <canonical UUID> # stable host identity for an explicit custody transition

host: 0.0.0.0
port: 3053
public_billing_base_url: http://localhost:3053

# Minimum separation between two equal post-absence provider-billing reads.
# Empty defaults to 24h; values must be positive whole-second Go durations.
# provider_billing_quiescence_interval: 24h

logger:
  level: info       # debug | info | warn | error | fatal | panic

db:
  url: ""           # optional; overrides the fields below when set
  host: localhost
  port: "5434"
  database: openrails_db
  # One role for `openrails migrate up` and the server: it owns what it creates.
  # Merchant isolation is per-query merchant predicates, not login flags.
  username: app
  password: app_password
  sslmode: disable

schema: billing # every OpenRails table lives here; defaults to 'billing' (env DB_SCHEMA)
# schema_owner: openrails_app # migrate hands the schema to this existing role

redis:
  addr: localhost:6380
  password: ""
  db: 0

auth:
  allow_loopback_http: true # explicit local issuer exception
  allow_memory: true # local single-process AuthKit store
  allow_missing_senders: true # no email delivery in this local example
  allow_ephemeral_signing_key: true # disposable local signing key
  request_origin: http://localhost:3053 # public HTTP origin, no billing mount path
  issuer: http://localhost:3053 # issuer URL; JWKS is served under this authority
  # Declare only when AuthKit receives direct client connections.
  # Behind proxies, configure top-level trusted_proxies instead.
  direct_peer_ip: true
  # Site naming policy for merchant names and usernames (shown defaults).
  naming:
    enabled: true
    rename_interval: 72h
    former_names:
      mode: finite # finite | forever | immediate; omit duration for the latter two
      duration: 2160h # 90 days
  # signing keys are loaded by AuthKit from env or <keys_path>/keys.json
  # (default /vault/auth); allow_ephemeral_signing_key generates development
  # keys.json and totp.key there

# Access tokens (RFC 9068 at+jwt) that your identity provider mints for this
# deployment: its users call the merchant API directly, and OpenRails holds no
# accounts for them. Permissions come from the token, within the ceiling.
# resource_server:
#   identifier: https://openrails.example.com  # the tokens' aud
#   dpop_nonce_key: ""        # >= 32 bytes, same on every replica; env RESOURCE_SERVER_DPOP_NONCE_KEY
#   trusted_issuers:
#     - name: example
#       issuer: https://example.com/auth      # exact iss; keys from <issuer>/.well-known/jwks.json
#       merchants: [example]                  # the merchants its tokens act for
#       permissions: ["merchant:*"]           # the ceiling
#       allowed_origins: [https://admin.example.com]
#       # group_roles: {billing-admins: owner}  # only for issuers that cannot mint permissions

encryption:
  master_key: ""    # base64 32-byte AES-256 key; host provider credentials alone do not need it
                    # Required for DB-backed alert webhook URLs and HyperSwitch SDK captures.

vault:
  enabled: false
  address: ""       # defaults to the Vault client default / VAULT_ADDR
  auth_method: ""   # token | approle | kubernetes
  token: ""
  role_id: ""
  secret_id: ""
  k8s_role: ""

# The built-in email sender, for billing and control-plane mail. Billing mail
# is sent from the merchant's profile from_email when it has one; `from` is the
# deployment's own address.
# sendgrid:
#   api_key: ""
#   from_address: ""
#   from_name: ""

rate_limits:
  subscribe:
    requests_per_minute: 20
  checkout:
    requests_per_minute: 10
  webhook:
    requests_per_minute: 1200
  payment:
    requests_per_minute: 40

# Exact origins checkout success/cancel and billing-portal return URLs may
# name. Empty allows only the origin of public_billing_base_url.
# return_origins:
#   - https://shop.example.com

# How long a rotated-out webhook signing secret keeps verifying (max 168h).
# webhook_secret_overlap: 24h

# CIDRs whose X-Forwarded-For is trusted (#746). Empty (default) trusts
# NOTHING — rate limiting, abuse tracking, webhook IPAddress recording, and the
# CCBill IP allowlist all use the raw socket peer. Set this to your load
# balancer's/reverse proxy's address range when deploying behind one.
# trusted_proxies:
#   - 10.0.0.0/8

# Cloudflare egress ranges, ONLY where Cloudflare fronts this origin: trusted for
# X-Forwarded-For like trusted_proxies, and the only peers AuthKit accepts
# CF-Connecting-IP from. Lock the origin down to Cloudflare ingress when set.
# cloudflare_proxies:
#   - 173.245.48.0/20

# EXTRA CCBill webhook source CIDRs, on top of CCBill's own documented ranges.
# CCBill signs nothing, so this list is authentication: entries are honored only
# under test_mode: sandbox and only while no live CCBill PSP exists anywhere in
# the catalog. `/0` is refused. Empty (default) accepts CCBill's ranges alone.
# ccbill_webhook_ip_allowlist:
#   - 127.0.0.1/32

# Loopback-only provider gateway for sandbox qualification: every store-armed
# NMI client (checkout sales, invoice collection, payment-method updates and
# their verify reads) talks to nmi_gateway_url; Stripe requests use
# stripe_api_url through the same guarded transport, Solana RPC reads
# and submissions use solana_rpc_url, and CCBill DataLink uses
# ccbill_datalink_url. Store
# credentials are sent there, so the host must be a loopback IP literal
# (127.0.0.0/8 or ::1; no hostnames, no userinfo) and the posture sandbox;
# anything else refuses to boot. Process config only, never a merchant setting.
# provider_sandbox:
#   nmi_gateway_url: http://127.0.0.1:9091
#   stripe_api_url: http://127.0.0.1:9092
#   solana_rpc_url: http://127.0.0.1:9093
#   ccbill_datalink_url: http://127.0.0.1:9094

captcha:
  provider: turnstile   # turnstile | recaptcha-v3 | hcaptcha
  site_key: ""
  secret_key: ""


# Merchant admin console (staff dashboard), served at path. Off by default:
# while enabled is false no console route exists. Needs console assets in the
# binary: `task build` embeds web/admin/dist after `task admin-build`; enabled
# without them refuses boot. It signs in through the control plane's AuthKit.
admin_console:
  enabled: false
  # path: /admin             # e.g. /billing/admin when /admin is taken
  # new_merchant_url: /merchants/new  # host page behind "New merchant"; unset hides it

# Server-side LLM for the dashboard natural-language widget generator (#741)
# and metrics Q&A (#756). FAIL-CLOSED: no api_key = the generate/ask endpoints
# answer 501 and the console hides the NL box; the dashboard works without it.
# llm:
#   provider: anthropic      # anthropic (default) | openai
#   model: ""                # default per provider (anthropic: claude-haiku-4-5-20251001,
#                            # openai: gpt-5.4-nano — cheapest capable; schema does the heavy lifting)
#   api_key: ""              # SECRET — set env LLM_API_KEY or a mounted secret file
#   base_url: ""             # optional endpoint override (env LLM_BASE_URL) — with provider=openai
#                            # this serves any OpenAI-compatible backend, base INCLUDES /v1
#                            # (e.g. https://api.groq.com/openai/v1, https://models.example/v1)
#   ask_enabled: false       # #756 consent: /metrics/ask sends aggregate query RESULTS to the
#                            # LLM provider (widget generation sends only the schema) — opt in
#                            # explicitly; env LLM_ASK_ENABLED
#   catalog_copilot_enabled: false   # #779 Phase 1 consent: /catalog/ask sends aggregate
#                            # catalog/subscriber-count data to the LLM provider; env
#                            # LLM_CATALOG_COPILOT_ENABLED
#   catalog_drafting_enabled: false  # #779 Phase 2: arms the draft_price_change/draft_catalog_diff
#                            # proposal tools; #781 notice-window enforcement remains server-side
#                            # and this gate requires separate deployment consent; env
#                            # LLM_CATALOG_DRAFTING_ENABLED
