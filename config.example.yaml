# OpenRails runtime infrastructure config.
#
# Keep config.yaml for process infrastructure: listeners, databases, Vault,
# rate limits, captcha, and similar deployment concerns. Merchant configuration
# (PSPs, custodians, settings) lives in the merchant manifest or in Vault.
# Every key has the default docs/standalone.md's configuration reference
# states; with none set, `openrails run-server` runs against the Compose
# dependencies (`docker compose up -d postgres garnet`). The values below
# are the defaults unless a comment says otherwise.

# Whether money is real is each PSP's declared environment (live | test |
# sandbox) in the merchant configuration, never this file's. How much OpenRails
# writes to a merchant's providers is the merchant's write posture
# (`openrails merchant hold` / `openrails merchant arm`).

host: 0.0.0.0
port: 3053
# The metrics listener: the operator's Prometheus GET /metrics (dependency
# up/down, abuse-state fallbacks, per-job-kind health), on its own port so it
# is never public. Unset serves none; the Helm chart sets 9090. Not the
# merchant dashboard's business metrics, which are the /v1/metrics API on port.
# metrics_port: 9090
# On SIGTERM readiness fails at once, serving continues for 5s, then in-flight
# requests and workers finish within 20s.
public_billing_base_url: http://localhost:3053 # default http://localhost:<port>

logger:
  level: info       # debug | info | warn | error
  format: json      # json | text

# The database: its connection and OpenRails' schemas. One role: the server
# migrates as it at boot and owns what it creates. Merchant isolation is
# per-query merchant predicates, not login flags.
database:
  # With no connection key set: Compose's Postgres (env DATABASE_URL). Or the
  # parts below, all four of host, port, name and username.
  url: postgres://app:app_password@localhost:5434/openrails_db?sslmode=disable
  # host: db.example.com
  # port: "5432"
  # name: openrails
  # username: openrails
  # password: ""
  # sslmode: verify-full # default; require for a loopback host or Unix socket
  # sslrootcert: /etc/openrails/db-ca.pem # the CAs that verify the database; unset, the system roots
  # sql_trace: false # log every query at debug level
  lease_conns: 4
  schema: billing # every OpenRails table lives here (env DATABASE_SCHEMA)
  # river_schema: billing_river # OpenRails' River jobs; default the schema plus '_river'

# The event store usage needs (ClickHouse's native protocol). Without it
# usage, limits and admissions answer event_store_required.
# clickhouse:
#   addr: localhost:9000 # default none: usage is off
#   database: openrails  # created or upgraded at boot
#   username: default    # password from CLICKHOUSE_PASSWORD

# Rate limits, lockouts, captcha challenges and card-testing declines, shared
# by every instance.
# Without redis they live in this process's memory: run one instance only.
# While a declared Redis does not answer, each process keeps its own. Default
# none.
redis:
  addr: localhost:6380 # or url: rediss://user:password@cache.example:6380/0
  password: ""
  db: 0
  # username: openrails # ACL user
  # tls: true           # verify against the system roots, or ca_cert
  # ca_cert: |          # PEM CA bundle; implies TLS (env REDIS_CA_CERT)
  #   -----BEGIN CERTIFICATE-----

# The server's AuthKit decides who every request is: its own staff accounts
# and API keys, and the access tokens trusted issuers mint for it. OpenRails
# derives its configuration: issuer and resource are public_billing_base_url,
# its tables live in <database.schema>_auth, and its client IP follows
# trusted_proxies. Staff join by invitation, need a passkey or an
# authenticator app, and stay signed in for 30 days.
# auth:
#   keys:
#     path: /vault/auth # keys.json and totp.key (env AUTH_KEYS_PATH); default /vault/auth, or generated development keys for a loopback issuer

# The rename policy for merchant names (shown defaults); usernames follow
# AuthKit's username policy.
naming:
  enabled: true
  rename_interval: 72h
  former_names:
    mode: finite # finite | forever | immediate; omit duration for the latter two
    duration: 2160h # 90 days

# Declaring vault connects to it (VAULT_* env settings declare it too). Name a
# vault.kv_mount and Vault holds merchant configuration. Platform credentials
# can use their own mount while merchant configuration stays in files.
# vault:
#   kv_mount: ""      # KV v2 mount holding merchant configuration
#   scope_prefix: openrails # path under the mount
#   transit_mount: transit  # Transit mount for Solana crankers
#   address: ""       # VAULT_ADDR; default https://127.0.0.1:8200
#   ca_cert: ""       # path of the private CA's PEM (VAULT_CACERT); the only trust when set
#   auth_method: ""   # token | approle | kubernetes
#   token: ""
#   role_id: ""
#   secret_id: ""
#   secrets_path: "" # directory of mounted secret files; every approle login reads VAULT_SECRET_ID there
#   k8s_role: ""
#   auth_mount: ""    # approle/kubernetes mount path without auth/; default the method's name

# Platform card credentials use the same Vault connection and scope_prefix.
# Omit this kv_mount to reuse vault.kv_mount. Set only this one to keep merchant
# configuration in files. The credential document is platform_vault/<tenant_id>.
# card_vault:
#   kind: basis_theory
#   tenant_id: ""
#   kv_mount: billing-secrets

# Solana rebilling's crankers, in order: the first publishes new plans, and
# each pulls the plans it owns. None turns Solana rebilling off; one-time
# Solana payments still work. SOLANA_CRANKERS takes them as a JSON list, from
# the environment or a mounted secret file. docs/standalone.md#configuration-reference.
# solana:
#   crankers:
#     - {mode: vault_transit, key: openrails-solana-cranker}
#     - {mode: local_keypair, private_key: ""}

# The built-in email sender, for billing and control-plane mail: any SMTP
# server (SendGrid: host smtp.sendgrid.net, username apikey, password the API
# key). Port 465 is implicit TLS, else STARTTLS; an empty host sends no email.
# Billing mail is sent from the merchant's profile from_email when it has one;
# `from` is the deployment's own mailbox.
# email_smtp:
#   host: ""
#   port: 587
#   username: ""
#   password: ""
#   from: "Billing <noreply@example.com>"

# Policy sections (rate_limits, user_action_rate_limit,
# destructive_action_limits) are set here only, never in the environment.
# Shown are the defaults.

# Requests per minute per client, by bucket; 0 leaves a bucket unlimited.
rate_limits:
  purchase:
    requests_per_minute: 10   # buying: checkout and paying an order
  payment:
    requests_per_minute: 40   # a customer's payment-method routes
  subscribe:
    requests_per_minute: 20   # a customer's subscription changes
  webhook:
    requests_per_minute: 1200 # provider callbacks

# Customer card removals and subscription cancellations: one merchant-wide
# budget of distinct customers, whatever the rate_limits.
user_action_rate_limit:
  minimum_customers_per_hour: 5            # the hourly budget's floor
  paid_customers_per_hourly_customer: 400  # +1 an hour per this many paying customers
  minimum_customers_per_day: 10            # the daily budget's floor
  paid_customers_per_daily_customer: 100   # +1 a day per this many paying customers

# Staff refunds, revokes, cancels and other held destructive actions per
# rolling hour/day (docs/standalone.md#destructive-holds).
destructive_action_limits:
  actor_per_hour: 5          # one actor's an hour
  actor_per_day: 15          # one actor's a day
  merchant_per_hour: 15      # one merchant's floor an hour, rising with its active customers
  merchant_per_day: 25       # one merchant's floor a day
  deployment_per_hour: 50    # the deployment's floor an hour, rising with active customers
  deployment_per_day: 100    # the deployment's floor a day
  erasure_per_hour: 100      # a merchant's contact erasures an hour, rising with its directory
  erasure_per_day: 1000      # a merchant's contact erasures a day

# Return URLs (pay URLs, hosted payments, the billing portal) may name only
# the billing origin, the merchant's issuer's or its checkout.embed_origins.

# CIDRs of your own proxies, whose X-Forwarded-For is trusted. Empty (default)
# trusts none of yours — rate limiting, abuse tracking, webhook IPAddress
# recording, and the CCBill IP allowlist use the raw socket peer. Set this to
# your load balancer's/reverse proxy's address range when deploying behind one.
# Cloudflare's published ranges are built in: trusted like these, and the only
# peers whose CF-Connecting-IP and CF-IPCountry are taken.
# trusted_proxies:
#   - 10.0.0.0/8

# Loopback-only provider gateway for sandbox qualification: every store-armed
# NMI client (purchase sales, invoice collection, payment-method updates and
# their verify reads) talks to nmi_gateway_url; Stripe requests use
# stripe_api_url through the same guarded transport, Solana RPC reads
# and submissions use solana_rpc_url, and CCBill DataLink uses
# ccbill_datalink_url. Store
# credentials are sent there, so the host must be a loopback IP literal
# (127.0.0.0/8 or ::1; no hostnames, no userinfo) and the posture sandbox;
# anything else refuses to boot. Process config only, never a merchant setting.
# ccbill_webhook_sources are EXTRA CCBill webhook source CIDRs, on top of
# CCBill's own documented ranges. CCBill signs nothing, so this list is
# authentication: entries are honored only for a webhook naming a sandbox
# CCBill account. `/0` is refused.
# provider_sandbox:
#   nmi_gateway_url: http://127.0.0.1:9091
#   stripe_api_url: http://127.0.0.1:9092
#   solana_rpc_url: http://127.0.0.1:9093
#   ccbill_datalink_url: http://127.0.0.1:9094
#   ccbill_webhook_sources:
#     - 127.0.0.1/32

captcha:
  provider: turnstile   # turnstile | recaptcha-v3 | hcaptcha
  site_key: ""
  secret_key: ""


# Route groups beyond the public, customer and webhook routes, each off until
# turned on here. Each route checks its permission: the merchant: name
# (merchant:<resource>:<action>) in the merchant's own group, or the root:
# name on root; programmatic (/v1/app, with SCIM
# provisioning) takes a merchant's application credential, never a person,
# holding merchant:entitlements:read, merchant:catalog:read,
# merchant:usage:manage, merchant:events:read or merchant:orders:manage for
# each route.
route_groups:
  admin: true            # customer support: customers, subscriptions, payments, refunds, invoices
  catalog: true          # products, prices, meters, price migrations
  merchant_config: true  # PSPs, settings, billing import and export
  metrics: true          # business metrics, read-only
  programmatic: true     # your backend's calls and SCIM user provisioning

# The standalone staff console defaults to /admin. Set disabled to true for
# an API-only server; route_groups stay independent. Release builds include
# its assets; `task build` embeds web/console/dist after `task admin-build`. A
# source build without assets serves build instructions with status 503.
# Staff sign in with the server's own accounts, or at a merchant's (or root's)
# trusted issuer that signs people in, as the public client openrails-console.
admin_console:
  disabled: false

# The checkout origin, needed only to serve OpenRails' own hosted pay page:
# an order's pay URL (/pay/<order>#<secret>) is on it, where the customer
# pays. Leave it unset with the embedded checkout or your own card form; pay
# URLs then answer pay_url_unavailable. It must be an origin of its own (not
# public_billing_base_url's, the console's or AuthKit's); the server serves
# it by Host.
# checkout_origin: https://pay.example.com

# Server-side LLM for the catalog copilot. Without api_key its endpoint is
# not mounted. Metrics and dashboards do not use an LLM.
# llm:
#   provider: anthropic      # anthropic (default) | openai
#   model: ""                # default per provider (anthropic: claude-haiku-4-5-20251001,
#                            # openai: gpt-5.4-nano — cheapest capable; schema does the heavy lifting)
#   api_key: ""              # SECRET — set env LLM_API_KEY or a mounted secret file
#   base_url: ""             # optional endpoint override (env LLM_BASE_URL) — with provider=openai
#                            # this serves any OpenAI-compatible backend, base INCLUDES /v1
#                            # (e.g. https://api.groq.com/openai/v1, https://models.example/v1)
#   catalog_copilot_enabled: false   # consent: /console/catalog/ask sends aggregate
#                            # catalog/subscriber-count data to the LLM provider; env
#                            # LLM_CATALOG_COPILOT_ENABLED
#   catalog_drafting_enabled: false  # arms the draft_price_change/draft_catalog_diff
#                            # proposal tools; notice-window enforcement remains server-side
#                            # and this gate requires separate deployment consent; env
#                            # LLM_CATALOG_DRAFTING_ENABLED

