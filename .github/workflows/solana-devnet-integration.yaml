name: Solana Devnet Integration

# Scheduled on-chain validation of the recurring-Solana flow against REAL devnet
# USDC (#275). These tests carry the `//go:build devnet` tag and need a funded
# devnet wallet + devnet USDC, so they CANNOT run on the normal PR/push CI
# (which has no funded keys and must stay fast/free). They run on a daily cron
# and on-demand instead.
#
# Required GitHub Actions secrets (Settings -> Secrets and variables -> Actions):
#   HELIUS_API_KEY               — Helius devnet RPC API key.
#   SOLANA_DEVNET_PAYER_KEY      — base58 secret key of a SOL-funded devnet payer
#                                  (funds the subscriber's gas; in the multi-rebill
#                                  test also funds the fresh subscriber's USDC).
#   SOLANA_DEVNET_SUBSCRIBER_KEY — base58 secret key of a devnet wallet whose USDC
#                                  ATA is funded from https://faucet.circle.com
#                                  (Solana devnet, USDC). The allowlist only
#                                  resolves real USDC, not a self-minted token.
#   OPENRAILS_TEST_SOLANA_PRIVATE_KEY — base58 key for the documented
#                                  money-movement proof wallet.
#
# Locally these live in `.env.devnet` (gitignored); in CI they come from the
# secrets above.

on:
  schedule:
    # 07:00 UTC daily — the fast USDC service-layer test only (~8 min budget).
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      run_multirebill:
        description: 'Also run the multi-HOUR multi-rebill test (TestDevnetSustainedRebill, ~3h). Off by default — too slow/expensive for the daily run.'
        type: boolean
        default: false
      run_extended:
        description: 'Run the four extended devnet lifecycle, tier-change, multi-subscription and failure-path proofs (~3h).'
        type: boolean
        default: false
      run_money_movement_proof:
        description: 'Run the integration-harness Solana money-movement data-boundary proof.'
        type: boolean
        default: false

# Run the JavaScript-based actions (checkout, setup-go, cache) on Node.js 24.
# Those actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast (~8 min) real-USDC publish -> subscribe -> crank -> cancel against the
  # production service layer. This is the one that runs on the daily schedule.
  devnet-service-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Devnet USDC service-layer test
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_DEVNET_PAYER_KEY: ${{ secrets.SOLANA_DEVNET_PAYER_KEY }}
          SOLANA_DEVNET_SUBSCRIBER_KEY: ${{ secrets.SOLANA_DEVNET_SUBSCRIBER_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ] || [ -z "${SOLANA_DEVNET_PAYER_KEY}" ] || [ -z "${SOLANA_DEVNET_SUBSCRIBER_KEY}" ]; then
            echo "HELIUS_API_KEY, SOLANA_DEVNET_PAYER_KEY and SOLANA_DEVNET_SUBSCRIBER_KEY secrets are required" >&2
            exit 1
          fi
          go test -tags devnet -run 'TestDevnetLifecycle/FastPlan' -v -timeout 480s ./internal/modules/solana/recurring/...

  # Multi-HOUR (~3h) real recurring rebill: publishes period_hours=1, subscribes,
  # pulls, WAITS for the on-chain period to roll over (~1h), pulls a SECOND time.
  # Gated behind workflow_dispatch ONLY (the `run_multirebill` input) — far too
  # slow and USDC-expensive to run daily. Trigger it by hand when you want a real
  # rebill proof.
  devnet-multirebill:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_multirebill }}
    # ~1h idle between pulls + RPC retries; give the whole job 3.5h so the test's
    # own 3h timeout is the limiting factor, not the runner.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Devnet multi-rebill test (multi-hour)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_DEVNET_PAYER_KEY: ${{ secrets.SOLANA_DEVNET_PAYER_KEY }}
          SOLANA_DEVNET_SUBSCRIBER_KEY: ${{ secrets.SOLANA_DEVNET_SUBSCRIBER_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ] || [ -z "${SOLANA_DEVNET_PAYER_KEY}" ] || [ -z "${SOLANA_DEVNET_SUBSCRIBER_KEY}" ]; then
            echo "HELIUS_API_KEY, SOLANA_DEVNET_PAYER_KEY and SOLANA_DEVNET_SUBSCRIBER_KEY secrets are required" >&2
            exit 1
          fi
          go test -tags devnet -run TestDevnetSustainedRebill -v -timeout 3h ./internal/modules/solana/recurring/...

  # Extended real-chain coverage. Kept dispatch-only because the cancellation
  # proof waits for an hourly period rollover and the suite consumes devnet
  # USDC. Each formerly dormant test is named explicitly so filter drift cannot
  # turn this into a green-but-empty job.
  devnet-extended:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extended }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Extended devnet proofs
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          SOLANA_DEVNET_PAYER_KEY: ${{ secrets.SOLANA_DEVNET_PAYER_KEY }}
          SOLANA_DEVNET_SUBSCRIBER_KEY: ${{ secrets.SOLANA_DEVNET_SUBSCRIBER_KEY }}
        run: |
          if [ -z "${HELIUS_API_KEY}" ] || [ -z "${SOLANA_DEVNET_PAYER_KEY}" ] || [ -z "${SOLANA_DEVNET_SUBSCRIBER_KEY}" ]; then
            echo "HELIUS_API_KEY, SOLANA_DEVNET_PAYER_KEY and SOLANA_DEVNET_SUBSCRIBER_KEY secrets are required" >&2
            exit 1
          fi
          go test -tags devnet -run '^TestDevnetMultiSub$' -v -timeout 30m ./internal/modules/solana/recurring/...
          go test -tags devnet -run '^TestDevnetTierChange$' -v -timeout 20m ./internal/modules/solana/recurring/...
          go test -tags devnet -run '^TestDevnetFailurePaths$' -v -timeout 20m ./internal/modules/solana/recurring/...
          go test -tags devnet -run '^TestDevnetLifecycle$/^CancelStopsAtPeriodEnd$' -v -timeout 130m ./internal/modules/solana/recurring/...

  # This proof is DB-backed and separately keyed from the recurring-devnet
  # fixtures. Dispatching it now supplies and enforces the gate that previously
  # existed only inside the test and therefore skipped in every workflow.
  solana-money-movement-proof:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_money_movement_proof }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Solana money-movement proof
        env:
          OPENRAILS_TEST_SOLANA_PRIVATE_KEY: ${{ secrets.OPENRAILS_TEST_SOLANA_PRIVATE_KEY }}
        run: |
          if [ -z "${OPENRAILS_TEST_SOLANA_PRIVATE_KEY}" ]; then
            echo "::error::OPENRAILS_TEST_SOLANA_PRIVATE_KEY not set — refusing a green-but-empty money-movement proof"
            exit 1
          fi
          bash scripts/test_integration.sh -run '^TestSolanaDevnetMoneyMovementProof$' -v ./internal/integrationharness/
