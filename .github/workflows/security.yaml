name: Security Scan

# #855 triggers: PRs to master (fast, path-filtered), nightly, and manual. A
# merge commit is the same tree already scanned by its PR, so it is not scanned
# a second time.
on:
  pull_request:
    branches: [ master ]
  schedule:
    # 05:00 UTC nightly.
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # PR diff classification. Go scanners' steps no-op on docs-only PRs; on
  # non-PR events everything runs unconditionally.
  #
  # Named security-changes, not `changes`: ci.yaml has a job by that name too,
  # and a required status check is matched by NAME — two jobs sharing one makes
  # the ruleset ambiguous about which workflow it is actually requiring.
  security-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')"
          go=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*|*.md|.trivyignore|LICENSE*|.gitignore|web/admin/*) ;;
              *) go=true ;;
            esac
          done <<< "$files"
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "go=$go"

  # gosec: complete Go SAST scan, failing on HIGH+ findings. One job takes
  # roughly three minutes. Three shards saved wall-clock but repeated package
  # loading, cache setup, and module downloads; the complete package set still
  # fits comfortably inside the six-minute PR budget as one scan.
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.security-changes.outputs.go == 'true'
      # gosec loads packages with full type information, so it pays the same
      # dependency-compile bill the Go jobs do and wants the same warm cache.
      # See .github/actions/go-env for why explicit cache steps are back and why
      # that does not reintroduce the "tar: File exists" collision.
      - uses: ./.github/actions/go-env
        if: needs.security-changes.outputs.go == 'true'
        with:
          variant: gosec
      - name: Download modules
        if: needs.security-changes.outputs.go == 'true'
        run: |
          for attempt in 1 2 3; do
            go mod download && exit 0
            [ "$attempt" -lt 3 ] || exit 1
            sleep "$((attempt * 2))"
          done
      # or#855: was `go install …@latest` — 47s of compiling a binary upstream
      # ships, and a floating version with no integrity check. Pinned +
      # checksum-verified download is ~4s. Pinning freezes the rule set on
      # purpose (same doctrine as the golangci-lint and sqlc pins): bump the
      # version in scripts/ci-install-tool.sh deliberately, reading the notes.
      - name: Install pinned gosec
        if: needs.security-changes.outputs.go == 'true'
        run: echo "GOSEC_BIN=$(scripts/ci-install-tool.sh gosec)" >> "$GITHUB_ENV"
      - name: Run gosec (fail on HIGH+)
        if: needs.security-changes.outputs.go == 'true'
        run: "$GOSEC_BIN -severity high -confidence medium -exclude-dir=.agents ./..."
      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  # govulncheck: dependency vulnerability scanning against the Go vuln DB.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.security-changes.outputs.go == 'true'
      - uses: ./.github/actions/go-env
        if: needs.security-changes.outputs.go == 'true'
        with:
          variant: govulncheck
      - name: Download modules
        if: needs.security-changes.outputs.go == 'true'
        run: go mod download
      # Pinned, but no prebuilt release exists and the install is only ~5s.
      # Unlike gosec, pinning does NOT freeze what this detects: govulncheck
      # fetches the vulnerability DB at run time.
      - name: Install govulncheck
        if: needs.security-changes.outputs.go == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        if: needs.security-changes.outputs.go == 'true'
        run: govulncheck ./...

  # Trivy: additional SCA + filesystem vulnerability/secret scanning. Fails on
  # HIGH/CRITICAL findings. Cheap — always runs, no path gating.
      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

  # Blocks the repo-injection worm that appended an obfuscated dropper to
  # build-config files on infected contributor machines (2025-11 .. 2026-05).
  # OpenRails was never hit, but it is the billing engine and shares
  # contributors with the repos that were. See docs/injection-scan.md.
  #
  # Lives here, not in ci.yaml: this file already triggers on push as well as
  # pull_request, and the worm arrives inside someone else's ordinary commit, so
  # push coverage is the point. Cheap and language-agnostic, so it is not gated
  # on security-changes — a docs-only PR can carry the payload too.
  injection-scan:
    name: Injected Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Whole tree on PRs too, not just the diff: a diff-only scan would happily
      # pass a payload that already landed on the branch.
      - name: Scan tracked files
        run: ./scripts/scan-injected-code.sh --all
      # Proves the detector still fires: the fixtures under
      # scripts/testdata/injection-scan/ must trip the rules they belong to.
      - name: Detector self-test
        run: ./scripts/scan-injected-code.sh --self-test

  required-security:
    name: Required Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [security-changes, gosec, govulncheck, trivy, injection-scan]
    if: always()
    steps:
      - name: Require every security job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
