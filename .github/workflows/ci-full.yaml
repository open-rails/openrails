name: Validate Full

# The pull-request workflow is the merge gate. This scheduled/manual run keeps
# one complete tree-level backstop for drift on master and exercises the same
# commands locally and in CI. It is intentionally one serial job: the E2E
# suite shares one disposable Postgres/Redis stack.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: "2"
  GOFLAGS: -p=1

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd redis-cli --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENRAILS_TEST_DB_DSN: postgres://admin:test_password@127.0.0.1:5432/openrails_test?sslmode=disable
      OPENRAILS_TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - name: Install browser dependencies
        run: |
          pnpm --dir tests/browser install --frozen-lockfile --ignore-scripts
          pnpm --dir tests/browser exec playwright install --with-deps chromium
      - name: Build admin console for browser contracts
        run: bash scripts/build-admin-console.sh web/admin/dist
      - name: Run compact checks
        run: bash scripts/check.sh checks
      - name: Run complete E2E workflow matrix
        run: bash scripts/check.sh e2e
