name: Build Docker Image

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 runs the JavaScript-based actions
# (checkout, docker/login-action, docker/setup-buildx-action) on Node.js 24.
# Those actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  IMAGE: docker.io/openrails/openrails
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require tags to point at main/master history
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            exit 0
          fi
          git fetch origin master:refs/remotes/origin/master --quiet
          git fetch origin main:refs/remotes/origin/main --quiet || true
          if git branch -r --contains "${GITHUB_SHA}" | grep -Eq 'origin/(main|master)$'; then
            exit 0
          fi
          echo "Tagged commit must be reachable from main or master" >&2
          exit 1

  smoke-image:
    name: Smoke test Docker image
    runs-on: ubuntu-latest
    needs: verify-source
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_db
          POSTGRES_USER: smoke_migrator
          POSTGRES_PASSWORD: smoke_migration_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      garnet:
        image: ghcr.io/microsoft/garnet:latest
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build smoke image
        run: docker build -t openrails-smoke:${GITHUB_SHA} .

      - name: Create host runtime login
        run: |
          docker run --rm --network host -e PGPASSWORD=smoke_migration_password postgres:18-alpine \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5434 -U smoke_migrator -d openrails_db \
            -c "CREATE ROLE app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'app_password'"

      - name: Migrate smoke database
        run: |
          docker run --rm --network host \
            -e TEST_MODE=sandbox \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5434 \
            -e DB_DATABASE=openrails_db \
            -e DB_USERNAME=smoke_migrator \
            -e DB_PASSWORD=smoke_migration_password \
            -e DB_SSLMODE=disable \
            -e REDIS_ADDR=127.0.0.1:6380 \
            openrails-smoke:${GITHUB_SHA} migrate pg --runtime-database-url "postgres://app:app_password@127.0.0.1:5434/openrails_db?sslmode=disable"

      - name: Boot server and check readiness
        run: |
          # Readiness requires an OpenRails-managed River consumer; smoke the
          # normal server mode so /health/ready can prove the full image posture.
          cid="$(docker run -d --network host \
            -e TEST_MODE=sandbox \
            -e PORT=3053 \
            -e AUTH_REQUEST_ORIGIN=http://127.0.0.1:3053 \
            -e AUTH_ALLOW_LOOPBACK_HTTP=true \
            -e AUTH_ALLOW_EPHEMERAL_SIGNING_KEY=true \
            -e AUTH_ALLOW_MISSING_SENDERS=true \
            -e AUTH_DIRECT_PEER_IP=true \
            -e AUTHKIT_KEYS_PATH=/tmp/openrails-smoke-keys.json \
            -e AUTH_ISSUER=http://127.0.0.1:3053 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5434 \
            -e DB_DATABASE=openrails_db \
            -e DB_USERNAME=app \
            -e DB_PASSWORD=app_password \
            -e DB_SSLMODE=disable \
            -e REDIS_ADDR=127.0.0.1:6380 \
            openrails-smoke:${GITHUB_SHA} run-server)"
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3053/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  build-x86:
    name: Build x86 image
    runs-on: ubuntu-latest
    needs: smoke-image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require DockerHub token
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_TOKEN (org access token for the openrails Docker Hub org)." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: openrails
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Determine Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Build and push x86 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-x86

  build-arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    needs: smoke-image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require DockerHub token
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_TOKEN (org access token for the openrails Docker Hub org)." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: openrails
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Determine Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Build and push arm64 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-arm64

  create-manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-x86, build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Require DockerHub token
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_TOKEN (org access token for the openrails Docker Hub org)." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: openrails
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-x86 \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-arm64
