name: Build Docker Image

# master and v* tags publish one linux/amd64 + linux/arm64 manifest to
# docker.io/openrails/openrails and ghcr.io/open-rails/openrails. Tags push
# vX.Y.Z, X.Y and latest; master pushes the short SHA and latest. Pull requests
# that change the image build run the amd64 smoke test and the arm64 check and
# push nothing. The Dockerfile cross-compiles on the runner; QEMU runs only the
# arm64 runtime stage.
on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
    # Not in the binary, so the image would not change. Tags ignore path filters.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*_test.go'
      - '**/testdata/**'
  pull_request:
    branches: [ master ]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yaml
  workflow_dispatch:

permissions:
  contents: read

# Bursts of merges publish the newest master once: one run in flight, older
# pending runs superseded, running publishes never cancelled.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 runs the JavaScript-based actions
# (checkout, docker/login-action, docker/setup-buildx-action) on Node.js 24.
# Those actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  IMAGE: docker.io/openrails/openrails
  GHCR_IMAGE: ghcr.io/open-rails/openrails
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      minor: ${{ steps.meta.outputs.minor }}
      version: ${{ steps.meta.outputs.version }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Require tags to point at main/master history
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            exit 0
          fi
          git fetch origin master:refs/remotes/origin/master --quiet
          git fetch origin main:refs/remotes/origin/main --quiet || true
          if git branch -r --contains "${GITHUB_SHA}" | grep -Eq 'origin/(main|master)$'; then
            exit 0
          fi
          echo "Tagged commit must be reachable from main or master" >&2
          exit 1
      - name: Image tags and build identity
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
              echo "minor=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

  smoke-image:
    name: Smoke test Docker image
    runs-on: ubuntu-latest
    needs: verify-source
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_db
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U smoke -d openrails_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      garnet:
        image: ghcr.io/microsoft/garnet:latest
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Seeds the amd64 layer cache that the publish build reuses.
      - name: Build smoke image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: openrails-smoke:${{ github.sha }}
          build-args: |
            VERSION=${{ needs.verify-source.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.verify-source.outputs.date }}
          cache-from: type=gha,scope=openrails-amd64
          cache-to: type=gha,mode=max,scope=openrails-amd64

      - name: Report version
        run: docker run --rm "openrails-smoke:${GITHUB_SHA}" version | tee /dev/stderr | grep -q "commit ${GITHUB_SHA}"

      - name: Migrate smoke database
        run: |
          docker run --rm --network host \
            -e TEST_MODE=sandbox \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5434 \
            -e DB_DATABASE=openrails_db \
            -e DB_USERNAME=smoke \
            -e DB_PASSWORD=smoke_password \
            -e DB_SSLMODE=disable \
            -e REDIS_ADDR=127.0.0.1:6380 \
            "openrails-smoke:${GITHUB_SHA}" migrate pg

      - name: Boot server and check readiness
        run: |
          # Readiness requires an OpenRails-managed River consumer; smoke the
          # normal server mode so /health/ready can prove the full image posture.
          # The server refuses an unset provider write mode; the smoke never
          # writes to a provider. Enabling the console proves it is embedded; the
          # console needs a sign-in method, so the server serves its own.
          cid="$(docker run -d --network host \
            -e TEST_MODE=sandbox \
            -e PROVIDER_WRITE_MODE=readonly \
            -e ADMIN_CONSOLE_ENABLED=true \
            -e LOCAL_SIGN_IN=true \
            -e PORT=3053 \
            -e AUTH_REQUEST_ORIGIN=http://127.0.0.1:3053 \
            -e AUTH_ALLOW_LOOPBACK_HTTP=true \
            -e AUTH_ALLOW_EPHEMERAL_SIGNING_KEY=true \
            -e AUTH_ALLOW_MISSING_SENDERS=true \
            -e AUTH_DIRECT_PEER_IP=true \
            -e AUTHKIT_KEYS_PATH=/tmp/openrails-smoke-keys.json \
            -e AUTH_ISSUER=http://127.0.0.1:3053 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5434 \
            -e DB_DATABASE=openrails_db \
            -e DB_USERNAME=smoke \
            -e DB_PASSWORD=smoke_password \
            -e DB_SSLMODE=disable \
            -e REDIS_ADDR=127.0.0.1:6380 \
            "openrails-smoke:${GITHUB_SHA}" run-server)"
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3053/health/ready; then
              curl -fsS http://127.0.0.1:3053/admin/ | grep -q '<div id="root">'
              exit 0
            fi
            if [[ "$(docker inspect -f '{{.State.Running}}' "$cid")" != true ]]; then
              echo "::error::server exited during boot"
              exit 1
            fi
            sleep 2
          done
          exit 1

  arm64-image:
    name: Check arm64 image
    runs-on: ubuntu-latest
    needs: verify-source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Seeds the arm64 layer cache that the publish build reuses.
      - name: Build arm64 image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: openrails-arm64:${{ github.sha }}
          build-args: |
            VERSION=${{ needs.verify-source.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.verify-source.outputs.date }}
          cache-from: type=gha,scope=openrails-arm64
          cache-to: type=gha,mode=max,scope=openrails-arm64

      - name: Report version
        run: docker run --rm --platform linux/arm64 "openrails-arm64:${GITHUB_SHA}" version | tee /dev/stderr | grep -q "commit ${GITHUB_SHA}"

  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: [verify-source, smoke-image, arm64-image]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write # GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Require DockerHub token
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_TOKEN (org access token for the openrails Docker Hub org)." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: openrails
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only needed when the arm64 cache misses.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Image tags
        id: tags
        env:
          TAG: ${{ needs.verify-source.outputs.tag }}
          MINOR: ${{ needs.verify-source.outputs.minor }}
        run: |
          names=("$TAG" latest)
          if [[ -n "$MINOR" ]]; then
            names+=("$MINOR")
          fi
          {
            echo 'list<<EOF'
            for name in "${names[@]}"; do
              echo "${IMAGE}:${name}"
              echo "${GHCR_IMAGE}:${name}"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Rebuilds from the smoke and arm64 caches, so it pushes what they tested.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ needs.verify-source.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ needs.verify-source.outputs.date }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify-source.outputs.tag }}
          cache-from: |
            type=gha,scope=openrails-amd64
            type=gha,scope=openrails-arm64
