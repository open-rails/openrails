name: Build Docker Image

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 runs the JavaScript-based actions
# (checkout, docker/login-action, docker/setup-buildx-action) on Node.js 24.
# Those actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  IMAGE: docker.io/openrails/openrails
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tags to point at main/master history
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            exit 0
          fi
          git fetch origin master:refs/remotes/origin/master --quiet
          git fetch origin main:refs/remotes/origin/main --quiet || true
          if git branch -r --contains "${GITHUB_SHA}" | grep -Eq 'origin/(main|master)$'; then
            exit 0
          fi
          echo "Tagged commit must be reachable from main or master" >&2
          exit 1

  smoke-image:
    name: Smoke test Docker image
    runs-on: ubuntu-latest
    needs: verify-source
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      garnet:
        image: ghcr.io/microsoft/garnet:latest
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v4

      - name: Build smoke image
        run: docker build -t openrails-smoke:${GITHUB_SHA} .

      - name: Migrate smoke database
        run: |
          docker run --rm --network host \
            -e ENV=development \
            -e TEST_MODE=sandbox \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5434 \
            -e DB_DATABASE=openrails_db \
            -e DB_USERNAME=admin \
            -e DB_PASSWORD=admin_password \
            -e DB_SSLMODE=disable \
            -e REDIS_ADDR=127.0.0.1:6380 \
            openrails-smoke:${GITHUB_SHA} migrate pg

      # The baseline migration creates openrails_app NOLOGIN; a real deployment
      # attaches the login credential out of band. The smoke boot below runs as
      # that role — NOT as the superuser — so this smoke test actually exercises
      # the RLS posture the server refuses to boot without (or#782).
      - name: Attach a login credential to the unprivileged app role
        run: |
          docker run --rm --network host -e PGPASSWORD=admin_password postgres:18-alpine \
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5434 -U admin -d openrails_db \
            -c "ALTER ROLE openrails_app WITH LOGIN PASSWORD 'openrails_app_password'"

      - name: Boot server and check readiness
        run: |
          cid="$(docker run -d --network host \
            -e ENV=development \
            -e TEST_MODE=sandbox \
            -e PORT=3053 \
            -e API_URL=http://127.0.0.1:3053 \
            -e AUTH_ISSUER=http://127.0.0.1:3053 \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5434 \
            -e DB_DATABASE=openrails_db \
            -e DB_USERNAME=openrails_app \
            -e DB_PASSWORD=openrails_app_password \
            -e DB_SSLMODE=disable \
            -e REDIS_ADDR=127.0.0.1:6380 \
            openrails-smoke:${GITHUB_SHA} server --no-workers)"
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3053/health/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  build-x86:
    name: Build x86 image
    runs-on: ubuntu-latest
    needs: smoke-image
    steps:
      - uses: actions/checkout@v4

      - name: Require DockerHub secrets
        run: |
          DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER || 'openrails' }}"
          DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}"
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing Docker Hub username secret. Set DOCKERHUB_USERNAME (preferred) or DOCKERHUB_USER." >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub token secret. Set DOCKERHUB_TOKEN (preferred) or DOCKERHUB_PASSWORD." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER || 'openrails' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Build and push x86 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-x86

  build-arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    needs: smoke-image
    steps:
      - uses: actions/checkout@v4

      - name: Require DockerHub secrets
        run: |
          DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER || 'openrails' }}"
          DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}"
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing Docker Hub username secret. Set DOCKERHUB_USERNAME (preferred) or DOCKERHUB_USER." >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub token secret. Set DOCKERHUB_TOKEN (preferred) or DOCKERHUB_PASSWORD." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER || 'openrails' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Build and push arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-arm64

  create-manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-x86, build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Require DockerHub secrets
        run: |
          DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER || 'openrails' }}"
          DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}"
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Missing Docker Hub username secret. Set DOCKERHUB_USERNAME (preferred) or DOCKERHUB_USER." >&2
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Missing Docker Hub token secret. Set DOCKERHUB_TOKEN (preferred) or DOCKERHUB_PASSWORD." >&2
            exit 1
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER || 'openrails' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Determine Docker tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-x86 \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}-arm64
