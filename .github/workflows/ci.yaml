name: Validate

on:
  pull_request:
    branches: [master]
  # Master validates every merge and saves the build caches pull requests
  # restore; caches saved by one pull request are invisible to the others.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: "2"
  GOFLAGS: -p=4

# Go caches (.github/actions/go-cache): master saves each revision built from
# empty; pull requests restore it.

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: race
      - run: bash scripts/check.sh go
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: race
          save: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      # The plain build of every package, which also warms the lint's loads.
      - run: bash scripts/check.sh build
      - name: Read pinned lint version
        id: tool_versions
        shell: bash
        run: echo "golangci_lint=$(awk -F= '$1 == "GOLANGCI_LINT_VERSION" { print $2 }' tools/versions.conf)" >> "$GITHUB_OUTPUT"
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          args: --timeout=15m
      - name: GolangCI-Lint (server module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          working-directory: server
          args: --timeout=15m --config ../.golangci.yaml
      - name: GolangCI-Lint (examples module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          working-directory: examples
          args: --timeout=15m --config ../.golangci.yaml
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: plain
          save: "true"

  console:
    name: Admin console
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - run: bash scripts/check.sh console

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: HELM="$(scripts/ci-install-tool.sh helm)" bash scripts/check.sh chart

  # The required check: every part above must pass. A skipped, cancelled or
  # failed part never turns into a successful aggregate.
  checks:
    name: Checks
    needs: [go-test, lint, console, chart]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every part to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done

  sql:
    name: SQL bindings and query audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Docker Hub rate-limits anonymous pulls; scripts/ci-pull-image.sh pulls
      # from its mirrors with retries.
      - name: Start PostgreSQL
        run: |
          image="$(scripts/ci-pull-image.sh postgres:18-alpine)"
          docker run -d --pull never --name e2e-postgres -p 5432:5432 \
            --tmpfs /var/lib/postgresql:rw,size=2g \
            -e POSTGRES_DB=openrails_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            "$image"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for PostgreSQL
        run: timeout 60 bash -c 'until docker exec e2e-postgres pg_isready -h 127.0.0.1 -U postgres -d openrails_test; do sleep 1; done'
      - name: Generated SQL bindings match the queries
        env:
          SQLC_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable
        run: |
          sqlc_bin="$(scripts/ci-install-tool.sh sqlc)"
          export SQLC_DATABASE_URL="$(scripts/sqlc-vet-db.sh)"
          echo "SQLC_DATABASE_URL=$SQLC_DATABASE_URL" >> "$GITHUB_ENV"
          "$sqlc_bin" generate
          git diff --exit-code -- internal/db/gen
      # setup-go's cache is keyed on go.sum alone and never re-saved, so it
      # would recompile pg_query_go's C parser on every run.
      - name: Restore query audit build cache
        id: sqlaudit-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlaudit-gocache
          key: sqlaudit-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'internal/db/sqlaudit/*.go') }}
          restore-keys: |
            sqlaudit-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
      - name: Query audit (EXPLAIN every sqlc query)
        env:
          CGO_ENABLED: "1"
          GOCACHE: ${{ runner.temp }}/sqlaudit-gocache
        run: bash scripts/go-test-gate.sh ./internal/db/sqlaudit/ TestQueryAudit
      - name: Save query audit build cache
        if: ${{ !cancelled() && steps.sqlaudit-cache.outcome == 'success' && steps.sqlaudit-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sqlaudit-gocache
          key: ${{ steps.sqlaudit-cache.outputs.cache-primary-key }}

  e2e-shards:
    name: End-to-end worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    # scripts/e2e.sh splits the suite across the workers by recorded test
    # durations; every worker computes the same split, so no test is skipped
    # or duplicated.
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5]
    timeout-minutes: 20
    env:
      OPENRAILS_E2E_DSN: postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable
      OPENRAILS_E2E_REDIS_ADDR: 127.0.0.1:6379
      OPENRAILS_E2E_VAULT_ADDR: http://127.0.0.1:8200
      OPENRAILS_E2E_VAULT_TOKEN: e2e-root
      OPENRAILS_E2E_WORKERS: ${{ strategy.job-total }}
      OPENRAILS_E2E_WORKER: ${{ strategy.job-index }}
      OPENRAILS_E2E_JOBS: "6"
      OPENRAILS_E2E_TIMEOUT: 15m
      OPENRAILS_E2E_TIMINGS: ${{ github.workspace }}/e2e-timings.tsv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A step rather than a service: the multi-replica fleets (#1075) need
      # more than the default 100 connections, a server flag services cannot set.
      - name: Start PostgreSQL
        run: |
          image="$(scripts/ci-pull-image.sh postgres:18-alpine)"
          docker run -d --pull never --name e2e-postgres -p 5432:5432 \
            --tmpfs /var/lib/postgresql:rw,size=2g \
            -e POSTGRES_DB=openrails_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            "$image" -c max_connections=500
      - name: Start Redis
        run: |
          image="$(scripts/ci-pull-image.sh redis:7-alpine)"
          docker run -d --pull never --name e2e-redis -p 6379:6379 "$image"
          # A second one takes only TLS and an ACL user.
          url="$(scripts/e2e-redis-tls.sh "$RUNNER_TEMP/redis-tls" 6380 "$image")"
          echo "OPENRAILS_E2E_REDIS_TLS_URL=$url" >>"$GITHUB_ENV"
          echo "OPENRAILS_E2E_REDIS_TLS_CA=$RUNNER_TEMP/redis-tls/ca.pem" >>"$GITHUB_ENV"
      # A dev server: in memory, unsealed, OPENRAILS_E2E_VAULT_TOKEN its root
      # token. Each test mounts its own KV v2 engine (internal/vaulttest).
      - name: Start Vault
        run: |
          image="$(scripts/ci-pull-image.sh hashicorp/vault:2.1.1)"
          docker run -d --pull never --name e2e-vault -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID="$OPENRAILS_E2E_VAULT_TOKEN" "$image"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: e2e
      - name: Wait for PostgreSQL
        run: timeout 60 bash -c 'until docker exec e2e-postgres pg_isready -h 127.0.0.1 -U postgres -d openrails_test; do sleep 1; done'
      - name: Wait for Vault
        run: timeout 60 bash -c 'until curl -fsS "$OPENRAILS_E2E_VAULT_ADDR/v1/sys/health" >/dev/null; do sleep 1; done'
      - name: Run focused e2e contracts
        run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-timings-${{ matrix.worker }}
          path: e2e-timings.tsv
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() && strategy.job-index == 0 }}
        with:
          family: e2e
          save: "true"

  # The required check: every worker and the SQL gates must pass. A skipped,
  # cancelled or failed child never turns into a successful aggregate.
  e2e:
    name: End-to-end
    needs: [e2e-shards, sql]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every part to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          test -n "$RESULTS"
          for result in $RESULTS; do test "$result" = success; done

  security:
    name: Required Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: security
      - name: Scan the complete tracked tree
        run: |
          bash scripts/scan-injected-code.sh --all
          bash scripts/scan-injected-code.sh --self-test
      # The root module's ./... excludes server/ and examples/, each its own module.
      - name: Go SAST
        run: |
          gosec_bin="$(scripts/ci-install-tool.sh gosec)"
          for module in . server examples; do
            (cd "$module" && "$gosec_bin" -severity high -confidence medium -exclude-dir=.agents ./...)
          done
      - name: Go vulnerability analysis
        run: |
          for module in . server examples; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          done
      - name: Filesystem and dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: security
          save: "true"
