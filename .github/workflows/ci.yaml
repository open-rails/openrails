name: Validate Code

# FAST pipeline (#855): PRs targeting master. Ordinary
# branch pushes run nothing by design — open a PR. Weekly and manual runs go
# through ci-full.yaml (complete integration suite).
on:
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# Run the JavaScript-based actions (checkout, setup-go) on Node.js 24. Those
# actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Stable aggregate statuses are the repository's required merge gates.
# Conditional SQL/console jobs may skip only when classification excludes them.
jobs:
  # Classifies the PR diff. The aggregate also requires classification success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      console: ${{ steps.classify.outputs.console }}
      sql: ${{ steps.classify.outputs.sql }}
      broad: ${{ steps.classify.outputs.broad }}
      integration_shards: ${{ steps.classify.outputs.integration_shards }}
      integration_matrix: ${{ steps.classify.outputs.integration_matrix }}
      files: ${{ steps.classify.outputs.files }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')"
          go=false; console=false; sql=false; broad=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Docs and metadata: affect no job.
              docs/*|*.md|.trivyignore|LICENSE*|.gitignore) ;;
              # Toolchain / module surface: all Go and integration checks.
              go.mod|go.sum|docker-compose*|Dockerfile*) go=true; broad=true ;;
              # SQL/schema changes uniquely require the database-backed sqlc gate.
              sqlc.yaml|migrations/*|internal/db/*|scripts/sqlc-*|scripts/sql-lint.sh|scripts/migration-lint.sh) go=true; sql=true; broad=true ;;
              # Shared production surfaces have unbounded integration impact.
              internal/integrationharness/*|internal/shared/*|config/*) go=true; broad=true ;;
              # Admin console SPA and its embed/build plumbing.
              web/admin/*|cmd/openrails/consoleassets/*|scripts/build-admin-console.sh) console=true ;;
              # Changes to the PR test harness itself must exercise the full
              # integration package set.
              scripts/test_integration.sh|scripts/ci-integration-select.sh|scripts/ci-shard.sh|.github/workflows/ci.yaml|.github/actions/*) go=true; broad=true ;;
              # Test helpers/tooling compile in the normal Go gate; directly
              # touched integration packages are selected below. The weekly
              # complete suite remains the cross-package backstop.
              internal/dbtest/*|Taskfile.yaml|scripts/*|.github/*) go=true ;;
              *) go=true ;;
            esac
          done <<< "$files"
          integration_shards=1
          integration_matrix='[1]'
          if [ "$broad" = true ]; then
            integration_shards=2
            integration_matrix='[1,2]'
          fi
          {
            echo "go=$go"
            echo "console=$console"
            echo "sql=$sql"
            echo "broad=$broad"
            echo "integration_shards=$integration_shards"
            echo "integration_matrix=$integration_matrix"
            echo 'files<<CHANGED_FILES_EOF'
            echo "$files"
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "go=$go console=$console sql=$sql broad=$broad integration_shards=$integration_shards"

  # Compile-and-analyse gates. `go test -race` used to live here too and made
  # this a 272s job; it is now the separate `unit` job, because the two share
  # nothing — a race build recompiles the whole graph with different action ids,
  # so running them in sequence bought no cache reuse, only wall clock.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.go == 'true'
      - uses: ./.github/actions/go-env
        if: needs.changes.outputs.go == 'true'
        with:
          variant: vet
      - name: Source guardrails
        if: needs.changes.outputs.go == 'true'
        run: |
          bash scripts/check_business_time_test.sh
          bash scripts/check_business_time.sh
          bash scripts/sql-lint.sh
      - name: Download modules
        if: needs.changes.outputs.go == 'true'
        run: go mod download
      - name: Vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...
      - name: Build
        if: needs.changes.outputs.go == 'true'
        run: go build ./...
      - name: Vet (integration tag)
        # Compile guard for integration-tagged packages: dep bumps (authkit
        # v0.78.0, v0.80.0) broke them silently twice because default builds
        # never compile these files.
        if: needs.changes.outputs.go == 'true'
        run: go vet -tags integration ./...
      - name: Build examples
        # Each example is its own module (replace => ../..), invisible to the
        # root ./... patterns — build them explicitly so engine changes that
        # break an example fail the same PR.
        #
        # The `if:` is a fix, not a speedup: without it this step ran on
        # docs-only PRs, where checkout is skipped, so `examples/*/` matched
        # nothing, `cd examples/*/` failed and the whole gate went red.
        if: needs.changes.outputs.go == 'true'
        run: |
          for d in examples/*/; do
            (cd "$d" && go build ./... && go vet ./...)
          done

      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  # One race-enabled unit job. Three shards reduced wall-clock by roughly one
  # minute, but repeated runner/cache setup raised the measured total from one
  # ~3 minute suite to 5m27s. The complete ./... suite still runs on every Go
  # PR; this changes scheduling, not coverage or flags.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.go == 'true'
      - uses: ./.github/actions/go-env
        if: needs.changes.outputs.go == 'true'
        with:
          variant: race
      - name: Download modules
        if: needs.changes.outputs.go == 'true'
        run: go mod download
      - name: Test (race)
        if: needs.changes.outputs.go == 'true'
        run: go test -count=1 -race ./...
      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  # or#869: .golangci.yaml existed for a year with nothing running it — and could
  # not have run (v1 schema, which current golangci-lint refuses to load). The
  # enabled rule set is exactly what passes today; deferred linters are recorded
  # in the config header with counts. This job is REQUIRED, not advisory: an
  # advisory gate is the same claim of coverage the file used to make.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.go == 'true'
      # go-env, not setup-go's own cache: since or#855 nothing writes the shared
      # `setup-go-…` key any more, so `cache: true` here would miss every time.
      # `lint` is its own variant because golangci-lint type-checks with its own
      # build configuration. The action's separate golangci analysis cache is
      # untouched — it does not restore GOCACHE (Go caching was dropped from the
      # action in v6), so there is still exactly one restore per path.
      - uses: ./.github/actions/go-env
        if: needs.changes.outputs.go == 'true'
        with:
          variant: lint
      # PIN BUMPED FROM v2.6.0 (or#855). v2.6.0 is built with go1.25 and this
      # module targets go1.26.6, so golangci-lint refused to load the config at
      # all — "the Go language version (go1.25) used to build golangci-lint is
      # lower than the targeted Go version (1.26.5)", exit 3, every run. The
      # gate was structurally incapable of passing: required in name, enforcing
      # nothing. Its first real execution was on this PR, because ci.yaml runs
      # only on PRs and the job arrived via a merge to dev.
      #
      # v2.11.4 is the smallest bump that loads, and it is green with 0 issues
      # on the current tree, so what the gate MEANS is unchanged. v2.12.2 was
      # also tried: it loads too, but its newer govet `inline` analyzer adds 3
      # findings (reflect.Ptr -> reflect.Pointer in
      # internal/http/request/request.go). Those are real and want fixing, but
      # they are source changes, so they belong to whoever takes the next bump —
      # recorded here rather than silenced with an exclusion.
      - name: golangci-lint
        if: needs.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4
          args: --timeout=15m
      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  sqlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.sql == 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.go == 'true'
      - uses: ./.github/actions/go-env
        if: needs.changes.outputs.go == 'true'
        with:
          variant: sqlc
      # or#855: `go install task@latest` + `go run sqlc@…` compiled both tools
      # from source on every run — measured 52s and ~60s respectively, i.e.
      # ~110s of a 137s job spent installing tools upstream already ships as
      # binaries. Pinned + checksum-verified downloads take ~5s, and `@latest`
      # pinned nothing to begin with.
      - name: Install pinned tools (task, sqlc)
        if: needs.changes.outputs.go == 'true'
        run: |
          echo "TASK_BIN=$(scripts/ci-install-tool.sh task)" >> "$GITHUB_ENV"
          echo "SQLC_BIN=$(scripts/ci-install-tool.sh sqlc)" >> "$GITHUB_ENV"
      # task sqlc-check builds a throwaway vet DB from migrations/ via
      # scripts/sqlc-vet-db.sh (defaults target the service container above),
      # regenerates internal/db/gen, PREPAREs every query (sqlc vet), fails if
      # the committed generated code is stale, then runs the efficiency+safety
      # audit (or#838): EXPLAIN GENERIC_PLAN of every query as openrails_app
      # under RLS, plus the raw-SQL and migration lock-safety lints.
      - name: sqlc generate + vet + diff + audit
        if: needs.changes.outputs.go == 'true'
        env:
          POSTGRES_HOST_PORT: "5434"
        run: "$TASK_BIN sqlc-check"

      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  # Admin console SPA (#754: dist is NOT committed, so nothing else compiles
  # web/admin) — lint + typecheck+build the frontend, then prove the tagged Go
  # binary embeds the produced dist. Steps run only when web/admin/** (or a
  # shared surface) changed.

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.console == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.console == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        if: needs.changes.outputs.console == 'true'
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.console == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - uses: ./.github/actions/go-env
        if: needs.changes.outputs.console == 'true'
        with:
          variant: console
      - name: Build console (pnpm install + tsc + vite)
        if: needs.changes.outputs.console == 'true'
        run: bash scripts/build-admin-console.sh cmd/openrails/consoleassets/dist
      - name: Lint console
        if: needs.changes.outputs.console == 'true'
        run: pnpm run lint
        working-directory: web/admin
      - name: Test console
        if: needs.changes.outputs.console == 'true'
        run: pnpm run test
        working-directory: web/admin
      # This gate's claim is "the tagged binary embeds the dist that was just
      # built" — assets_embed.go's //go:embed fails to compile without it. It
      # used to be spelled `go vet -tags console_assets ./...`, 68s, because a
      # build tag changes the action id of EVERY package in the tree, so the
      # whole repo plus every test package was recompiled and re-analysed to
      # prove one embed. Only ONE package has console_assets-conditional source
      # (guarded below), and every other package compiles identically to the
      # untagged build the `build` job already vets. So: build the binary that
      # makes the claim, and vet the one package that actually differs.
      - name: Tagged Go build embeds the dist
        if: needs.changes.outputs.console == 'true'
        run: |
          test -n "$(ls -A cmd/openrails/consoleassets/dist 2>/dev/null)" || {
            echo "console: dist/ is empty — the embed gate would prove nothing" >&2
            exit 1
          }
          go build -tags console_assets ./cmd/openrails/
          go vet -tags console_assets ./cmd/openrails/consoleassets/
      - name: Guard — console_assets stays in one package
        # Narrowing the step above is only coverage-neutral while
        # cmd/openrails/consoleassets is the sole package with tag-conditional
        # source. The day that stops being true, this fails and says so.
        if: needs.changes.outputs.console == 'true'
        run: |
          stray="$(grep -rlE '^//go:build .*console_assets' --include='*.go' . |
                   grep -v '^\./cmd/openrails/consoleassets/' || true)"
          if [ -n "$stray" ]; then
            echo "console_assets-conditional source outside cmd/openrails/consoleassets:" >&2
            echo "$stray" >&2
            echo "widen the tagged build above to cover it, then update this guard" >&2
            exit 1
          fi

      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  # PR tier (#855): integration tests SCOPED to the tagged packages the diff
  # touches. Cross-package fallout is deliberately deferred to integration-full
  # (weekly + manual, complete suite). Broad/shared-surface diffs (go.mod,
  # migrations/, internal/db/, go.mod, compose files, ...) still run the full
  # tagged suite here.
  #
  # Narrow PRs use one runner; broad/shared-surface PRs use two to keep the
  # measured full tier below roughly five minutes. The former avoids duplicate
  # setup for a small selected set, while the latter avoids the 8m serial full
  # suite. Coverage is unchanged: every selected package appears exactly once.

  integration-shard:
    name: integration shard ${{ matrix.shard }}/${{ needs.changes.outputs.integration_shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.integration_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.go == 'true'
      - uses: ./.github/actions/go-env
        if: needs.changes.outputs.go == 'true'
        with:
          variant: integration
      - name: Download modules
        if: needs.changes.outputs.go == 'true'
        run: go mod download
      - name: Integration test
        if: needs.changes.outputs.go == 'true'
        env:
          CHANGED_FILES: ${{ needs.changes.outputs.files }}
          BROAD: ${{ needs.changes.outputs.broad }}
          SHARDS: ${{ needs.changes.outputs.integration_shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t pkgs < <(bash scripts/ci-integration-select.sh)
          if [ "${#pkgs[@]}" -eq 0 ]; then
            echo "nothing for this shard"
            exit 0
          fi
          echo "shard ${SHARD}/${SHARDS}: ${pkgs[*]}"
          # A balanced two-way shard is ~4m of test work; 6m still distinguishes
          # a slow shard from the known package hangs this timeout is meant to
          # stop.
          OPENRAILS_INTEGRATION_TIMEOUT=6m bash scripts/test_integration.sh "${pkgs[@]}"

      - name: Save Go caches
        if: always() && env.GO_BUILDCACHE_KEY != ''
        uses: ./.github/actions/go-cache-save

  # One stable name for branch protection to require, so changing the shard
  # count never means editing the ruleset. `always()` + an explicit result check
  # is load-bearing: without it a cancelled or skipped shard would let this pass.

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: integration-shard
    if: always()
    steps:
      - name: All integration shards succeeded
        run: |
          result="${{ needs.integration-shard.result }}"
          echo "integration-shard matrix result: $result"
          [ "$result" = "success" ] || exit 1

  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, build, unit, lint, sqlc, console, integration]
    if: always()
    steps:
      - name: Require every applicable validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            . as $jobs |
            (["changes", "build", "unit", "lint", "integration"] |
              all(.[]; $jobs[.].result == "success")) and
            (["sql", "console"] | all(.[];
              . as $area |
              (if $area == "sql" then "sqlc" else "console" end) as $job |
              ($jobs.changes.outputs[$area] == "true" and $jobs[$job].result == "success") or
              ($jobs.changes.outputs[$area] == "false" and $jobs[$job].result == "skipped")))
          ' <<< "$RESULTS"
