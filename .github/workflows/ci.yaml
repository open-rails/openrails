name: Validate Code

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN secret is required for private module access" >&2
            exit 1
          fi
          go env -w GOPRIVATE=github.com/doujins-org/*
          go env -w GONOSUMDB=github.com/doujins-org/*
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          go mod download
          git config --global --unset-all url."https://${GH_TOKEN}@github.com/".insteadOf || true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    # Advisory while the long-dormant integration suite is being revived: this
    # suite never ran in CI, so it accumulated bit-rot (stale call signatures,
    # a hand-rolled profiles schema that drifted from the authkit migrations).
    # continue-on-error surfaces real pass/fail in the logs without blocking
    # merges. Flip to a required check once the suite is fully green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN secret is required for private module access" >&2
            exit 1
          fi
          go env -w GOPRIVATE=github.com/doujins-org/*
          go env -w GONOSUMDB=github.com/doujins-org/*
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          go mod download
          git config --global --unset-all url."https://${GH_TOKEN}@github.com/".insteadOf || true
      # Integration tests self-provision their infra (Postgres/Redis/ClickHouse)
      # via testcontainers — ubuntu-latest ships with Docker, so no `services:`
      # block is needed. See internal/dbtest and tests/testcontainer_suite.go.
      - name: Integration test
        run: go test -tags=integration -timeout 25m ./...
