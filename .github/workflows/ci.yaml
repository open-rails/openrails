name: Validate Code

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Run the JavaScript-based actions (checkout, setup-go) on Node.js 24. Those
# actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure private module access
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_TOKEN secret is required for private module access" >&2
            exit 1
          fi
          go env -w GOPRIVATE=github.com/doujins-org/*
          go env -w GONOSUMDB=github.com/doujins-org/*
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          go mod download
          git config --global --unset-all url."https://${GH_TOKEN}@github.com/".insteadOf || true
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
        continue-on-error: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  sqlc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
        ports:
          - 25432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      # task sqlc builds a throwaway vet DB from migrations/ via
      # scripts/sqlc-vet-db.sh (defaults target the service container above),
      # regenerates internal/db/gen, PREPAREs every query (sqlc vet), and
      # fails if the committed generated code is stale.
      - name: sqlc generate + vet + diff
        run: task sqlc-check

  integration:
    runs-on: ubuntu-latest
    # Advisory while the long-dormant integration suite is being revived: this
    # suite never ran in CI, so it accumulated bit-rot (stale call signatures,
    # a hand-rolled profiles schema that drifted from the authkit migrations).
    # The test step is continue-on-error so failures stay visible in logs without
    # marking the integration job/check as failed. Remove that once fully green.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Download modules
        run: go mod download
      # Integration tests self-provision their infra (Postgres/Redis/ClickHouse)
      # via testcontainers — ubuntu-latest ships with Docker, so no `services:`
      # block is needed. See internal/dbtest and tests/testcontainer_suite.go.
      - name: Integration test
        continue-on-error: true
        run: go test -tags=integration -timeout 25m ./...
