name: Validate

on:
  pull_request:
    branches: [master, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

permissions:
  contents: read

# Closed/draft events cancel the old PR run; master never repeats source tests.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: "2"
  GOFLAGS: -p=4

# Suite selection is deliberately coarse. Shared or unknown inputs fan out.
jobs:
  scope:
    name: Scope
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.scope.outputs.core }}
      runtime: ${{ steps.scope.outputs.runtime }}
      browser: ${{ steps.scope.outputs.browser }}
      chart: ${{ steps.scope.outputs.chart }}
      security: ${{ steps.scope.outputs.security }}
      artifacts: ${{ steps.scope.outputs.artifacts }}
      base_ref: ${{ steps.scope.outputs.base_ref }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the candidate and select suites
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ "$EVENT" == pull_request ]]; then
            [[ "$GITHUB_REF" == refs/pull/*/merge ]]
            [[ "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" == 3 ]]
            test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
            test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
            git check-ref-format "refs/heads/$BASE_REF"
            encoded="$(python3 -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe="/"))' "$BASE_REF")"
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$encoded" --jq .object.sha)"
            test "$current" = "$BASE_SHA" || { echo 'Base moved; update the PR and rerun.' >&2; exit 1; }
            printf 'base_ref=%s\nbase_sha=%s\n' "$BASE_REF" "$BASE_SHA" >> "$GITHUB_OUTPUT"
            python3 scripts/ci-scope.py --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/suites.json"
          else
            python3 scripts/ci-scope.py --full --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/suites.json"
          fi
          cat "$RUNNER_TEMP/suites.json" >> "$GITHUB_STEP_SUMMARY"

  guards:
    name: Source guards
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: python3 scripts/check-ci-policy.py
      - run: bash scripts/check.sh guards
      - run: bash scripts/scan-injected-code.sh --self-test
      - name: Workflow lint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  lint:
    name: Lint
    needs: scope
    if: ${{ needs.scope.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      # The plain build of every package, which also warms the lint's loads.
      - run: bash scripts/check.sh build
      - name: Read pinned lint version
        id: tool_versions
        shell: bash
        run: echo "golangci_lint=$(awk -F= '$1 == "GOLANGCI_LINT_VERSION" { print $2 }' tools/versions.conf)" >> "$GITHUB_OUTPUT"
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          # config verify downloads the JSON schema from golangci-lint.run and times out.
          verify: false
          args: --timeout=15m --build-tags=integration
      - name: GolangCI-Lint (server module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          verify: false
          working-directory: server
          args: --timeout=15m --config ../.golangci.yaml
      - name: GolangCI-Lint (examples module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          verify: false
          working-directory: examples
          args: --timeout=15m --config ../.golangci.yaml
      - name: GolangCI-Lint (AuthKit adapter module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          verify: false
          working-directory: adapters/authkit
          args: --timeout=15m --config ../../.golangci.yaml
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: plain
          save: "true"

  chart:
    name: Helm chart
    needs: scope
    if: ${{ needs.scope.outputs.chart == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: HELM="$(scripts/ci-install-tool.sh helm)" bash scripts/check.sh chart

  sql:
    name: SQL bindings and query audit
    needs: scope
    if: ${{ needs.scope.outputs.runtime == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start PostgreSQL
        run: bash scripts/ci-services.sh start postgres
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - name: PostgreSQL is ready
        run: bash scripts/ci-services.sh ready
      - name: Generated SQL bindings match the queries
        env:
          SQLC_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable
        run: |
          sqlc_bin="$(scripts/ci-install-tool.sh sqlc)"
          export SQLC_DATABASE_URL="$(scripts/sqlc-vet-db.sh)"
          echo "SQLC_DATABASE_URL=$SQLC_DATABASE_URL" >> "$GITHUB_ENV"
          "$sqlc_bin" generate
          "$sqlc_bin" vet
          git diff --exit-code -- internal/db/gen
  critical:
    name: Critical public-interface journeys
    needs: scope
    if: ${{ needs.scope.outputs.runtime == 'true' || needs.scope.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      OPENRAILS_CRITICAL_DSN: postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable
      OPENRAILS_CRITICAL_REDIS_URL: redis://127.0.0.1:6379/0
      OPENRAILS_CRITICAL_VAULT_ADDR: http://127.0.0.1:8200
      OPENRAILS_CRITICAL_VAULT_TOKEN: critical-fixture-only
      OPENRAILS_CRITICAL_PAYMENT_ASSETS: ${{ github.workspace }}/web/pay/dist
    steps:
      - name: Set owned fixture paths
        run: |
          printf 'OPENRAILS_CRITICAL_REPORT_DIR=%s/critical-report\nOPENRAILS_CRITICAL_SERVER_BINARY=%s/openrails-server-fixture.test\nOPENRAILS_CRITICAL_CLI_BINARY=%s/openrails\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Start owned PostgreSQL, Redis and Vault
        run: bash scripts/ci-services.sh start postgres redis vault
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: critical
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: sdk/billing-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            sdk/billing-ui/pnpm-lock.yaml
            server/web/console/pnpm-lock.yaml
            web/pay/pnpm-lock.yaml
      - name: Build and inspect browser artifacts once
        run: bash scripts/check.sh browser
      - name: Install the browser used by public client cases
        run: pnpm --dir sdk/billing-ui exec playwright install --with-deps chromium
      - name: Build the real standalone fixture once
        working-directory: critical/server-fixture
        run: GOWORK=off go test -race -c -p 2 -o "$OPENRAILS_CRITICAL_SERVER_BINARY" .
      - name: Build the public operator CLI once
        if: ${{ needs.scope.outputs.runtime == 'true' }}
        working-directory: server
        run: GOWORK=off go build -p 2 -o "$OPENRAILS_CRITICAL_CLI_BINARY" ./cmd/openrails
      - name: Services are ready
        run: bash scripts/ci-services.sh ready
      - name: Require every selected critical scenario
        env:
          FULL_RUNTIME: ${{ needs.scope.outputs.runtime }}
        run: |
          if [[ "$FULL_RUNTIME" == true ]]; then
            bash scripts/critical-tests.sh
          else
            bash scripts/critical-tests.sh --suite browser
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: critical-results
          path: ${{ runner.temp }}/critical-report/
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: critical
          save: "true"

  security:
    name: Required Security
    needs: scope
    if: ${{ needs.scope.outputs.security == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          family: security
      # The root module's ./... excludes each nested Go module.
      - name: Go SAST
        run: |
          gosec_bin="$(scripts/ci-install-tool.sh gosec)"
          for module in . server adapters/authkit examples; do
            (cd "$module" && "$gosec_bin" -severity high -confidence medium -exclude-dir=.agents ./...)
          done
      - name: Go vulnerability analysis
        run: |
          for module in . server adapters/authkit examples; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          done
      - name: Filesystem and dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The next step scans raw chart bytes and its actual release render.
          TRIVY_SKIP_DIRS: deploy/helm/openrails
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
      - name: Helm release security
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: bash scripts/ci/security-chart.sh
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: security
          save: "true"

  artifact-release:
    name: Release package smoke
    needs: scope
    if: ${{ needs.scope.outputs.artifacts == 'true' }}
    uses: ./.github/workflows/release.yaml
    with:
      snapshot: true
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

  artifact-image:
    name: Image smoke
    needs: scope
    if: ${{ needs.scope.outputs.artifacts == 'true' }}
    uses: ./.github/workflows/docker-publish.yaml
    with:
      snapshot: true
    permissions:
      contents: read
      packages: write
      pull-requests: write

  gate:
    name: ${{ (github.event.pull_request.draft || github.event.action == 'closed') && 'Inactive PR (CI not requested)' || 'CI Gate' }}
    needs: [scope, guards, lint, chart, sql, critical, security, artifact-release, artifact-image]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require every selected suite and the current base
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import json, os, re, subprocess
          from urllib.parse import quote
          result = json.loads(os.environ['RESULTS'])
          if result['scope']['result'] != 'success':
              raise SystemExit('Scope verification failed or did not run')
          plan = result['scope']['outputs']
          required = {'guards': None, 'lint': 'core', 'chart': 'chart',
                      'sql': 'runtime', 'security': 'security',
                      'artifact-release': 'artifacts', 'artifact-image': 'artifacts'}
          if plan.get('browser') not in ('true', 'false'):
              raise SystemExit('Missing browser selection')
          critical_expected = 'success' if plan['browser'] == 'true' or plan.get('runtime') == 'true' else 'skipped'
          if result['critical']['result'] != critical_expected:
              raise SystemExit(f"critical: {result['critical']['result']}; expected {critical_expected}")
          for job, suite in required.items():
              if suite is not None and plan.get(suite) not in ('true', 'false'):
                  raise SystemExit(f'Missing suite selection: {suite}')
              selected = suite is None or plan[suite] == 'true'
              expected = 'success' if selected else 'skipped'
              actual = result[job]['result']
              if actual != expected:
                  raise SystemExit(f'{job}: {actual}; expected {expected}')
          if os.environ['EVENT_NAME'] == 'pull_request':
              ref, base = plan.get('base_ref', ''), plan.get('base_sha', '')
              if not ref or not re.fullmatch(r'[0-9a-f]{40}', base):
                  raise SystemExit('Missing tested PR base identity')
              if ref != os.environ['EVENT_BASE_REF'] or base != os.environ['EVENT_BASE_SHA']:
                  raise SystemExit('Tested base differs from the PR event')
              endpoint = f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/ref/heads/{quote(ref, safe="/")}'
              current = subprocess.check_output(['gh', 'api', endpoint, '--jq', '.object.sha'], text=True).strip()
              if current != base:
                  raise SystemExit('Base moved during tests; update the PR and rerun')
          CHECK
