name: Validate

on:
  pull_request:
    branches: [master, "rc/**"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  merge_group:
  push:
    branches: [master, "rc/**"]
  workflow_dispatch:
    inputs:
      critical:
        description: Only these critical journeys or scenarios (J24 OR-J04-S80 …); such a run qualifies nothing
        type: string
        default: ""

permissions:
  contents: read

# Closing or drafting cancels the PR run. Ordinary draft updates use a separate
# group so a delayed draft event cannot cancel a newer ready-to-review run.
# Each merge group has its own ref and each dispatch its own run, so a dispatch
# cancels nothing. A push cancels the branch's older push check.
concurrency:
  group: validate-${{ github.event_name == 'merge_group' && github.ref || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event_name == 'push' && format('push-{0}', github.ref) || github.event.pull_request.draft && github.event.action != 'converted_to_draft' && github.event.action != 'closed' && format('draft-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: "2"
  GOFLAGS: -p=4

# Tiers (scripts/ci-scope.py):
#   light   a PR into rc/**: the suites its changes reach, no critical journeys.
#   queue   a merge group of rc/**'s merge queue: the light suites over the
#           group's combined changes (and every critical journey once switched on).
#   push    the push check, on every push to rc/** or master: the light suites
#           over the pushed range, plus the linked build. It blocks nothing and
#           saves the Go caches PRs restore.
#   full    a PR into master or a dispatch: every suite, gosec and every
#           critical journey.
#   focused a dispatch naming critical journeys or scenarios: only those, and no gate.
# Suite selection is deliberately coarse. Shared or unknown inputs fan out.
jobs:
  source:
    name: Source branch
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && !github.event.pull_request.draft && github.event.pull_request.base.ref == 'master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bash scripts/ci-source-branch.sh "$GITHUB_REPOSITORY" "$HEAD_REPOSITORY" "$HEAD_REF"

  scope:
    name: Scope
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
      core: ${{ steps.scope.outputs.core }}
      runtime: ${{ steps.scope.outputs.runtime }}
      browser: ${{ steps.scope.outputs.browser }}
      chart: ${{ steps.scope.outputs.chart }}
      security: ${{ steps.scope.outputs.security }}
      artifacts: ${{ steps.scope.outputs.artifacts }}
      critical: ${{ steps.scope.outputs.critical }}
      shards: ${{ steps.scope.outputs.shards }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the candidate and plan its tier
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CRITICAL: ${{ inputs.critical }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          plan=(python3 scripts/ci-scope.py --github-output "$GITHUB_OUTPUT")
          case "$EVENT" in
            workflow_dispatch)
              if [[ -n "$CRITICAL" ]]; then plan+=(--tier focused --critical "$CRITICAL"); else plan+=(--tier full); fi
              ;;
            pull_request)
              [[ "$GITHUB_REF" == refs/pull/*/merge ]]
              [[ "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" == 3 ]]
              test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
              test "$(git rev-parse HEAD^2)" = "$HEAD_SHA"
              git check-ref-format "refs/heads/$BASE_REF"
              echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
              if [[ "$BASE_REF" == rc/* ]]; then
                plan+=(--tier light --base "$BASE_SHA" --head "$GITHUB_SHA")
              else
                # Nothing heavy starts for a pull request master will refuse.
                bash scripts/ci-source-branch.sh "$GITHUB_REPOSITORY" "$HEAD_REPOSITORY" "$HEAD_REF"
                plan+=(--tier full)
              fi
              ;;
            merge_group)
              # The queue builds each group on its base and the groups ahead of it.
              [[ "$BASE_REF" == refs/heads/rc/* ]] || { echo "Only rc/** has a merge queue: $BASE_REF" >&2; exit 1; }
              test "$HEAD_SHA" = "$GITHUB_SHA"
              git merge-base --is-ancestor "$BASE_SHA" HEAD
              plan+=(--tier queue --base "$BASE_SHA" --head "$GITHUB_SHA")
              ;;
            push)
              # The pushed range; a new branch or a force push selects every suite.
              plan+=(--tier push --head "$GITHUB_SHA")
              if [[ ! "$BASE_SHA" =~ ^0+$ ]] && git merge-base --is-ancestor "$BASE_SHA" HEAD 2>/dev/null; then
                plan+=(--base "$BASE_SHA")
                {
                  echo "## Push check of ${GITHUB_REF_NAME}: ${BASE_SHA:0:9}..${GITHUB_SHA:0:9}"
                  echo '```'
                  git log --oneline --no-decorate -n 50 "$BASE_SHA..$GITHUB_SHA"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "## Push check of ${GITHUB_REF_NAME} at ${GITHUB_SHA:0:9} (new branch or force push: every suite)" >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "Unexpected event: $EVENT" >&2
              exit 1
              ;;
          esac
          "${plan[@]}" | tee "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"

  guards:
    name: Source guards
    needs: scope
    if: ${{ needs.scope.outputs.tier != 'focused' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      - run: python3 scripts/check-ci-policy.py
      - run: bash scripts/check.sh guards
      - run: bash scripts/scan-injected-code.sh --self-test
      - name: Workflow lint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  go:
    name: Vet and package tests
    needs: scope
    if: ${{ needs.scope.outputs.core == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # a push replaces the branch's plain cache
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      # The package tests compile every untagged package; linking every binary
      # is left to pushes and the full tier.
      - name: Build and link every module
        if: ${{ needs.scope.outputs.tier == 'push' || needs.scope.outputs.tier == 'full' }}
        run: bash scripts/check.sh build
      - name: The embedded library links no AuthKit runtime
        if: ${{ needs.scope.outputs.tier != 'push' && needs.scope.outputs.tier != 'full' }}
        run: bash scripts/check-embedded-auth-boundary.sh
      - run: bash scripts/check.sh vet
      - run: bash scripts/check.sh unit
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: plain
          save: "true"

  lint:
    name: Lint
    needs: scope
    if: ${{ needs.scope.outputs.core == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      - name: Read pinned lint version
        id: tool_versions
        shell: bash
        run: echo "golangci_lint=$(awk -F= '$1 == "GOLANGCI_LINT_VERSION" { print $2 }' tools/versions.conf)" >> "$GITHUB_OUTPUT"
      # Only pushes save the lint cache; pull requests restore their base's.
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          # config verify downloads the JSON schema from golangci-lint.run and times out.
          verify: false
          skip-save-cache: ${{ github.event_name != 'push' }}
          args: --timeout=15m --build-tags=integration
      - name: GolangCI-Lint (server module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          verify: false
          skip-save-cache: ${{ github.event_name != 'push' }}
          working-directory: server
          args: --timeout=15m --config ../.golangci.yaml
      - name: GolangCI-Lint (examples module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          verify: false
          skip-save-cache: ${{ github.event_name != 'push' }}
          working-directory: examples
          args: --timeout=15m --config ../.golangci.yaml
      - name: GolangCI-Lint (AuthKit adapter module)
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          verify: false
          skip-save-cache: ${{ github.event_name != 'push' }}
          working-directory: adapters/authkit
          args: --timeout=15m --config ../../.golangci.yaml

  chart:
    name: Helm chart
    needs: scope
    if: ${{ needs.scope.outputs.chart == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: HELM="$(scripts/ci-install-tool.sh helm)" bash scripts/check.sh chart

  sql:
    name: SQL bindings and query audit
    needs: scope
    if: ${{ needs.scope.outputs.runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Start PostgreSQL and ClickHouse
        run: bash scripts/ci-services.sh start postgres clickhouse
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      - name: PostgreSQL and ClickHouse are ready
        run: bash scripts/ci-services.sh ready
      - name: Generated SQL bindings match the queries
        env:
          SQLC_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable
        run: |
          sqlc_bin="$(scripts/ci-install-tool.sh sqlc)"
          export SQLC_DATABASE_URL="$(scripts/sqlc-vet-db.sh)"
          echo "SQLC_DATABASE_URL=$SQLC_DATABASE_URL" >> "$GITHUB_ENV"
          "$sqlc_bin" generate
          "$sqlc_bin" vet
          # Intent to add: a binding file new to the tree counts as drift too.
          git add -N -- internal/db/gen
          git diff --exit-code -- internal/db/gen
      # Bindings are generated against a database; a drifted run offers them as a patch to review and commit.
      # Intent-to-add entries stay out of the contracts patch's cached diff.
      - name: Save the regenerated SQL bindings as a patch
        if: ${{ failure() }}
        run: git add -N -- internal/db/gen && git diff --binary -- internal/db/gen > "$RUNNER_TEMP/regenerated-sqlc.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: regenerated-sqlc
          path: ${{ runner.temp }}/regenerated-sqlc.patch
      # api/, docs/api, the TypeScript wire types and compatibility/contract.json;
      # the schema lists are read from databases migrated on these servers.
      - name: Reviewed contracts are current
        if: ${{ !cancelled() }}
        run: go run ./scripts/contracts -dsn 'postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable' -clickhouse 127.0.0.1:19000
      # Snapshots are written against a database; a drifted run offers them as a patch to review and commit.
      # The SQL bindings are the regenerated-sqlc patch's, so the two never overlap.
      - name: Regenerate the drifted contracts as a patch
        if: ${{ failure() }}
        run: |
          go run ./scripts/contracts -write -dsn 'postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable' -clickhouse 127.0.0.1:19000
          git add -A -- . ':(exclude)internal/db/gen' && git diff --cached --binary > "$RUNNER_TEMP/regenerated-contracts.patch"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: regenerated-contracts
          path: ${{ runner.temp }}/regenerated-contracts.patch
      # A pull request that rewrites the migrations (a fold into the baseline)
      # must build the database its base's chain builds: identical pg_dump
      # output in billing and in a relocated schema. pg_dump 18 is the server
      # container's. It is proven where the rewrite enters its release candidate,
      # against the pull request's own base: a merge group or the candidate's
      # pull request into master also carries the schema changes merged beside
      # it, so its chain is not its base's.
      - name: Rewritten migrations build the base's schema
        if: ${{ !cancelled() && needs.scope.outputs.base_sha != '' && needs.scope.outputs.tier == 'light' }}
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Only added files: the chain grew, and nothing applied was rewritten.
          if [[ -z "$(git diff --name-only --diff-filter=a "$BASE_SHA" HEAD -- internal/migrate/postgres)" ]]; then
            echo 'No migration of the base was changed or removed.'
            exit 0
          fi
          go run ./scripts/schemaproof -ref "$BASE_SHA" \
            -dsn 'postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable' \
            -pg-dump 'docker exec critical-postgres pg_dump'

  browser:
    name: Browser build
    needs: scope
    if: ${{ needs.scope.outputs.browser == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/billing-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/billing-ui/pnpm-lock.yaml
            web/console/pnpm-lock.yaml
            web/pay/pnpm-lock.yaml
      - run: bash scripts/check.sh browser

  # The whole suite on CRITICAL_SHARDS runners (scripts/ci-scope.py), or a
  # focused selection on one.
  critical:
    name: Critical journeys ${{ matrix.shard }}
    needs: scope
    if: ${{ needs.scope.outputs.critical != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.shard == 'selected' && 70 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    env:
      OPENRAILS_CRITICAL_DSN: postgres://postgres:postgres@127.0.0.1:5432/openrails_test?sslmode=disable
      OPENRAILS_CRITICAL_REDIS_URL: redis://127.0.0.1:6379/0
      OPENRAILS_CRITICAL_VAULT_ADDR: http://127.0.0.1:8200
      OPENRAILS_CRITICAL_VAULT_TOKEN: critical-fixture-only
      OPENRAILS_CRITICAL_CLICKHOUSE_ADDR: 127.0.0.1:19000
      OPENRAILS_CRITICAL_PAYMENT_ASSETS: ${{ github.workspace }}/web/pay/dist
    steps:
      - name: Set owned fixture paths
        run: |
          printf 'OPENRAILS_CRITICAL_REPORT_DIR=%s/critical-report\nOPENRAILS_CRITICAL_SERVER_BINARY=%s/openrails-server-fixture.test\nOPENRAILS_CRITICAL_CLI_BINARY=%s/openrails\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Start owned PostgreSQL, Redis, Vault and ClickHouse
        run: bash scripts/ci-services.sh start postgres redis vault clickhouse
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: critical
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/billing-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/billing-ui/pnpm-lock.yaml
            web/console/pnpm-lock.yaml
            web/pay/pnpm-lock.yaml
      # The browser job checks them; the journeys load the builds.
      - name: Build the browser artifacts
        run: bash scripts/check.sh browser-build
      - name: Install the browser used by public client cases
        run: pnpm --dir web/billing-ui exec playwright install --with-deps chromium
      - name: Build the real standalone fixture once
        working-directory: critical/server-fixture
        env:
          GOMAXPROCS: "4"
        run: GOWORK=off go test -tags integration -race -c -p 4 -o "$OPENRAILS_CRITICAL_SERVER_BINARY" .
      - name: Build the public operator CLI once
        working-directory: server
        env:
          GOMAXPROCS: "4"
        run: GOWORK=off go build -p 4 -o "$OPENRAILS_CRITICAL_CLI_BINARY" ./cmd/openrails
      - name: Services are ready
        run: bash scripts/ci-services.sh ready
      - name: Require the shard's or the selected critical scenarios
        env:
          SHARD: ${{ matrix.shard }}
          SELECTION: ${{ needs.scope.outputs.critical }}
        run: |
          args=()
          if [[ "$SHARD" == selected ]]; then
            for item in $SELECTION; do
              if [[ "$item" == J* ]]; then args+=(--journey "$item"); else args+=(--case "$item"); fi
            done
            # Never the whole suite: a focused run with no selection fails.
            ((${#args[@]})) || exit 1
          else
            [[ "$SELECTION" == all ]]
            args=(--shard "$SHARD")
          fi
          bash scripts/critical-tests.sh "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.shard == 'selected' && 'critical-results' || format('critical-results-{0}', strategy.job-index) }}
          path: ${{ runner.temp }}/critical-report/
          if-no-files-found: error
          retention-days: 7

  # The shards' reports together: every scenario of critical/coverage.json ran
  # and passed exactly once, and no test ran in two shards.
  critical-coverage:
    name: Critical coverage
    needs: [scope, critical]
    if: ${{ !cancelled() && needs.scope.outputs.critical == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: critical-results-*
          path: ${{ runner.temp }}/critical
      - name: Every scenario ran once across the shards
        env:
          SHARDS: ${{ needs.scope.outputs.shards }}
        run: |
          set -euo pipefail
          reports=("$RUNNER_TEMP"/critical/*/events.jsonl)
          expected="$(python3 -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$SHARDS")"
          ((${#reports[@]} == expected)) || { echo "${#reports[@]} shard reports; expected $expected" >&2; exit 1; }
          python3 scripts/critical-results.py critical/coverage.json "${reports[@]}"

  # A push saves the critical build cache the shards of dispatches on the RC
  # (and merge groups) restore.
  critical-cache:
    name: Critical build cache
    needs: scope
    if: ${{ needs.scope.outputs.tier == 'push' && (needs.scope.outputs.core == 'true' || needs.scope.outputs.runtime == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write # a push replaces the branch's critical cache
    env:
      GOMAXPROCS: "4"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: critical
      - name: Build the critical package, its fixture and the CLI as the shards do
        run: |
          go test -tags=integration -race -c -o "$RUNNER_TEMP/critical.test" ./critical
          (cd critical/server-fixture && go test -tags integration -race -c -o "$RUNNER_TEMP/fixture.test" .)
          (cd server && go build -o "$RUNNER_TEMP/openrails" ./cmd/openrails)
      - uses: ./.github/actions/go-cache
        if: ${{ !cancelled() }}
        with:
          family: critical
          save: "true"

  security:
    name: Required Security
    needs: scope
    if: ${{ needs.scope.outputs.security == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOMAXPROCS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # As in the builds, go switches to go.mod's toolchain line (GOTOOLCHAIN=auto),
          # so the scan sees the stdlib the binaries ship; its go line is consumers' floor.
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-remote-cache
        with:
          credentials: ${{ github.event_name == 'push' && secrets.GO_REMOTE_CACHE_RW || secrets.GO_REMOTE_CACHE_RO }}
      - uses: ./.github/actions/go-cache
        with:
          family: plain
      # gosec takes about ten minutes; it runs before every release (full).
      # The root module's ./... excludes each nested Go module.
      - name: Go SAST
        if: ${{ needs.scope.outputs.tier == 'full' }}
        run: |
          gosec_bin="$(scripts/ci-install-tool.sh gosec)"
          for module in . server adapters/authkit examples; do
            (cd "$module" && "$gosec_bin" -severity high -confidence medium ./...)
          done
      - name: Go vulnerability analysis
        run: |
          for module in . server adapters/authkit examples; do
            (cd "$module" && go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...)
          done
      - name: Filesystem and dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The next step scans raw chart bytes and its actual release render.
          TRIVY_SKIP_DIRS: deploy/helm/openrails
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
      - name: Helm release security
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: bash scripts/ci/security-chart.sh

  # release.yaml and docker-publish.yaml publish on a push event, so a push
  # never calls them.
  artifact-release:
    name: Release package smoke
    needs: scope
    if: ${{ needs.scope.outputs.artifacts == 'true' && github.event_name != 'push' }}
    uses: ./.github/workflows/release.yaml
    with:
      snapshot: true
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write

  artifact-image:
    name: Image smoke
    needs: scope
    if: ${{ needs.scope.outputs.artifacts == 'true' && github.event_name != 'push' }}
    uses: ./.github/workflows/docker-publish.yaml
    with:
      snapshot: true
    # A caller grants at least what the called jobs declare; its publish job
    # (attestations) runs only on release tags.
    permissions:
      contents: read
      packages: write
      pull-requests: write
      id-token: write
      attestations: write

  # Required as CI Gate on rc/** pull requests and merge groups and on master.
  # A push reports Push check instead, so its light result never stands in for
  # the full tier on a release head.
  gate:
    name: ${{ github.event_name == 'push' && 'Push check' || (github.event.pull_request.draft || github.event.action == 'closed') && 'Inactive PR (CI not requested)' || 'CI Gate' }}
    needs: [source, scope, guards, go, lint, chart, sql, browser, critical, critical-coverage, critical-cache, security, artifact-release, artifact-image]
    if: ${{ always() && needs.scope.outputs.tier != 'focused' && (github.event_name != 'pull_request' || (github.event.action != 'closed' && !github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected suite
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'CHECK'
          import json, os
          result = json.loads(os.environ['RESULTS'])
          if os.environ['EVENT_NAME'] == 'push':
              # Red on the RC: whoever pushed the range fixes it first.
              failed = [f"{job}: {need['result']}" for job, need in result.items() if need['result'] not in ('success', 'skipped')]
              pushed = f"{os.environ['PUSHED_FROM'][:9]}..{os.environ['GITHUB_SHA'][:9]}"
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"## Push check of {os.environ['GITHUB_REF_NAME']} {pushed}: " + ("failed\n\n" + "\n".join(f"- {line}" for line in failed) if failed else "passed") + "\n")
              for line in failed:
                  print(f"::error title=Push check {pushed} is red::{line}")
          event, target = os.environ['EVENT_NAME'], os.environ['EVENT_BASE_REF']
          if result['source']['result'] == 'failure':
              raise SystemExit('master takes pull requests only from rc/X.Y.Z and chore/release-vX.Y.Z; see the Source branch job')
          if result['scope']['result'] != 'success':
              raise SystemExit('Scope verification failed or did not run')
          plan = result['scope']['outputs']
          if event == 'pull_request':
              tier = 'light' if target.startswith('rc/') else 'full' if target == 'master' else None
          else:
              tier = {'merge_group': 'queue', 'push': 'push', 'workflow_dispatch': 'full'}.get(event)
          if tier is None or plan.get('tier') != tier:
              raise SystemExit(f"tier: {plan.get('tier')}; expected {tier} for {event} {target}")
          suites = ('core', 'runtime', 'browser', 'chart', 'security', 'artifacts')
          if any(plan.get(suite) not in ('true', 'false') for suite in suites):
              raise SystemExit('Missing suite selection')
          on = {suite: plan[suite] == 'true' for suite in suites}
          critical = plan.get('critical', '')
          if tier == 'full' and not (all(on.values()) and critical == 'all'):
              raise SystemExit('A full run skips no suite and runs every critical scenario')
          if critical not in ('', 'all') or (critical and tier not in ('full', 'queue')):
              raise SystemExit(f'Unexpected critical selection for the {tier} tier: {critical}')
          if tier == 'push' and on['artifacts']:
              raise SystemExit('A push never calls the publishing workflows')
          expected = {
              'source': event == 'pull_request' and target == 'master',
              'guards': True, 'go': on['core'], 'lint': on['core'], 'chart': on['chart'],
              'sql': on['runtime'], 'browser': on['browser'], 'security': on['security'],
              'artifact-release': on['artifacts'], 'artifact-image': on['artifacts'],
              'critical': critical == 'all', 'critical-coverage': critical == 'all',
              'critical-cache': tier == 'push' and (on['core'] or on['runtime']),
          }
          for job, selected in expected.items():
              want = 'success' if selected else 'skipped'
              if result[job]['result'] != want:
                  raise SystemExit(f"{job}: {result[job]['result']}; expected {want}")
          if event == 'pull_request' and plan.get('base_sha') != os.environ['EVENT_BASE_SHA']:
              raise SystemExit('Tested base differs from the PR event')
          CHECK
