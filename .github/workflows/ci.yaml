name: Validate

on:
  pull_request:
    branches: [master]
  # Dispatch on master after releases to refresh caches shared with new PRs.
  # PR-scoped caches cannot warm other pull requests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOMAXPROCS: "2"
  GOFLAGS: -p=4

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          printf 'build=%s\nmodules=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Separate jobs; save each successful revision's newly compiled source.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'adapters/*/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'adapters/*/go.sum') }}-
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - run: bash scripts/check.sh checks
      - name: Read pinned lint version
        id: tool_versions
        shell: bash
        run: echo "golangci_lint=$(awk -F= '$1 == "GOLANGCI_LINT_VERSION" { print $2 }' tools/versions.conf)" >> "$GITHUB_OUTPUT"
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ steps.tool_versions.outputs.golangci_lint }}
          args: --timeout=15m

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Leave room for browser/build/SQLC setup before the Go test process's own
    # 25-minute timeout, so a stalled test can report its goroutine stacks.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: test_password
        ports: [5432:5432]
        options: --tmpfs /var/lib/postgresql:rw,size=2g --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPENRAILS_TEST_DB_DSN: postgres://admin:test_password@127.0.0.1:5432/openrails_test?sslmode=disable
      # Keep tests serial within a package; independent processes own Redis.
      OPENRAILS_TEST_PACKAGES: "4"
      # The integration harness contains independent top-level workflows but
      # is one Go package. Give each process its own test database/Redis so a
      # slow provider scenario cannot hold the complete E2E lane hostage.
      OPENRAILS_TEST_HARNESS_SHARDS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          printf 'build=%s\nmodules=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Separate jobs; save each successful revision's newly compiled source.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'adapters/*/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'adapters/*/go.sum') }}-
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0
        with:
          package_json_file: tests/browser/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tests/browser/pnpm-lock.yaml
      - name: Install the browser
        run: |
          pnpm --dir tests/browser install --frozen-lockfile --ignore-scripts
          pnpm --dir tests/browser exec playwright install --with-deps chromium
      - name: Build the admin console
        # Browser-tagged integration contracts serve the real console from
        # web/admin/dist. The checks job runs on a separate runner, so its
        # build cannot be reused by this E2E job.
        run: bash scripts/build-admin-console.sh web/admin/dist
      - run: bash scripts/check.sh e2e
      - name: Retain workflow test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-test-events-${{ github.run_attempt }}
          path: .reports/v1-workflows.jsonl
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Required Security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          printf 'build=%s\nmodules=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # Separate jobs; save each successful revision's newly compiled source.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'adapters/*/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum', 'adapters/*/go.sum') }}-
            go-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - name: Scan the complete tracked tree
        run: |
          bash scripts/scan-injected-code.sh --all
          bash scripts/scan-injected-code.sh --self-test
      - name: Go SAST
        run: |
          gosec_bin="$(scripts/ci-install-tool.sh gosec)"
          "$gosec_bin" -severity high -confidence medium -exclude-dir=.agents ./...
      - name: Go vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Filesystem and dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          exit-code: '1'
          ignore-unfixed: true
          scanners: vuln,secret,misconfig
