name: Validate Code

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Run the JavaScript-based actions (checkout, setup-go) on Node.js 24. Those
# actions still declare the Node 20 runtime, which GitHub deprecates on
# 2026-06-16; this opts into the new runtime ahead of the cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
        continue-on-error: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Vet (integration tag)
        # Compile guard for integration-tagged packages: dep bumps (authkit
        # v0.78.0, v0.80.0) broke them silently twice because default builds
        # never compile these files.
        run: go vet -tags integration ./...
      - name: Test
        run: go test -race ./...

  sqlc:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: openrails_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest
      # task sqlc builds a throwaway vet DB from migrations/ via
      # scripts/sqlc-vet-db.sh (defaults target the service container above),
      # regenerates internal/db/gen, PREPAREs every query (sqlc vet), and
      # fails if the committed generated code is stale.
      - name: sqlc generate + vet + diff
        env:
          POSTGRES_HOST_PORT: "5434"
        run: task sqlc-check

  # Admin console SPA (#754: dist is NOT committed, so nothing else compiles
  # web/admin) — lint + typecheck+build the frontend, then prove the tagged Go
  # binary embeds the produced dist.
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build console (npm ci + tsc + vite)
        run: bash scripts/build-admin-console.sh cmd/openrails/consoleassets/dist
      - name: Lint console
        run: npm run lint
        working-directory: web/admin
      - name: Tagged Go build embeds the dist
        run: go vet -tags console_assets ./...

  integration:
    runs-on: ubuntu-latest
    # ENFORCING (#694): the suite runs green and now gates merges. The serial
    # run is ~20-25 min (go test itself is capped at 25m inside the script);
    # the job timeout adds headroom for image pulls + module download.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download modules
        run: go mod download
      # Integration tests share one compose-backed Postgres/Garnet stack and
      # run serially. The script expands ./... to only the packages carrying
      # the `integration` build tag (#790) so the serial run doesn't repeat
      # the build job's unit tests. Testcontainers remain capped fallbacks
      # for direct package runs, not the normal CI path.
      - name: Integration test
        run: bash scripts/test_integration.sh ./...
