name: sdk-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the package to (e.g. v0.170.0)
        required: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  billing-ui:
    name: Attach @openrails/billing-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    defaults:
      run:
        working-directory: sdk/billing-ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/billing-ui/package.json
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Version from tag
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - name: Build release archive
        run: |
          mkdir release
          pnpm pack --pack-destination release
          ls "release/openrails-billing-ui-${TAG#v}.tgz"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
