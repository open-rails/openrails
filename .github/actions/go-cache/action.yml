name: Go caches
description: >-
  Restores a family of Go build/module caches. Only a push to rc/** or master
  saves one, in that branch's scope: pull requests restore their base's, and
  everything else master's. Other events saving would evict those from the
  repository's cache quota.

inputs:
  family:
    description: Cache family; jobs that build the same way share one.
    required: true
  save:
    description: "'true' saves (end of job, pushes only); otherwise restores (after setup-go)."
    default: "false"
runs:
  using: composite
  steps:
    - name: Name the cache
      id: name
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        printf 'build=%s\nmodules=%s\n' "$(go env GOCACHE)" "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        sum="$(cat go.sum server/go.sum examples/go.sum | sha256sum | cut -c1-16)"
        # cgo objects differ between runner images, and so does everything built on them.
        prefix="go-v3-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-${{ inputs.family }}-$(go env GOVERSION)"
        printf 'prefix=%s\nsum=%s\nkey=%s\n' "$prefix-" "$prefix-$sum-" "$prefix-$sum-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - name: Restore Go caches
      id: restore
      if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.name.outputs.build }}
          ${{ steps.name.outputs.modules }}
        key: ${{ steps.name.outputs.key }}
        restore-keys: |
          ${{ steps.name.outputs.sum }}
          ${{ steps.name.outputs.prefix }}
    - name: Remember what was restored
      if: ${{ inputs.save != 'true' }}
      shell: bash
      env:
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        echo "GO_CACHE_RESTORED=${MATCHED:-none}" >> "$GITHUB_ENV"
        echo "Restored ${MATCHED:-no Go cache}"
    - name: Save Go caches
      if: ${{ !cancelled() && inputs.save == 'true' && github.event_name == 'push' && env.GO_CACHE_RESTORED != steps.name.outputs.key }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.name.outputs.build }}
          ${{ steps.name.outputs.modules }}
        key: ${{ steps.name.outputs.key }}
