name: Go caches
description: >-
  After go-remote-cache: restores a family of Go build/module caches. With the
  remote build cache on (GOCACHEPROG), Go never reads GOCACHE, so only the
  module cache is kept, one entry per go.sum for every family. Only a push to
  rc/** or master saves, in that branch's scope, and then deletes the family's
  older entries there. Pull requests restore their base's; dispatches on the
  RC its own; everything else master's.

inputs:
  family:
    description: Cache family; jobs that build the same way share one.
    required: true
  save:
    description: "'true' saves (end of job, pushes only; the job needs actions: write); otherwise restores (after setup-go)."
    default: "false"
runs:
  using: composite
  steps:
    - name: Name the cache
      id: name
      if: ${{ !cancelled() }}
      shell: bash
      env:
        FAMILY: ${{ inputs.family }}
        SAVE: ${{ inputs.save }}
      run: |
        modules="$(go env GOMODCACHE)"
        sum="$(cat go.sum server/go.sum examples/go.sum | sha256sum | cut -c1-16)"
        # setup-go installs go.mod's go line, and its own go env downloads the
        # toolchain line's release into the module cache. The cache holds that
        # release too, and tar cannot write over its read-only files, so it goes
        # first: the restore brings it back, or the next go command downloads it.
        if [[ "$SAVE" != true ]]; then
          for toolchain in "$modules"/golang.org/toolchain@*; do
            if [[ -e "$toolchain" ]]; then chmod -R u+w "$toolchain"; rm -rf "$toolchain"; fi
          done
        fi
        if [[ -n "${GOCACHEPROG:-}" ]]; then
          printf 'paths<<EOF\n%s\nEOF\n' "$modules" >> "$GITHUB_OUTPUT"
          family="go-v5-${RUNNER_OS}-modules-"
          printf 'family=%s\nprefix=%s\nsum=%s\nkey=%s\n' "$family" "$family" "$family" "$family$sum" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        printf 'paths<<EOF\n%s\n%s\nEOF\n' "$(go env GOCACHE)" "$modules" >> "$GITHUB_OUTPUT"
        # cgo objects differ between runner images, and so does everything built on them.
        family="go-v5-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-$FAMILY-"
        prefix="$family$(go env GOVERSION)-"
        printf 'family=%s\nprefix=%s\nsum=%s\nkey=%s\n' "$family" "$prefix" "$prefix$sum-" "$prefix$sum-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - name: Restore Go caches
      id: restore
      if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.name.outputs.paths }}
        key: ${{ steps.name.outputs.key }}
        restore-keys: |
          ${{ steps.name.outputs.sum }}
          ${{ steps.name.outputs.prefix }}
    - name: Remember what was restored
      if: ${{ inputs.save != 'true' }}
      shell: bash
      env:
        MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        echo "GO_CACHE_RESTORED=${MATCHED:-none}" >> "$GITHUB_ENV"
        echo "Restored ${MATCHED:-no Go cache}"
    - name: Save Go caches
      id: save
      if: ${{ !cancelled() && inputs.save == 'true' && github.event_name == 'push' && env.GO_CACHE_RESTORED != steps.name.outputs.key }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.name.outputs.paths }}
        key: ${{ steps.name.outputs.key }}
    - name: Delete the family's older entries on this branch
      if: ${{ !cancelled() && steps.save.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FAMILY: ${{ steps.name.outputs.family }}
        KEY: ${{ steps.name.outputs.key }}
      run: |
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&key=$FAMILY" \
          --jq '.actions_caches[] | select(.key != env.KEY) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || echo "::warning::could not delete cache $id"
          done
